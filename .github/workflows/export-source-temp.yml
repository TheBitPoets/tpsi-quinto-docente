name: Export source temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          if-no-files-found: error
          retention-days: 1
          path: |
            .github/workflows/quality.yml
            content/tpsi5
            doc/OPEN_DECISIONS.md
            doc/course_designs/tpsi_quinto_2026_2027.json
            activities/tpsi5
            tests
