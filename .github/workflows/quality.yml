name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout TPSI quinto content pack
        uses: actions/checkout@v4

      - name: Checkout pinned accepted TheBitLab Content Pack v1 contracts
        uses: actions/checkout@v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: 5472eef86568a4e7ce59ad34ba937220df27efd7
          path: _thebitlab-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js for deterministic JavaScript grading
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Validate Content Pack, Course Design and Activities
        env:
          PYTHONPATH: ${{ github.workspace }}/_thebitlab-platform
        run: python -m pytest -q tests/test_tpsi_quinto_content_pack.py tests/test_tpsi_quinto_javascript_dom.py
