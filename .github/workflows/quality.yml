name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  content-pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout TPSI quinto content pack
        uses: actions/checkout@v4

      - name: Checkout pinned accepted TheBitLab Content Pack v1 contracts
        uses: actions/checkout@v4
        with:
          repository: TheBitPoets/2cornot2c
          ref: 5472eef86568a4e7ce59ad34ba937220df27efd7
          path: _thebitlab-platform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js for deterministic JS, SQL, auth, SSR, Vue, TypeScript, realtime and backend E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Install Express for native-vs-framework reference
        working-directory: activities/tpsi5/node_http_express_a/starter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Express for Feisbuc memory-store reference
        working-directory: activities/tpsi5/feisbuc_express_c/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Express for debug reference solution
        working-directory: activities/tpsi5/express_debug_d/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Express for Feisbuc SQL reference solution
        working-directory: activities/tpsi5/feisbuc_sql_c/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Express for Feisbuc auth reference solution
        working-directory: activities/tpsi5/feisbuc_auth_c/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Nunjucks mini-render reference
        working-directory: activities/tpsi5/nunjucks_autoescape_b/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Compose Feisbuc SSR reference from milestone 7
        run: python tests/compose_ssr_reference.py

      - name: Install Express and Nunjucks for composed SSR reference
        working-directory: _ssr-reference
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Vue reactivity microscope
        working-directory: activities/tpsi5/vue_reactivity_a/starter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build Vue reactivity microscope
        working-directory: activities/tpsi5/vue_reactivity_a/starter
        run: npm run build

      - name: Install Vue PostCard reference
        working-directory: activities/tpsi5/vue_post_card_b/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build Vue PostCard reference
        working-directory: activities/tpsi5/vue_post_card_b/solution
        run: npm run build

      - name: Install Feisbuc Vue SPA reference
        working-directory: activities/tpsi5/feisbuc_vue_c/solution/frontend
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build Feisbuc Vue SPA reference
        working-directory: activities/tpsi5/feisbuc_vue_c/solution/frontend
        run: npm run build

      - name: Install Vue debug starter
        working-directory: activities/tpsi5/vue_debug_d/starter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build Vue debug starter
        working-directory: activities/tpsi5/vue_debug_d/starter
        run: npm run build

      - name: Install Vue debug reference solution
        working-directory: activities/tpsi5/vue_debug_d/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build Vue debug reference solution
        working-directory: activities/tpsi5/vue_debug_d/solution
        run: npm run build

      - name: Compose Feisbuc Vue reference from milestone 7 and Vite dist
        run: python tests/compose_vue_reference.py

      - name: Install Express for composed Vue reference
        working-directory: _vue-reference
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Vue Router microscope
        working-directory: activities/tpsi5/vue_router_microscope_a/starter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build Vue Router microscope
        working-directory: activities/tpsi5/vue_router_microscope_a/starter
        run: npm run build

      - name: Compose Feisbuc milestone 9 with Vue Router overlay
        run: python tests/compose_vue_router_frontend.py

      - name: Install routed Vue frontend
        working-directory: _vue-router-frontend
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build routed Vue frontend
        working-directory: _vue-router-frontend
        run: npm run build

      - name: Compose routed Vue frontend with auth backend
        run: python tests/compose_vue_router_reference.py

      - name: Install Express for routed Vue backend reference
        working-directory: _vue-router-reference
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install TypeScript contract microscope
        working-directory: activities/tpsi5/typescript_contract_microscope_a/starter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Type-check TypeScript contract microscope
        working-directory: activities/tpsi5/typescript_contract_microscope_a/starter
        run: npm run type-check

      - name: Install typed navigation policy
        working-directory: activities/tpsi5/typescript_navigation_policy_b/starter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Type-check typed navigation policy
        working-directory: activities/tpsi5/typescript_navigation_policy_b/starter
        run: npm run type-check

      - name: Install TypeScript debug starter
        working-directory: activities/tpsi5/typescript_debug_d/starter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install TypeScript debug reference solution
        working-directory: activities/tpsi5/typescript_debug_d/solution
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Compose milestone 10 with TypeScript overlay
        run: python tests/compose_typescript_frontend.py

      - name: Install typed Feisbuc frontend
        working-directory: _typescript-frontend
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Type-check typed Feisbuc frontend
        working-directory: _typescript-frontend
        run: npm run type-check

      - name: Build typed Feisbuc frontend
        working-directory: _typescript-frontend
        run: npm run build

      - name: Compose typed frontend with auth backend
        run: python tests/compose_typescript_reference.py

      - name: Install Express for typed backend reference
        working-directory: _typescript-reference
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Compose milestone 11 with realtime frontend overlay
        run: python tests/compose_realtime_frontend.py

      - name: Install realtime Feisbuc frontend
        working-directory: _realtime-frontend
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Type-check realtime Feisbuc frontend
        working-directory: _realtime-frontend
        run: npm run type-check

      - name: Build realtime Feisbuc frontend
        working-directory: _realtime-frontend
        run: npm run build

      - name: Compose realtime frontend with auth backend
        run: python tests/compose_realtime_reference.py

      - name: Install Express and Socket.IO for realtime backend reference
        working-directory: _realtime-reference
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Socket.IO two-client probe
        working-directory: tests/realtime_probe
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Validate Content Pack, Course Design, Activities and reference runtimes
        env:
          PYTHONPATH: ${{ github.workspace }}/_thebitlab-platform
        run: >-
          python -m pytest -q
          tests/test_tpsi_quinto_content_pack.py
          tests/test_tpsi_quinto_javascript_dom.py
          tests/test_tpsi_quinto_http_fetch.py
          tests/test_tpsi_quinto_node_express.py
          tests/test_tpsi_quinto_sql_persistence.py
          tests/test_tpsi_quinto_auth_security.py
          tests/test_tpsi_quinto_ssr_nunjucks.py
          tests/test_tpsi_quinto_vue_spa.py
          tests/test_tpsi_quinto_vue_router.py
          tests/test_tpsi_quinto_typescript.py
          tests/test_tpsi_quinto_realtime.py
