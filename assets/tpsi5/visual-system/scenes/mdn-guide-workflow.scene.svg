<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../mdn-guide-workflow.svg" role="img" aria-labelledby="title desc">
  <title id="title">Processo operativo per usare MDN durante una lezione</title>
  <desc id="desc">Il processo parte da una domanda, identifica la pagina e lo stato, estrae il contratto, prova un esempio, verifica e ritorna all'attività.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="workBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="workShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".3"/></filter>
    <marker id="workArrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0 0l20 10L0 20z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#workBg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="76" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">IL RITUALE MDN DEL CORSO</text>
    <text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">Una consultazione breve deve produrre una decisione e una prova</text>

    <g filter="url(#workShadow)">
      <g transform="translate(75 210)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#2563eb"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">1</text><text x="150" y="104" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="800">DEFINISCI</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">la domanda tecnica</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">“Che cosa devo sapere?”</text></g>
      <g transform="translate(440 210)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#0ea5e9"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">2</text><text x="150" y="104" text-anchor="middle" fill="#075985" font-size="20" font-weight="800">APRI</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">il link della lezione</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">evita ricerche casuali</text></g>
      <g transform="translate(805 210)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#0d9488"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">3</text><text x="150" y="104" text-anchor="middle" fill="#0f766e" font-size="20" font-weight="800">RICONOSCI</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">Learn, Guide, Reference</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">oppure Glossary</text></g>
      <g transform="translate(1170 210)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#d97706"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">4</text><text x="150" y="104" text-anchor="middle" fill="#92400e" font-size="20" font-weight="800">CONTROLLA</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">stato e compatibilità</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">prima dei dettagli</text></g>
      <g transform="translate(1535 210)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#4f46e5"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">5</text><text x="150" y="104" text-anchor="middle" fill="#3730a3" font-size="20" font-weight="800">SELEZIONA</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">le sezioni richieste</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">studia · riconosci · rimanda</text></g>

      <g transform="translate(1535 600)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#4f46e5"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">6</text><text x="150" y="104" text-anchor="middle" fill="#3730a3" font-size="20" font-weight="800">ESTRAI</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">il contratto essenziale</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">input · output · errori</text></g>
      <g transform="translate(1170 600)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#7c3aed"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">7</text><text x="150" y="104" text-anchor="middle" fill="#5b21b6" font-size="20" font-weight="800">PROVA</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">un esempio minimo</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">poi modificalo</text></g>
      <g transform="translate(805 600)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#7c3aed"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">8</text><text x="150" y="104" text-anchor="middle" fill="#5b21b6" font-size="20" font-weight="800">PREVEDI</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">il risultato prima</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">di eseguire il codice</text></g>
      <g transform="translate(440 600)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#16a34a"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">9</text><text x="150" y="104" text-anchor="middle" fill="#166534" font-size="20" font-weight="800">VERIFICA</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">con browser e DevTools</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">confronta le ipotesi</text></g>
      <g transform="translate(75 600)"><rect width="300" height="220" rx="28" fill="#f8fafc"/><circle cx="52" cy="52" r="30" fill="#059669"/><text x="52" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">10</text><text x="150" y="104" text-anchor="middle" fill="#065f46" font-size="20" font-weight="800">APPLICA</text><text x="150" y="141" text-anchor="middle" fill="#52677f" font-size="17">alla consegna del corso</text><text x="150" y="176" text-anchor="middle" fill="#52677f" font-size="16">e conserva il link</text></g>
    </g>

    <g fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#workArrow)"><path d="M375 320h42"/><path d="M740 320h42"/><path d="M1105 320h42"/><path d="M1470 320h42"/><path d="M1685 430v142"/><path d="M1535 710h-42"/><path d="M1170 710h-42"/><path d="M805 710h-42"/><path d="M440 710h-42"/></g>
    <rect x="350" y="915" width="1220" height="70" rx="35" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="959" text-anchor="middle" fill="#e2e8f0" font-size="21">La documentazione diventa competenza quando sai trasformarla in codice osservabile.</text>
  </g>
</svg>
