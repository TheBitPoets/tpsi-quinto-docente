<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../03-bootstrap-native-framework-choice.svg" role="img" aria-labelledby="title desc"><title id="title">Scelta fra utility, componente e CSS personalizzato</title><desc id="desc">Un albero decisionale parte dalla responsabilità da implementare e conduce a utility Bootstrap, componente Bootstrap o CSS del prodotto.</desc><defs id="visual-kit-components"/><defs><linearGradient id="nfcBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="nfcSh"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".3"/></filter><marker id="nfcArr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker></defs><rect width="1920" height="1080" fill="url(#nfcBg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="76" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">CHI DEVE POSSEDERE QUESTA REGOLA?</text><text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">La scelta dipende dalla responsabilità, non da una preferenza assoluta</text><g filter="url(#nfcSh)"><rect x="600" y="185" width="720" height="140" rx="36" fill="#f8fafc" stroke="#38bdf8" stroke-width="5"/><rect x="80" y="485" width="520" height="330" rx="36" fill="#eff6ff" stroke="#3b82f6" stroke-width="5"/><rect x="700" y="485" width="520" height="330" rx="36" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><rect x="1320" y="485" width="520" height="330" rx="36" fill="#ffedd5" stroke="#fb923c" stroke-width="5"/></g><text x="960" y="244" text-anchor="middle" fill="#102a43" font-size="28" font-weight="800">Quale problema sto risolvendo?</text><text x="960" y="284" text-anchor="middle" fill="#52677f" font-size="20">piccola proprietà · pattern condiviso · identità del prodotto</text><path d="M960 330v80H340v55" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#nfcArr)"/><path d="M960 330v135" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#nfcArr)"/><path d="M960 410h620v55" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#nfcArr)"/>
<text x="340" y="560" text-anchor="middle" fill="#1d4ed8" font-size="29" font-weight="800">UTILITY</text><text x="340" y="610" text-anchor="middle" fill="#52677f" font-size="20">Responsabilità piccola</text><text x="340" y="646" text-anchor="middle" fill="#52677f" font-size="20">e standard</text><rect x="165" y="690" width="350" height="70" rx="20" fill="#dbeafe"/><text x="340" y="734" text-anchor="middle" fill="#1d4ed8" font-size="20" font-weight="800">d-flex · gap-3 · mb-2</text>
<text x="960" y="560" text-anchor="middle" fill="#5b21b6" font-size="29" font-weight="800">COMPONENTE</text><text x="960" y="610" text-anchor="middle" fill="#52677f" font-size="20">Pattern comune con</text><text x="960" y="646" text-anchor="middle" fill="#52677f" font-size="20">struttura documentata</text><rect x="785" y="690" width="350" height="70" rx="20" fill="#ddd6fe"/><text x="960" y="734" text-anchor="middle" fill="#5b21b6" font-size="20" font-weight="800">card · navbar · btn</text>
<text x="1580" y="560" text-anchor="middle" fill="#9a3412" font-size="29" font-weight="800">CSS CUSTOM</text><text x="1580" y="610" text-anchor="middle" fill="#52677f" font-size="20">Identità o pattern</text><text x="1580" y="646" text-anchor="middle" fill="#52677f" font-size="20">specifico di Feisbuc</text><rect x="1405" y="690" width="350" height="70" rx="20" fill="#fed7aa"/><text x="1580" y="734" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="800">.feisbuc-post-header</text>
<rect x="260" y="895" width="1400" height="110" rx="55" fill="#ecfdf5"/><text x="960" y="940" text-anchor="middle" fill="#14532d" font-size="22" font-weight="800">SE SERVONO MOLTI OVERRIDE, RIVALUTA LA SCELTA</text><text x="960" y="974" text-anchor="middle" fill="#52677f" font-size="19">Il framework deve ridurre il lavoro e chiarire le convenzioni, non essere combattuto.</text></g></svg>
