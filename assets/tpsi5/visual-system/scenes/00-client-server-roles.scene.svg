<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-client-server-roles.svg" role="img" aria-labelledby="title desc">
  <title id="title">Client e server: hardware e software</title>
  <desc id="desc">Il client è mostrato come dispositivo con browser; il server come macchina che esegue software web. Richiesta e risposta attraversano la rete.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="clientHead" x1="0" x2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="serverHead" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <marker id="requestArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#38bdf8"/></marker>
    <marker id="responseArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#34d399"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="110" cy="120" r="310" fill="#0ea5e9" opacity=".07"/><circle cx="1830" cy="1030" r="360" fill="#10b981" opacity=".07"/>
  <text x="960" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800">CLIENT E SERVER: DUE RUOLI</text>
  <text x="960" y="110" text-anchor="middle" fill="#b8c8dc" font-family="Inter,Arial,sans-serif" font-size="23">Possiamo osservarli come dispositivi e come programmi</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="55" y="155" width="690" height="770" rx="34" fill="#f8fafc"/>
    <path d="M89 155h622a34 34 0 0 1 34 34v76H55v-76a34 34 0 0 1 34-34z" fill="url(#clientHead)"/>
    <text x="95" y="225" fill="white" font-size="38" font-weight="800">CLIENT</text><text x="700" y="223" text-anchor="end" fill="#dbeafe" font-size="21" font-weight="800">CHIEDE</text>
    <text x="100" y="318" fill="#1e3a5f" font-size="21" font-weight="800" letter-spacing="3">HARDWARE</text>
    <rect x="100" y="345" width="600" height="330" rx="26" fill="#e8f4ff"/>
    <use href="#tpsi-laptop" x="135" y="365" width="530" height="300"/>
    <use href="#tpsi-browser" x="250" y="400" width="300" height="178"/>
    <text x="400" y="700" text-anchor="middle" fill="#334155" font-size="19">PC · tablet · smartphone</text>
    <text x="100" y="730" fill="#1e3a5f" font-size="21" font-weight="800" letter-spacing="3">SOFTWARE</text>
    <rect x="100" y="756" width="600" height="115" rx="24" fill="#e8f4ff"/>
    <text x="400" y="806" text-anchor="middle" fill="#102a43" font-size="27" font-weight="800">BROWSER</text>
    <text x="400" y="842" text-anchor="middle" fill="#52677f" font-size="18">Firefox · Chrome · Safari · Edge</text>

    <rect x="1175" y="155" width="690" height="770" rx="34" fill="#f8fafc"/>
    <path d="M1209 155h622a34 34 0 0 1 34 34v76h-690v-76a34 34 0 0 1 34-34z" fill="url(#serverHead)"/>
    <text x="1215" y="225" fill="white" font-size="38" font-weight="800">SERVER</text><text x="1820" y="223" text-anchor="end" fill="#d1fae5" font-size="21" font-weight="800">RISPONDE</text>
    <text x="1220" y="318" fill="#14532d" font-size="21" font-weight="800" letter-spacing="3">HARDWARE</text>
    <rect x="1220" y="345" width="600" height="330" rx="26" fill="#eafbf3"/>
    <use href="#tpsi-server" x="1320" y="365" width="400" height="285"/>
    <text x="1520" y="700" text-anchor="middle" fill="#334155" font-size="19">macchina fisica · virtuale · cloud</text>
    <text x="1220" y="730" fill="#14532d" font-size="21" font-weight="800" letter-spacing="3">SOFTWARE</text>
    <rect x="1220" y="756" width="600" height="115" rx="24" fill="#eafbf3"/>
    <text x="1520" y="806" text-anchor="middle" fill="#064e3b" font-size="25" font-weight="800">WEB SERVER / BACKEND</text>
    <text x="1520" y="842" text-anchor="middle" fill="#52677f" font-size="18">Apache · Nginx · IIS · Node.js + Express</text>
  </g>

  <use href="#tpsi-network" x="835" y="410" width="250" height="250"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="800">
    <path d="M770 348h365" fill="none" stroke="#38bdf8" stroke-width="9" marker-end="url(#requestArrow)"/><text x="950" y="323" fill="#7dd3fc" font-size="21">RICHIESTA</text>
    <path d="M1150 727H785" fill="none" stroke="#34d399" stroke-width="9" marker-end="url(#responseArrow)"/><text x="970" y="766" fill="#6ee7b7" font-size="21">RISPOSTA</text>
    <text x="960" y="690" fill="#dbeafe" font-size="22">RETE</text>
  </g>
  <rect x="315" y="976" width="1290" height="54" rx="27" fill="#e2e8f0" opacity=".12"/>
  <text x="960" y="1011" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="21">Su localhost i due ruoli possono essere svolti da programmi eseguiti sullo stesso computer.</text>
</svg>
