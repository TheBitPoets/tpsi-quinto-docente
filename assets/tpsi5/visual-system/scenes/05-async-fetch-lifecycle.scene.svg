<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-async-fetch-lifecycle.svg" role="img" aria-labelledby="title desc"><title id="title">Due confini asincroni di Fetch</title><desc id="desc">Fetch restituisce subito una Promise pending. Await sospende soltanto la funzione corrente. La prima Promise produce una Response quando arrivano gli header; la lettura del body è un secondo confine asincrono.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">FETCH HA DUE CONFINI ASINCRONI</text><text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">ottenere la Response e consumarne il body sono operazioni distinte</text><path d="M150 535H1770" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
<g transform="translate(90 260)"><rect width="360" height="210" rx="30" fill="#fffbea" stroke="#facc15" stroke-width="5"/><text x="180" y="60" text-anchor="middle" fill="#713f12" font-size="24" font-weight="800">1 · CHIAMATA</text><text x="180" y="112" text-anchor="middle" fill="#713f12" font-size="19" font-family="monospace">fetch(url)</text><text x="180" y="164" text-anchor="middle" fill="#7c5b24" font-size="18">restituisce subito Promise</text></g><g transform="translate(530 260)"><rect width="360" height="210" rx="30" fill="#fffbeb" stroke="#f59e0b" stroke-width="5"/><text x="180" y="60" text-anchor="middle" fill="#92400e" font-size="24" font-weight="800">2 · PENDING</text><text x="180" y="112" text-anchor="middle" fill="#78350f" font-size="19">la rete procede</text><text x="180" y="164" text-anchor="middle" fill="#7c5b24" font-size="18">il browser non è bloccato</text></g><g transform="translate(970 260)"><rect width="360" height="210" rx="30" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><text x="180" y="60" text-anchor="middle" fill="#075985" font-size="24" font-weight="800">3 · RESPONSE</text><text x="180" y="112" text-anchor="middle" fill="#0c4a6e" font-size="19">header disponibili</text><text x="180" y="164" text-anchor="middle" fill="#52677f" font-size="18">status · ok · headers</text></g><g transform="translate(1410 260)"><rect width="410" height="210" rx="30" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><text x="205" y="60" text-anchor="middle" fill="#5b21b6" font-size="24" font-weight="800">4 · BODY</text><text x="205" y="112" text-anchor="middle" fill="#4c1d95" font-size="19" font-family="monospace">await response.json()</text><text x="205" y="164" text-anchor="middle" fill="#6d5a90" font-size="18">seconda Promise · parsing</text></g>
<rect x="220" y="650" width="1480" height="120" rx="30" fill="#f8fafc"/><text x="960" y="700" text-anchor="middle" fill="#102a43" font-size="25" font-weight="800">await NON FERMA LA PAGINA</text><text x="960" y="741" text-anchor="middle" fill="#52677f" font-size="20">sospende soltanto la funzione async corrente; altri eventi e task possono continuare</text><g transform="translate(325 840)"><rect width="1270" height="120" rx="28" fill="#ecfdf5"/><text x="635" y="888" text-anchor="middle" fill="#166534" font-size="22" font-weight="800">FULFILLED ≠ SUCCESSO HTTP</text><text x="635" y="928" text-anchor="middle" fill="#3f5f4b" font-size="19">anche una Response 404 soddisfa la Promise di fetch: controlla status e ok</text></g></g></svg>
