  <title id="title">Copertura della documentazione nella lezione Bootstrap</title><desc id="desc">Otto nuclei della dispensa sono collegati alle pagine Bootstrap e MDN. Verde significa coperto, ambra da riconoscere e grigio più avanti.</desc>
