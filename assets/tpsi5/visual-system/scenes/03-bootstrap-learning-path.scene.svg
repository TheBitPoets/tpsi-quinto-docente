<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../03-bootstrap-learning-path.svg" role="img" aria-labelledby="title desc"><title id="title">Percorso di apprendimento Bootstrap</title><desc id="desc">Dai fondamenti CSS si passa all'API Bootstrap, quindi a layout, utility e componenti, fino a una UI Feisbuc verificata.</desc><defs id="visual-kit-components"/><defs><linearGradient id="blpBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="blpSh"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".3"/></filter><marker id="blpArr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker></defs><rect width="1920" height="1080" fill="url(#blpBg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="78" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">DAL MODELLO MENTALE AL PRODOTTO</text><text x="960" y="122" text-anchor="middle" fill="#b8c8dc" font-size="22">Bootstrap accelera il lavoro quando ogni astrazione resta collegata al suo fondamento</text>
<g filter="url(#blpSh)"><rect x="95" y="275" width="320" height="390" rx="38" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><rect x="470" y="275" width="320" height="390" rx="38" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><rect x="845" y="275" width="320" height="390" rx="38" fill="#ecfeff" stroke="#06b6d4" stroke-width="5"/><rect x="1220" y="275" width="320" height="390" rx="38" fill="#ffedd5" stroke="#fb923c" stroke-width="5"/><rect x="1595" y="275" width="230" height="390" rx="38" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/></g><g text-anchor="middle"><text x="255" y="355" fill="#075985" font-size="26" font-weight="800">CSS NATIVO</text><text x="255" y="418" fill="#52677f" font-size="19">cascade</text><text x="255" y="458" fill="#52677f" font-size="19">Flexbox</text><text x="255" y="498" fill="#52677f" font-size="19">media query</text><text x="255" y="570" fill="#075985" font-size="18" font-weight="800">capisco il motore</text><text x="630" y="355" fill="#5b21b6" font-size="26" font-weight="800">API BOOTSTRAP</text><text x="630" y="418" fill="#52677f" font-size="19">Reboot</text><text x="630" y="458" fill="#52677f" font-size="19">classi</text><text x="630" y="498" fill="#52677f" font-size="19">convenzioni</text><text x="630" y="570" fill="#5b21b6" font-size="18" font-weight="800">leggo l’astrazione</text><text x="1005" y="355" fill="#155e75" font-size="26" font-weight="800">LAYOUT</text><text x="1005" y="418" fill="#52677f" font-size="19">container</text><text x="1005" y="458" fill="#52677f" font-size="19">row</text><text x="1005" y="498" fill="#52677f" font-size="19">12 colonne</text><text x="1005" y="570" fill="#155e75" font-size="18" font-weight="800">organizzo lo spazio</text><text x="1380" y="355" fill="#9a3412" font-size="25" font-weight="800">UI</text><text x="1380" y="418" fill="#52677f" font-size="19">utility</text><text x="1380" y="458" fill="#52677f" font-size="19">componenti</text><text x="1380" y="498" fill="#52677f" font-size="19">Collapse</text><text x="1380" y="570" fill="#9a3412" font-size="18" font-weight="800">compongo pattern</text><text x="1710" y="355" fill="#166534" font-size="24" font-weight="800">FEISBUC</text><text x="1710" y="418" fill="#52677f" font-size="18">responsive</text><text x="1710" y="458" fill="#52677f" font-size="18">accessibile</text><text x="1710" y="498" fill="#52677f" font-size="18">testato</text><text x="1710" y="570" fill="#166534" font-size="17" font-weight="800">dimostro</text></g><g fill="none" stroke="#38bdf8" stroke-width="7"><path d="M420 470h27" marker-end="url(#blpArr)"/><path d="M795 470h27" marker-end="url(#blpArr)"/><path d="M1170 470h27" marker-end="url(#blpArr)"/><path d="M1545 470h27" marker-end="url(#blpArr)"/></g><rect x="260" y="780" width="1400" height="150" rx="45" fill="#f8fafc"/><text x="960" y="830" text-anchor="middle" fill="#102a43" font-size="22" font-weight="800">VELOCITÀ SENZA MAGIA</text><text x="960" y="872" text-anchor="middle" fill="#52677f" font-size="20">Ogni classe deve poter essere spiegata, ispezionata e verificata.</text><text x="960" y="910" text-anchor="middle" fill="#166534" font-size="19" font-weight="800">Il framework è uno strumento; la responsabilità del risultato resta allo sviluppatore.</text></g></svg>
