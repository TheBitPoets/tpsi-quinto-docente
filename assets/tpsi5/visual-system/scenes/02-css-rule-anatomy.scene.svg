<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-css-rule-anatomy.svg" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia di una regola CSS</title><desc id="desc">Una regola CSS evidenzia selettore, blocco delle dichiarazioni, proprietà, valore e singola dichiarazione.</desc><defs id="visual-kit-components"/>
  <defs><linearGradient id="ruleBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="ruleShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter></defs><rect width="1920" height="1080" fill="url(#ruleBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="82" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">ANATOMIA DI UNA REGOLA CSS</text><text x="960" y="126" text-anchor="middle" fill="#b8c8dc" font-size="22">Il selettore sceglie; ogni dichiarazione assegna un valore a una proprietà</text>
    <g filter="url(#ruleShadow)"><rect x="130" y="210" width="1660" height="330" rx="34" fill="#f8fafc"/><rect x="185" y="265" width="1550" height="220" rx="24" fill="#0f172a"/></g>
    <text x="960" y="360" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="50" font-weight="700"><tspan fill="#38bdf8">.post</tspan><tspan fill="#e2e8f0"> { </tspan><tspan fill="#a78bfa">padding</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">1rem</tspan><tspan fill="#e2e8f0">; </tspan><tspan fill="#a78bfa">border</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">1px solid</tspan><tspan fill="#e2e8f0">; }</tspan></text>
    <g text-anchor="middle"><path d="M360 485v110" stroke="#38bdf8" stroke-width="5"/><rect x="175" y="595" width="370" height="135" rx="24" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="360" y="642" fill="#075985" font-size="23" font-weight="800">SELETTORE</text><text x="360" y="680" fill="#0c4a6e" font-size="18">quali elementi?</text>
      <path d="M815 485v245" stroke="#a78bfa" stroke-width="5"/><rect x="630" y="730" width="370" height="135" rx="24" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/><text x="815" y="777" fill="#5b21b6" font-size="23" font-weight="800">PROPRIETÀ</text><text x="815" y="815" fill="#4c1d95" font-size="18">quale caratteristica?</text>
      <path d="M1080 485v110" stroke="#34d399" stroke-width="5"/><rect x="895" y="595" width="370" height="135" rx="24" fill="#d1fae5" stroke="#34d399" stroke-width="3"/><text x="1080" y="642" fill="#065f46" font-size="23" font-weight="800">VALORE</text><text x="1080" y="680" fill="#166534" font-size="18">quale impostazione?</text>
      <path d="M1505 485v245" stroke="#fb923c" stroke-width="5"/><rect x="1320" y="730" width="370" height="135" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="1505" y="777" fill="#9a3412" font-size="23" font-weight="800">DICHIARAZIONE</text><text x="1505" y="815" fill="#7c2d12" font-size="18">proprietà + valore</text></g>
    <rect x="350" y="940" width="1220" height="70" rx="35" fill="#f59e0b" opacity=".16"/><text x="960" y="984" text-anchor="middle" fill="#fde68a" font-size="21">Una dichiarazione non valida viene ignorata; le altre restano utilizzabili.</text>
  </g>
</svg>
