<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../01-mdn-semantics-coverage.svg" role="img" aria-labelledby="title desc">
  <title id="title">Mappa di copertura MDN per semantica, accessibilità e strumenti</title>
  <desc id="desc">A sinistra sono elencate le sezioni della dispensa, a destra i paragrafi MDN corrispondenti. Verde significa coperto, ambra introdotto, grigio più avanti.</desc>
