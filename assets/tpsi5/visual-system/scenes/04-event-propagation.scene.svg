<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-output="../../04-event-propagation.svg" role="img" aria-labelledby="title desc">
  <title id="title">Propagazione di un evento nel DOM</title>
  <desc id="desc">Un click attraversa capture, target e bubbling. Event target resta il bottone originario; currentTarget indica l'elemento il cui listener è in esecuzione.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="down" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#38bdf8"/></marker><marker id="up" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#22c55e"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="800" y="62" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="800">IL VIAGGIO DI UN CLICK NEL DOM</text>
    <text x="800" y="102" text-anchor="middle" fill="#b8c8dc" font-size="21">Capture → target → bubbling; la delegation sfrutta la risalita verso un contenitore stabile</text>

    <g transform="translate(465 150)">
      <rect width="670" height="610" rx="40" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/>
      <text x="335" y="48" text-anchor="middle" fill="#0c4a6e" font-size="21" font-weight="800">document</text>
      <rect x="68" y="78" width="534" height="470" rx="34" fill="#f0fdf4" stroke="#22c55e" stroke-width="5"/>
      <text x="335" y="116" text-anchor="middle" fill="#166534" font-size="21" font-weight="800">section#feed · listener delegato</text>
      <rect x="138" y="156" width="394" height="310" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="5"/>
      <text x="335" y="195" text-anchor="middle" fill="#9a3412" font-size="21" font-weight="800">article[data-post-id]</text>
      <rect x="220" y="257" width="230" height="104" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="5"/>
      <text x="335" y="302" text-anchor="middle" fill="#78350f" font-size="22" font-weight="800">button Like</text>
      <text x="335" y="334" text-anchor="middle" fill="#92400e" font-size="16">origine del click</text>
      <circle cx="335" cy="309" r="76" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="10 9"/>

      <path d="M98 56v426" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#down)"/>
      <text x="75" y="274" transform="rotate(-90 75 274)" text-anchor="middle" fill="#075985" font-size="18" font-weight="800">1 · CAPTURE</text>
      <path d="M572 482V56" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#up)"/>
      <text x="595" y="274" transform="rotate(90 595 274)" text-anchor="middle" fill="#166534" font-size="18" font-weight="800">3 · BUBBLING</text>
      <rect x="240" y="386" width="190" height="42" rx="21" fill="#fde68a"/><text x="335" y="414" text-anchor="middle" fill="#78350f" font-size="16" font-weight="800">2 · TARGET</text>
    </g>

    <g transform="translate(55 178)">
      <rect width="350" height="250" rx="28" fill="#f8fafc"/>
      <text x="25" y="44" fill="#102a43" font-size="20" font-weight="800">NEL LISTENER DEL FEED</text>
      <text x="25" y="90" fill="#075985" font-size="18" font-family="monospace">event.target</text>
      <text x="25" y="119" fill="#52677f" font-size="17">→ il button cliccato</text>
      <text x="25" y="165" fill="#166534" font-size="18" font-family="monospace">event.currentTarget</text>
      <text x="25" y="194" fill="#52677f" font-size="17">→ section#feed</text>
      <text x="25" y="228" fill="#7c3aed" font-size="16" font-weight="700">target non cambia durante il viaggio</text>
    </g>
    <g transform="translate(1195 178)">
      <rect width="350" height="250" rx="28" fill="#f8fafc"/>
      <text x="25" y="44" fill="#102a43" font-size="20" font-weight="800">DELEGAZIONE</text>
      <text x="25" y="86" fill="#334155" font-size="17">1. ascolta il contenitore</text>
      <text x="25" y="121" fill="#334155" font-size="17">2. risali con closest()</text>
      <text x="25" y="156" fill="#334155" font-size="17">3. riconosci l'azione</text>
      <text x="25" y="191" fill="#334155" font-size="17">4. aggiorna lo stato</text>
      <text x="25" y="226" fill="#166534" font-size="16" font-weight="700">funziona anche per nodi creati dopo</text>
    </g>
    <g transform="translate(145 795)">
      <rect width="1310" height="70" rx="24" fill="#f8fafc"/>
      <text x="655" y="29" text-anchor="middle" fill="#102a43" font-size="19" font-weight="800">NON CONFONDERE DUE AZIONI DIVERSE</text>
      <text x="655" y="54" text-anchor="middle" fill="#52677f" font-size="17"><tspan font-family="monospace">preventDefault()</tspan> annulla l'azione predefinita · <tspan font-family="monospace">stopPropagation()</tspan> ferma la propagazione</text>
    </g>
  </g>
</svg>
