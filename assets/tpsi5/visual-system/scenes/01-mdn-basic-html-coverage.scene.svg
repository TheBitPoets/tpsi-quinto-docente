    <text x="960" y="104" text-anchor="middle" fill="#b8c8dc" font-size="21">Quali parti di “Basic HTML syntax” sono comprese nel percorso italiano</text>
    <text x="390" y="158" text-anchor="middle" fill="#7dd3fc" font-size="22" font-weight="800">PARAGRAFI DELLA DISPENSA</text>
    <text x="1530" y="158" text-anchor="middle" fill="#86efac" font-size="22" font-weight="800">PARAGRAFI DEL TUTORIAL MDN</text>

    <g filter="url(#basicCoverageShadow)">
      <g transform="translate(64 190)"><rect width="650" height="72" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="30" fill="#0c4a6e" font-size="20" font-weight="800">Che cos’è la Web Platform</text><text x="26" y="55" fill="#52677f" font-size="16">HTML, documento .html, index.html e tag minuscoli</text></g>
      <g transform="translate(64 282)"><rect width="650" height="72" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="30" fill="#0c4a6e" font-size="20" font-weight="800">Anatomia, annidamento ed elementi vuoti</text><text x="26" y="55" fill="#52677f" font-size="16">tag, contenuto, chiusure corrette, void elements</text></g>
      <g transform="translate(64 374)"><rect width="650" height="72" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="30" fill="#0c4a6e" font-size="20" font-weight="800">Attributi, booleani e virgolette</text><text x="26" y="55" fill="#52677f" font-size="16">nome, valore, disabled e convenzioni del corso</text></g>
      <g transform="translate(64 466)"><rect width="650" height="72" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="30" fill="#0c4a6e" font-size="20" font-weight="800">Lo scheletro moderno di una pagina</text><text x="26" y="55" fill="#52677f" font-size="16">doctype, html, head, meta, title e body</text></g>
      <g transform="translate(64 558)"><rect width="650" height="72" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="30" fill="#0c4a6e" font-size="20" font-weight="800">Spazi bianchi e indentazione</text><text x="26" y="55" fill="#52677f" font-size="16">normalizzazione degli spazi e codice leggibile</text></g>
      <g transform="translate(64 650)"><rect width="650" height="72" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="30" fill="#0c4a6e" font-size="20" font-weight="800">Caratteri speciali e commenti</text><text x="26" y="55" fill="#52677f" font-size="16">character references e commenti HTML</text></g>
      <g transform="translate(64 742)"><rect width="650" height="72" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="30" fill="#0c4a6e" font-size="20" font-weight="800">Laboratorio della lezione</text><text x="26" y="55" fill="#52677f" font-size="16">esercizi equivalenti applicati al progetto Feisbuc</text></g>

