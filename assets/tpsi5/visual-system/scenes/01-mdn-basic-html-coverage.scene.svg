<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../01-mdn-basic-html-coverage.svg" role="img" aria-labelledby="title desc">
  <title id="title">Mappa di copertura del tutorial MDN Basic HTML syntax</title>
  <desc id="desc">A sinistra sono elencate le sezioni della dispensa, a destra le parti corrispondenti del tutorial MDN. Verde significa coperto, ambra introdotto, grigio più avanti. Le frecce mostrano i raccordi.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="basicCoverageBackground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="basicCoverageShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/></filter>
    <marker id="basicCoveredArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker>
    <marker id="basicIntroducedArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#basicCoverageBackground)"/>
  <circle cx="48" cy="70" r="260" fill="#0ea5e9" opacity=".08"/><circle cx="1870" cy="1000" r="330" fill="#16a34a" opacity=".07"/>
  <g font-family="Inter,Arial,sans-serif">
