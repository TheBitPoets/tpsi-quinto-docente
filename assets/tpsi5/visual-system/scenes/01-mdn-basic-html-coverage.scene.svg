      <g transform="translate(1206 374)"><rect width="650" height="72" rx="20" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="17" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="31" fill="#14532d" font-size="18" font-weight="800">Attributes</text><text x="166" y="55" fill="#3f5f4b" font-size="15">Boolean attributes · Quotes · Adding attributes</text></g>
      <g transform="translate(1206 466)"><rect width="650" height="72" rx="20" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="17" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="43" fill="#14532d" font-size="19" font-weight="800">Anatomy of an HTML document</text></g>
      <g transform="translate(1206 558)"><rect width="650" height="72" rx="20" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="17" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="43" fill="#14532d" font-size="19" font-weight="800">Whitespace in HTML</text></g>
      <g transform="translate(1206 650)"><rect width="650" height="72" rx="20" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="17" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="31" fill="#14532d" font-size="18" font-weight="800">Character references</text><text x="166" y="55" fill="#3f5f4b" font-size="15">HTML comments</text></g>
      <g transform="translate(1206 742)"><rect width="650" height="72" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><rect x="18" y="17" width="142" height="38" rx="19" fill="#d97706"/><text x="89" y="42" text-anchor="middle" fill="white" font-size="14" font-weight="800">INTRODOTTO</text><text x="180" y="31" fill="#78350f" font-size="18" font-weight="800">Interactive challenges</text><text x="180" y="55" fill="#785e32" font-size="15">utili, ma non obbligatori né copiati alla lettera</text></g>
    </g>

