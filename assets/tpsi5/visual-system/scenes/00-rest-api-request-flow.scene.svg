<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-rest-api-request-flow.svg" role="img" aria-labelledby="title desc">
  <title id="title">Come funziona una REST API</title>
  <desc id="desc">Un client invia una richiesta HTTP GET a un URL. La REST API associa l'URL a una route, estrae l'identificatore della risorsa, attiva il servizio, interroga il database e restituisce una risposta HTTP in JSON.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <filter id="restShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".32"/></filter>
    <marker id="restRequest" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0 0l26 13L0 26z" fill="#38bdf8"/></marker>
    <marker id="restResponse" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0 0l26 13L0 26z" fill="#34d399"/></marker>
    <marker id="restInternal" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0 0l22 11L0 22z" fill="#0d9488"/></marker>
    <marker id="restData" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0 0l22 11L0 22z" fill="#4f46e5"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="60" cy="70" r="280" fill="#2563eb" opacity=".08"/><circle cx="1880" cy="1030" r="390" fill="#4f46e5" opacity=".08"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="70" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">COME FUNZIONA UNA REST API</text>
    <text x="960" y="112" text-anchor="middle" fill="#b8c8dc" font-size="22">Il metodo indica l'azione · l'URL identifica la risorsa · la route accoglie la richiesta</text>

    <g filter="url(#restShadow)">
      <rect x="45" y="190" width="420" height="720" rx="32" fill="#f8fafc"/>
      <path d="M77 190h356a32 32 0 0 1 32 32v82H45v-82a32 32 0 0 1 32-32z" fill="#2563eb"/>
      <text x="255" y="259" text-anchor="middle" fill="white" font-size="31" font-weight="800">CLIENT</text>
      <text x="255" y="339" text-anchor="middle" fill="#1e3a5f" font-size="19" font-weight="800">BROWSER / APP</text>
      <use href="#tpsi-browser" x="105" y="365" width="300" height="192"/>

      <rect x="90" y="590" width="330" height="92" rx="22" fill="#dbeafe"/>
      <text x="255" y="626" text-anchor="middle" fill="#1e3a5f" font-size="18" font-weight="800">VUOLE LEGGERE LA RISORSA</text>
      <text x="255" y="656" text-anchor="middle" fill="#1d4ed8" font-size="18" font-weight="800">post con ID 42</text>

      <rect x="90" y="715" width="330" height="145" rx="22" fill="#d1fae5"/>
      <text x="255" y="750" text-anchor="middle" fill="#166534" font-size="17" font-weight="800">RICEVE JSON</text>
      <text x="255" y="790" text-anchor="middle" fill="#14532d" font-family="ui-monospace,Menlo,monospace" font-size="15">{ "id": 42,</text>
      <text x="255" y="818" text-anchor="middle" fill="#14532d" font-family="ui-monospace,Menlo,monospace" font-size="15">"text": "Ciao a tutti" }</text>
      <text x="255" y="846" text-anchor="middle" fill="#166534" font-size="11">Content-Type: application/json</text>
    </g>

    <g filter="url(#restShadow)">
      <rect x="640" y="155" width="1235" height="775" rx="34" fill="#f8fafc"/>
      <path d="M674 155h1167a34 34 0 0 1 34 34v78H640v-78a34 34 0 0 1 34-34z" fill="#059669"/>
      <text x="688" y="220" fill="white" font-size="35" font-weight="800">SERVER</text>
      <text x="1825" y="217" text-anchor="end" fill="#d1fae5" font-size="19" font-weight="800">NODE.JS · EXPRESS</text>

      <rect x="695" y="305" width="500" height="555" rx="28" fill="#e6fffa" stroke="#2dd4bf" stroke-width="4"/>
      <text x="945" y="349" text-anchor="middle" fill="#0f766e" font-size="22" font-weight="800">REST API · ROTTA DI INGRESSO</text>
      <use href="#tpsi-route" x="735" y="378" width="140" height="109"/>
      <use href="#tpsi-api" x="925" y="375" width="205" height="137"/>

      <rect x="735" y="535" width="420" height="205" rx="22" fill="#ccfbf1"/>
      <text x="770" y="577" fill="#52677f" font-size="16" font-weight="800">METODO HTTP</text>
      <text x="1120" y="577" text-anchor="end" fill="#0f766e" font-family="ui-monospace,Menlo,monospace" font-size="18" font-weight="800">GET</text>
      <text x="770" y="619" fill="#52677f" font-size="16" font-weight="800">URL DEL CLIENT</text>
      <text x="1120" y="619" text-anchor="end" fill="#0f766e" font-family="ui-monospace,Menlo,monospace" font-size="17">/api/posts/42</text>
      <text x="770" y="661" fill="#52677f" font-size="16" font-weight="800">ROTTA DEL SERVER</text>
      <text x="1120" y="661" text-anchor="end" fill="#0f766e" font-family="ui-monospace,Menlo,monospace" font-size="17">/api/posts/:id</text>
      <text x="770" y="703" fill="#52677f" font-size="16" font-weight="800">PARAMETRO ESTRATTO</text>
      <text x="1120" y="703" text-anchor="end" fill="#0f766e" font-family="ui-monospace,Menlo,monospace" font-size="17">id = 42</text>

      <rect x="735" y="770" width="420" height="56" rx="28" fill="#99f6e4"/>
      <text x="945" y="807" text-anchor="middle" fill="#115e59" font-size="17" font-weight="800">INTERFACCIA PUBBLICA</text>

      <rect x="1280" y="305" width="500" height="230" rx="28" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="4"/>
      <use href="#tpsi-service" x="1310" y="345" width="190" height="154"/>
      <text x="1640" y="365" text-anchor="middle" fill="#065f46" font-size="24" font-weight="800">SERVIZIO BACKEND</text>
      <text x="1640" y="414" text-anchor="middle" fill="#166534" font-family="ui-monospace,Menlo,monospace" font-size="19" font-weight="800">recuperaPost(42)</text>
      <text x="1640" y="456" text-anchor="middle" fill="#52677f" font-size="16">applica le regole</text>
      <text x="1640" y="485" text-anchor="middle" fill="#52677f" font-size="16">e prepara il risultato</text>

      <rect x="1280" y="615" width="500" height="245" rx="28" fill="#eef2ff" stroke="#a5b4fc" stroke-width="4"/>
      <use href="#tpsi-database" x="1335" y="645" width="205" height="146"/>
      <text x="1660" y="672" text-anchor="middle" fill="#3730a3" font-size="24" font-weight="800">DATABASE</text>
      <text x="1660" y="718" text-anchor="middle" fill="#52677f" font-size="17">risorsa: <tspan font-weight="800">post</tspan></text>
      <text x="1660" y="755" text-anchor="middle" fill="#52677f" font-size="17">identificatore: <tspan font-weight="800">42</tspan></text>
      <text x="1530" y="825" text-anchor="middle" fill="#4338ca" font-family="ui-monospace,Menlo,monospace" font-size="16">SELECT ... WHERE id = 42</text>
    </g>

    <path d="M465 390H675" fill="none" stroke="#38bdf8" stroke-width="8" marker-end="url(#restRequest)"/>
    <text x="570" y="326" text-anchor="middle" fill="#7dd3fc" font-size="17" font-weight="800">RICHIESTA HTTP</text>
    <text x="570" y="356" text-anchor="middle" fill="#dbeafe" font-family="ui-monospace,Menlo,monospace" font-size="15">GET /api/posts/42</text>

    <path d="M675 785H465" fill="none" stroke="#34d399" stroke-width="8" marker-end="url(#restResponse)"/>
    <text x="570" y="832" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="800">RISPOSTA HTTP</text>
    <text x="570" y="857" text-anchor="middle" fill="#d1fae5" font-size="15" font-weight="800">200 OK · JSON</text>

    <path d="M1195 420h65" fill="none" stroke="#0d9488" stroke-width="7" marker-end="url(#restInternal)"/>
    <text x="1228" y="390" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="800">ATTIVA</text>
    <path d="M1530 535v60" fill="none" stroke="#4f46e5" stroke-width="7" marker-end="url(#restData)"/>
    <text x="1570" y="574" fill="#4338ca" font-size="15" font-weight="800">SQL</text>

    <rect x="190" y="972" width="1540" height="66" rx="33" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="999" text-anchor="middle" fill="#dbeafe" font-size="17" font-weight="800">STESSA RISORSA: /api/posts/42</text>
    <text x="960" y="1026" text-anchor="middle" fill="#b8c8dc" font-size="17">GET recupera · PATCH modifica · DELETE cancella   |   POST /api/posts crea una nuova risorsa</text>
  </g>
</svg>
