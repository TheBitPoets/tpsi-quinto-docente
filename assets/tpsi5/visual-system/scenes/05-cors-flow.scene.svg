<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-cors-flow.svg" role="img" aria-labelledby="title desc"><title id="title">Same-origin e flusso CORS con preflight</title><desc id="desc">Nel caso same-origin il browser chiama direttamente l'API. Nel caso cross-origin può inviare una richiesta OPTIONS di preflight; il server dichiara la policy e il browser decide se esporre la risposta allo script.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">CORS È UNA POLICY APPLICATA DAL BROWSER</text><text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">origin = schema + host + porta</text><g transform="translate(80 230)"><use href="#tpsi-browser" width="380" height="245"/><text x="190" y="292" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="800">FRONTEND · :5173</text></g><g transform="translate(1470 230)"><use href="#tpsi-server" width="360" height="275"/><text x="180" y="325" text-anchor="middle" fill="#86efac" font-size="23" font-weight="800">API · :3000</text></g>
<rect x="535" y="205" width="850" height="130" rx="28" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="4"/><text x="960" y="250" text-anchor="middle" fill="#5b21b6" font-size="23" font-weight="800">1 · PREFLIGHT, QUANDO RICHIESTO</text><text x="960" y="295" text-anchor="middle" fill="#4c1d95" font-size="19" font-family="monospace">OPTIONS · Origin · Access-Control-Request-Method/Headers</text><path d="M470 370H1440" fill="none" stroke="#a78bfa" stroke-width="7" stroke-dasharray="16 11" marker-end="url(#a)"/><path d="M1440 450H470" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#b)"/><text x="960" y="490" text-anchor="middle" fill="#86efac" font-size="19">Access-Control-Allow-Origin / Methods / Headers</text>
<rect x="535" y="565" width="850" height="130" rx="28" fill="#eff6ff" stroke="#38bdf8" stroke-width="4"/><text x="960" y="610" text-anchor="middle" fill="#075985" font-size="23" font-weight="800">2 · REQUEST E RESPONSE EFFETTIVE</text><text x="960" y="655" text-anchor="middle" fill="#0c4a6e" font-size="19">il browser invia la request soltanto se la policy lo consente</text><path d="M470 735H1440" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/><path d="M1440 815H470" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#b)"/><rect x="380" y="900" width="1160" height="105" rx="28" fill="#f8fafc"/><text x="960" y="941" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">CORS NON È LOGIN E NON BLOCCA CLIENT NON-BROWSER</text><text x="960" y="978" text-anchor="middle" fill="#52677f" font-size="19">la Console spiega la policy; JavaScript riceve soltanto un errore generico</text></g></svg>
