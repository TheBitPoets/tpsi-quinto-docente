<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-url-anatomy.svg" role="img" aria-labelledby="title desc"><title id="title">Anatomia di un URL usato da Feisbuc</title><desc id="desc">L'URL è scomposto in schema, host, porta, path, query e fragment. Schema host e porta formano l'origine; il fragment resta nel client e non viene inviato nella richiesta HTTP.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="75" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">LEGGERE UN URL SENZA INDOVINARE</text><text x="960" y="122" text-anchor="middle" fill="#b8c8dc" font-size="22">https://api.feisbuc.test:8443/api/posts/p42?liked=true#comments</text>
<g transform="translate(85 245)"><rect width="250" height="150" rx="26" fill="#fff7ed" stroke="#f59e0b" stroke-width="4"/><text x="125" y="48" text-anchor="middle" fill="#92400e" font-size="21" font-weight="800">SCHEMA</text><text x="125" y="95" text-anchor="middle" fill="#78350f" font-size="24" font-family="monospace">https</text></g><g transform="translate(360 245)"><rect width="350" height="150" rx="26" fill="#eff6ff" stroke="#38bdf8" stroke-width="4"/><text x="175" y="48" text-anchor="middle" fill="#075985" font-size="21" font-weight="800">HOST</text><text x="175" y="95" text-anchor="middle" fill="#0c4a6e" font-size="22" font-family="monospace">api.feisbuc.test</text></g><g transform="translate(735 245)"><rect width="200" height="150" rx="26" fill="#eff6ff" stroke="#38bdf8" stroke-width="4"/><text x="100" y="48" text-anchor="middle" fill="#075985" font-size="21" font-weight="800">PORTA</text><text x="100" y="95" text-anchor="middle" fill="#0c4a6e" font-size="24" font-family="monospace">8443</text></g><g transform="translate(960 245)"><rect width="390" height="150" rx="26" fill="#ecfdf5" stroke="#22c55e" stroke-width="4"/><text x="195" y="48" text-anchor="middle" fill="#166534" font-size="21" font-weight="800">PATH</text><text x="195" y="95" text-anchor="middle" fill="#14532d" font-size="22" font-family="monospace">/api/posts/p42</text></g><g transform="translate(1375 245)"><rect width="300" height="150" rx="26" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="4"/><text x="150" y="48" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="800">QUERY</text><text x="150" y="95" text-anchor="middle" fill="#4c1d95" font-size="21" font-family="monospace">liked=true</text></g><g transform="translate(1700 245)"><rect width="170" height="150" rx="26" fill="#fef2f2" stroke="#ef4444" stroke-width="4"/><text x="85" y="48" text-anchor="middle" fill="#991b1b" font-size="19" font-weight="800">FRAGMENT</text><text x="85" y="95" text-anchor="middle" fill="#7f1d1d" font-size="18" font-family="monospace">comments</text></g>
<path d="M85 440v70h850v-70" fill="none" stroke="#38bdf8" stroke-width="5"/><rect x="280" y="505" width="460" height="70" rx="22" fill="#dbeafe"/><text x="510" y="549" text-anchor="middle" fill="#075985" font-size="22" font-weight="800">ORIGIN = schema + host + porta</text><rect x="960" y="505" width="715" height="70" rx="22" fill="#dcfce7"/><text x="1318" y="549" text-anchor="middle" fill="#166534" font-size="21" font-weight="800">PATH + QUERY partecipano al target della richiesta</text><rect x="1320" y="650" width="550" height="140" rx="28" fill="#fef2f2" stroke="#ef4444" stroke-width="4"/><text x="1595" y="702" text-anchor="middle" fill="#991b1b" font-size="23" font-weight="800">IL FRAGMENT RESTA NEL CLIENT</text><text x="1595" y="746" text-anchor="middle" fill="#7f1d1d" font-size="19">non viene inviato al server nella request HTTP</text><rect x="130" y="650" width="1060" height="260" rx="32" fill="#f8fafc"/><text x="660" y="705" text-anchor="middle" fill="#102a43" font-size="25" font-weight="800">NEL CODICE: USA URL E URLSearchParams</text><text x="195" y="770" fill="#334155" font-size="22" font-family="monospace">const url = new URL("/api/posts", location.origin);</text><text x="195" y="818" fill="#334155" font-size="22" font-family="monospace">url.searchParams.set("liked", "true");</text><text x="660" y="872" text-anchor="middle" fill="#52677f" font-size="18">evita concatenazioni fragili e applica l'encoding corretto ai parametri</text></g></svg>
