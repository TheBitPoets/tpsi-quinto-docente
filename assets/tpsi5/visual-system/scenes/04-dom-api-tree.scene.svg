<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-output="../../04-dom-api-tree.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal documento HTML agli oggetti del DOM</title>
  <desc id="desc">Il browser analizza il file HTML e costruisce un albero DOM. Window contiene il riferimento document; Document, Element e Text sono oggetti collegati in un albero.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#38bdf8"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="800" y="62" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="800">DAL FILE HTML AL DOM</text>
    <text x="800" y="102" text-anchor="middle" fill="#b8c8dc" font-size="21">Il DOM non è il file: è il modello a oggetti costruito e mantenuto dal browser</text>
    <g transform="translate(55 185)">
      <use href="#tpsi-document" x="0" y="5" width="230" height="280"/>
      <text x="115" y="330" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800">index.html</text>
      <text x="115" y="360" text-anchor="middle" fill="#b8c8dc" font-size="17">testo ricevuto</text>
    </g>
    <path d="M310 355h185" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(510 235)">
      <rect width="260" height="230" rx="34" fill="#e0f2fe" stroke="#38bdf8" stroke-width="5"/>
      <text x="130" y="84" text-anchor="middle" fill="#0c4a6e" font-size="28" font-weight="800">PARSER HTML</text>
      <path d="M58 126h144M58 160h112" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round"/>
      <text x="130" y="207" text-anchor="middle" fill="#52677f" font-size="17">legge e corregge</text>
    </g>
    <path d="M785 355h170" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>

    <g transform="translate(970 142)">
      <rect width="575" height="622" rx="34" fill="#f8fafc" stroke="#a78bfa" stroke-width="6"/>
      <rect x="167" y="34" width="240" height="58" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
      <text x="287" y="72" text-anchor="middle" fill="#5b21b6" font-size="22" font-weight="800">window</text>
      <path d="M287 92v58" stroke="#8b5cf6" stroke-width="5"/>
      <rect x="167" y="150" width="240" height="58" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
      <text x="287" y="188" text-anchor="middle" fill="#166534" font-size="22" font-weight="800">document</text>
      <path d="M287 208v55M287 263H95M287 263h190M95 263v42M287 263v42M477 263v42" fill="none" stroke="#64748b" stroke-width="5"/>
      <g fill="#eff6ff" stroke="#38bdf8" stroke-width="3">
        <rect x="25" y="305" width="140" height="60" rx="17"/><rect x="217" y="305" width="140" height="60" rx="17"/><rect x="407" y="305" width="140" height="60" rx="17"/>
      </g>
      <g text-anchor="middle" fill="#075985" font-size="20" font-weight="800"><text x="95" y="343">html</text><text x="287" y="343">head</text><text x="477" y="343">body</text></g>
      <path d="M477 365v50M477 415H360M477 415h70M360 415v38M547 415v38" fill="none" stroke="#64748b" stroke-width="5"/>
      <g fill="#fff7ed" stroke="#fb923c" stroke-width="3"><rect x="290" y="453" width="140" height="60" rx="17"/><rect x="477" y="453" width="70" height="60" rx="17"/></g>
      <g text-anchor="middle" fill="#9a3412" font-size="18" font-weight="800"><text x="360" y="490">h1 Element</text><text x="512" y="490">p</text></g>
      <path d="M360 513v42" stroke="#64748b" stroke-width="5"/>
      <rect x="274" y="555" width="172" height="48" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
      <text x="360" y="586" text-anchor="middle" fill="#334155" font-size="17" font-weight="700">“Feisbuc” Text</text>
    </g>

    <g transform="translate(72 610)">
      <rect width="820" height="190" rx="28" fill="#f8fafc"/>
      <text x="30" y="42" fill="#102a43" font-size="21" font-weight="800">CHE COSA RESTITUISCE UNA SELEZIONE?</text>
      <text x="30" y="83" fill="#075985" font-size="20" font-family="monospace">const title = document.querySelector("h1");</text>
      <text x="30" y="124" fill="#52677f" font-size="18">La variabile non contiene una copia dell'HTML:</text>
      <text x="30" y="157" fill="#334155" font-size="18" font-weight="700">contiene un riferimento all'oggetto Element del DOM, oppure null.</text>
    </g>
  </g>
</svg>
