      <rect width="1792" height="156" rx="28" fill="#f8fafc" opacity=".98"/>
      <text x="28" y="38" fill="#102a43" font-size="19" font-weight="800">LEGENDA DELLA COPERTURA</text>
      <g transform="translate(28 58)"><rect width="520" height="66" rx="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="16" y="14" width="116" height="38" rx="19" fill="#16a34a"/><text x="74" y="39" text-anchor="middle" fill="white" font-size="13" font-weight="800">COPERTO</text><text x="150" y="31" fill="#14532d" font-size="16" font-weight="800">spiegato in italiano</text><text x="150" y="51" fill="#3f5f4b" font-size="14">da comprendere e usare ora</text></g>
      <g transform="translate(636 58)"><rect width="520" height="66" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><rect x="16" y="14" width="132" height="38" rx="19" fill="#d97706"/><text x="82" y="39" text-anchor="middle" fill="white" font-size="13" font-weight="800">INTEGRATO</text><text x="166" y="31" fill="#78350f" font-size="16" font-weight="800">valore aggiunto del corso</text><text x="166" y="51" fill="#785e32" font-size="14">sintesi tra più concetti e fonti</text></g>
      <g transform="translate(1244 58)"><rect width="520" height="66" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><rect x="16" y="14" width="126" height="38" rx="19" fill="#64748b"/><text x="79" y="39" text-anchor="middle" fill="white" font-size="13" font-weight="800">PIÙ AVANTI</text><text x="160" y="31" fill="#334155" font-size="16" font-weight="800">fuori dallo studio attuale</text><text x="160" y="51" fill="#64748b" font-size="14">sarà ripreso in una lezione futura</text></g>
