      <g fill="#071426"><rect x="894" y="200" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="221">SPIEGA</text><rect x="894" y="282" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="303">SPIEGA</text><rect x="894" y="364" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="385">SPIEGA</text><rect x="894" y="446" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="467">SPIEGA</text><rect x="894" y="528" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="549">SPIEGA</text><rect x="894" y="692" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="713">SPIEGA</text></g>
