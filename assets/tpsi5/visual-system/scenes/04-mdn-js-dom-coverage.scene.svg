<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../04-mdn-js-dom-coverage.svg" role="img" aria-labelledby="title desc">
  <title id="title">Mappa di copertura MDN della lezione JavaScript, DOM e Browser API</title>
  <desc id="desc">A sinistra sono elencati i nuclei della dispensa, a destra le sezioni MDN corrispondenti. Verde significa coperto, ambra da riconoscere e grigio più avanti.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="jsCoverageBackground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="jsCoverageShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/></filter>
    <marker id="jsCoveredArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker>
    <marker id="jsIntroducedArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#f59e0b"/></marker>
    <marker id="jsLaterArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#jsCoverageBackground)"/>
  <circle cx="48" cy="70" r="260" fill="#facc15" opacity=".07"/><circle cx="1870" cy="1000" r="330" fill="#8b5cf6" opacity=".07"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="62" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="800">DISPENSA ↔ MDN · JAVASCRIPT, DOM E BROWSER API</text>
    <text x="960" y="104" text-anchor="middle" fill="#b8c8dc" font-size="21">Dal linguaggio agli oggetti del browser, fino al ciclo stato–eventi–rendering</text>
    <text x="390" y="154" text-anchor="middle" fill="#7dd3fc" font-size="22" font-weight="800">PARAGRAFI DELLA DISPENSA</text>
    <text x="1530" y="154" text-anchor="middle" fill="#86efac" font-size="22" font-weight="800">PAGINE E SEZIONI MDN</text>

    <g filter="url(#jsCoverageShadow)">
      <g transform="translate(64 182)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">JavaScript, ECMAScript e ambiente browser</text><text x="26" y="52" fill="#52677f" font-size="15">linguaggio core, Window, Document e Web API</text></g>
      <g transform="translate(64 264)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">Valori, variabili, collezioni e oggetti</text><text x="26" y="52" fill="#52677f" font-size="15">const, let, tipi, array, object e copie superficiali</text></g>
      <g transform="translate(64 346)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">Funzioni, callback, scope e moduli</text><text x="26" y="52" fill="#52677f" font-size="15">comportamento riusabile e responsabilità separate</text></g>
      <g transform="translate(64 428)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">DOM: selezione e modifica dei nodi</text><text x="26" y="52" fill="#52677f" font-size="15">querySelector, createElement, textContent e classList</text></g>
      <g transform="translate(64 510)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">Eventi, bubbling, delegation e form</text><text x="26" y="52" fill="#52677f" font-size="15">target, currentTarget, submit, FormData e default action</text></g>
      <g transform="translate(64 592)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">State, rendering e fonte di verità</text><text x="26" y="52" fill="#52677f" font-size="15">architettura didattica applicata al feed Feisbuc</text></g>
      <g transform="translate(64 674)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">Web Storage e serializzazione JSON</text><text x="26" y="52" fill="#52677f" font-size="15">durata, origine, stringhe, errori e confini di sicurezza</text></g>
      <g transform="translate(64 756)"><rect width="650" height="68" rx="19" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="29" fill="#0c4a6e" font-size="19" font-weight="800">Asincronia, Fetch e runtime Node.js</text><text x="26" y="52" fill="#52677f" font-size="15">argomenti esplicitamente rinviati alle lezioni successive</text></g>

      <g transform="translate(1206 182)"><rect width="650" height="68" rx="19" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="15" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="29" fill="#14532d" font-size="18" font-weight="800">What is JavaScript?</text><text x="166" y="52" fill="#3f5f4b" font-size="15">Dynamic scripting · DOM scripting</text></g>
      <g transform="translate(1206 264)"><rect width="650" height="68" rx="19" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="15" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="29" fill="#14532d" font-size="18" font-weight="800">Variables · Arrays · Object basics</text><text x="166" y="52" fill="#3f5f4b" font-size="15">tipi, accesso e metodi di collezione</text></g>
      <g transform="translate(1206 346)"><rect width="650" height="68" rx="19" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="15" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="29" fill="#14532d" font-size="18" font-weight="800">Functions · Modules</text><text x="166" y="52" fill="#3f5f4b" font-size="15">parametri, return, callback, scope, import ed export</text></g>
      <g transform="translate(1206 428)"><rect width="650" height="68" rx="19" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="15" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="29" fill="#14532d" font-size="18" font-weight="800">DOM scripting introduction</text><text x="166" y="52" fill="#3f5f4b" font-size="15">Document, Node, Element e manipolazione</text></g>
      <g transform="translate(1206 510)"><rect width="650" height="68" rx="19" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="15" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="29" fill="#14532d" font-size="18" font-weight="800">Events · Event bubbling</text><text x="166" y="52" fill="#3f5f4b" font-size="15">propagazione, delegation e comportamento predefinito</text></g>
      <g transform="translate(1206 592)"><rect width="650" height="68" rx="19" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><rect x="18" y="15" width="142" height="38" rx="19" fill="#d97706"/><text x="89" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="800">CORSO</text><text x="180" y="29" fill="#78350f" font-size="18" font-weight="800">Pattern state → render → events</text><text x="180" y="52" fill="#785e32" font-size="15">sintesi architetturale, non singola pagina MDN</text></g>
      <g transform="translate(1206 674)"><rect width="650" height="68" rx="19" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="15" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="40" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="29" fill="#14532d" font-size="18" font-weight="800">Web Storage API · JSON</text><text x="166" y="52" fill="#3f5f4b" font-size="15">localStorage, sessionStorage e serializzazione</text></g>
      <g transform="translate(1206 756)"><rect width="650" height="68" rx="19" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><rect x="18" y="15" width="126" height="38" rx="19" fill="#64748b"/><text x="81" y="40" text-anchor="middle" fill="white" font-size="13" font-weight="800">PIÙ AVANTI</text><text x="164" y="29" fill="#334155" font-size="18" font-weight="800">Async JavaScript · Fetch API · Node.js</text><text x="164" y="52" fill="#64748b" font-size="15">lezioni 05–06; fuori dalla verifica corrente</text></g>
    </g>

