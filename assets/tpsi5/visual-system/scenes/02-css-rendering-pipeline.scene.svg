<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-css-rendering-pipeline.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal documento alla pagina visualizzata</title>
  <desc id="desc">Il browser costruisce il DOM, abbina le regole CSS, risolve la cascade, genera e dispone i box, quindi disegna la pagina.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="pipeBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="pipeShadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter><marker id="pipeArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9-18 9z" fill="#38bdf8"/></marker></defs>
  <rect width="1920" height="1080" fill="url(#pipeBg)"/><circle cx="120" cy="120" r="280" fill="#38bdf8" opacity=".07"/><circle cx="1800" cy="980" r="340" fill="#22c55e" opacity=".06"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="82" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">DAL DOCUMENTO ALLA PAGINA</text><text x="960" y="126" text-anchor="middle" fill="#b8c8dc" font-size="22">Una pipeline semplificata: ogni fase prepara la successiva</text>
    <g filter="url(#pipeShadow)">
      <g transform="translate(70 300)"><rect width="310" height="330" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/><circle cx="155" cy="78" r="43" fill="#f97316"/><text x="155" y="91" text-anchor="middle" fill="white" font-size="35" font-weight="800">1</text><text x="155" y="160" text-anchor="middle" fill="#9a3412" font-size="27" font-weight="800">DOM</text><text x="155" y="206" text-anchor="middle" fill="#7c2d12" font-size="18">HTML interpretato</text><text x="155" y="236" text-anchor="middle" fill="#7c2d12" font-size="18">come albero di nodi</text><text x="155" y="286" text-anchor="middle" fill="#9a3412" font-size="17" font-weight="700">STRUTTURA</text></g>
      <g transform="translate(438 300)"><rect width="310" height="330" rx="30" fill="#eff6ff" stroke="#38bdf8" stroke-width="4"/><circle cx="155" cy="78" r="43" fill="#0284c7"/><text x="155" y="91" text-anchor="middle" fill="white" font-size="35" font-weight="800">2</text><text x="155" y="160" text-anchor="middle" fill="#075985" font-size="25" font-weight="800">REGOLA ↔ NODO</text><text x="155" y="206" text-anchor="middle" fill="#0c4a6e" font-size="18">I selettori individuano</text><text x="155" y="236" text-anchor="middle" fill="#0c4a6e" font-size="18">gli elementi candidati</text><text x="155" y="286" text-anchor="middle" fill="#075985" font-size="17" font-weight="700">MATCHING</text></g>
      <g transform="translate(806 300)"><rect width="310" height="330" rx="30" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/><circle cx="155" cy="78" r="43" fill="#d97706"/><text x="155" y="91" text-anchor="middle" fill="white" font-size="35" font-weight="800">3</text><text x="155" y="160" text-anchor="middle" fill="#78350f" font-size="27" font-weight="800">CASCADE</text><text x="155" y="206" text-anchor="middle" fill="#713f12" font-size="18">Conflitti risolti e</text><text x="155" y="236" text-anchor="middle" fill="#713f12" font-size="18">valori calcolati</text><text x="155" y="286" text-anchor="middle" fill="#92400e" font-size="17" font-weight="700">COMPUTED STYLE</text></g>
      <g transform="translate(1174 300)"><rect width="310" height="330" rx="30" fill="#f5f3ff" stroke="#a78bfa" stroke-width="4"/><circle cx="155" cy="78" r="43" fill="#7c3aed"/><text x="155" y="91" text-anchor="middle" fill="white" font-size="35" font-weight="800">4</text><text x="155" y="160" text-anchor="middle" fill="#5b21b6" font-size="27" font-weight="800">LAYOUT</text><text x="155" y="206" text-anchor="middle" fill="#4c1d95" font-size="18">Box, dimensioni e</text><text x="155" y="236" text-anchor="middle" fill="#4c1d95" font-size="18">posizioni nello spazio</text><text x="155" y="286" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="700">GEOMETRIA</text></g>
      <g transform="translate(1542 300)"><rect width="310" height="330" rx="30" fill="#ecfdf5" stroke="#22c55e" stroke-width="4"/><circle cx="155" cy="78" r="43" fill="#16a34a"/><text x="155" y="91" text-anchor="middle" fill="white" font-size="35" font-weight="800">5</text><text x="155" y="160" text-anchor="middle" fill="#14532d" font-size="27" font-weight="800">PAINT</text><text x="155" y="206" text-anchor="middle" fill="#166534" font-size="18">Pixel disegnati</text><text x="155" y="236" text-anchor="middle" fill="#166534" font-size="18">nella finestra</text><text x="155" y="286" text-anchor="middle" fill="#15803d" font-size="17" font-weight="700">RISULTATO</text></g>
    </g>
    <g fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#pipeArrow)"><path d="M386 465h38"/><path d="M754 465h38"/><path d="M1122 465h38"/><path d="M1490 465h38"/></g>
    <rect x="180" y="750" width="1560" height="150" rx="30" fill="#f8fafc" opacity=".97"/><text x="960" y="808" text-anchor="middle" fill="#102a43" font-size="25" font-weight="800">CSS NON “COLORA L'HTML” DIRETTAMENTE</text><text x="960" y="852" text-anchor="middle" fill="#52677f" font-size="21">Partecipa a un processo che sceglie valori, costruisce scatole e calcola il layout.</text>
  </g>
</svg>
