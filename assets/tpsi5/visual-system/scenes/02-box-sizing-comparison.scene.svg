<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-box-sizing-comparison.svg" role="img" aria-labelledby="title desc"><title id="title">Confronto fra content-box e border-box</title><desc id="desc">Due scatole con width 300 pixel, padding 20 e border 4 mostrano che content-box misura 348 pixel esterni mentre border-box resta 300.</desc><defs id="visual-kit-components"/><defs><linearGradient id="sizingBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="sizingShadow"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-opacity=".32"/></filter></defs><rect width="1920" height="1080" fill="url(#sizingBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="80" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">STESSA WIDTH, RISULTATO DIVERSO</text><text x="960" y="124" text-anchor="middle" fill="#b8c8dc" font-size="22">width: 300px · padding: 20px · border: 4px</text>
    <g filter="url(#sizingShadow)"><rect x="110" y="220" width="790" height="650" rx="36" fill="#f8fafc"/><rect x="1020" y="220" width="790" height="650" rx="36" fill="#f8fafc"/></g>
    <text x="505" y="285" text-anchor="middle" fill="#9a3412" font-size="29" font-weight="800">content-box</text><text x="1415" y="285" text-anchor="middle" fill="#14532d" font-size="29" font-weight="800">border-box</text>
    <g><rect x="275" y="380" width="460" height="260" rx="18" fill="#fb923c"/><rect x="283" y="388" width="444" height="244" rx="14" fill="#bfdbfe"/><rect x="323" y="428" width="364" height="164" rx="10" fill="#d1fae5"/><text x="505" y="518" text-anchor="middle" fill="#065f46" font-size="25" font-weight="800">CONTENT = 300px</text><path d="M275 690h460" stroke="#ef4444" stroke-width="5"/><path d="M275 674v32M735 674v32" stroke="#ef4444" stroke-width="5"/><text x="505" y="738" text-anchor="middle" fill="#b91c1c" font-size="27" font-weight="800">ESTERNO = 348px</text><text x="505" y="790" text-anchor="middle" fill="#52677f" font-size="19">300 + 40 padding + 8 border</text></g>
    <g><rect x="1255" y="380" width="320" height="260" rx="18" fill="#22c55e"/><rect x="1263" y="388" width="304" height="244" rx="14" fill="#bfdbfe"/><rect x="1303" y="428" width="224" height="164" rx="10" fill="#d1fae5"/><text x="1415" y="500" text-anchor="middle" fill="#065f46" font-size="23" font-weight="800">CONTENT</text><text x="1415" y="535" text-anchor="middle" fill="#166534" font-size="19">si adatta</text><path d="M1255 690h320" stroke="#16a34a" stroke-width="5"/><path d="M1255 674v32M1575 674v32" stroke="#16a34a" stroke-width="5"/><text x="1415" y="738" text-anchor="middle" fill="#15803d" font-size="27" font-weight="800">ESTERNO = 300px</text><text x="1415" y="790" text-anchor="middle" fill="#52677f" font-size="19">padding e border inclusi nella width</text></g>
    <rect x="280" y="935" width="1360" height="72" rx="36" fill="#e2e8f0" opacity=".13"/><text x="960" y="980" text-anchor="middle" fill="#e2e8f0" font-size="21">I margin restano esterni in entrambi i modelli e non fanno parte della width.</text>
  </g>
</svg>
