  <title id="title">Mappa di copertura MDN della lezione CSS moderno, layout e responsive design</title>
  <desc id="desc">A sinistra sono elencati i paragrafi della dispensa CSS, a destra le pagine MDN corrispondenti. Verde significa coperto, ambra introdotto, grigio più avanti. Le frecce mostrano i raccordi.</desc>
