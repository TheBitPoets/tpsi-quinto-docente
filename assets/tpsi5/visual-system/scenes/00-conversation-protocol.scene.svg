<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-conversation-protocol.svg" role="img" aria-labelledby="title desc">
  <title id="title">Le regole di un protocollo in una conversazione</title>
  <desc id="desc">Marco e Giulia seguono cinque regole condivise: avvio, forma dei messaggi, significato, ordine e segnalazione di risultato o errore.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <filter id="dialogShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020617" flood-opacity=".3"/></filter>
    <marker id="dialogRight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#38bdf8"/></marker>
    <marker id="dialogLeft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#34d399"/></marker>
    <marker id="dialogError" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="80" cy="80" r="290" fill="#0ea5e9" opacity=".07"/><circle cx="1840" cy="1040" r="360" fill="#10b981" opacity=".06"/>
  <text x="960" y="64" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800">UN PROTOCOLLO NELLA VITA QUOTIDIANA</text>
  <text x="960" y="104" text-anchor="middle" fill="#b8c8dc" font-family="Inter,Arial,sans-serif" font-size="22">I numeri collegano ogni regola a un passaggio della conversazione</text>

  <g filter="url(#dialogShadow)" font-family="Inter,Arial,sans-serif">
    <rect x="45" y="165" width="250" height="495" rx="30" fill="#f8fafc"/>
    <path d="M75 165h190a30 30 0 0 1 30 30v70H45v-70a30 30 0 0 1 30-30z" fill="#2563eb"/>
    <text x="170" y="228" text-anchor="middle" fill="white" font-size="31" font-weight="800">MARCO</text>
    <use href="#tpsi-user" x="75" y="300" width="190" height="205"/>
    <rect x="75" y="540" width="190" height="72" rx="20" fill="#dbeafe"/>
    <text x="170" y="570" text-anchor="middle" fill="#1e3a8a" font-size="16" font-weight="800">INIZIA</text>
    <text x="170" y="594" text-anchor="middle" fill="#1e3a8a" font-size="16" font-weight="800">LA RICHIESTA</text>

    <rect x="1625" y="165" width="250" height="495" rx="30" fill="#f8fafc"/>
    <path d="M1655 165h190a30 30 0 0 1 30 30v70h-250v-70a30 30 0 0 1 30-30z" fill="#059669"/>
    <text x="1750" y="228" text-anchor="middle" fill="white" font-size="31" font-weight="800">GIULIA</text>
    <use href="#tpsi-user" x="1655" y="300" width="190" height="205"/>
    <rect x="1655" y="540" width="190" height="72" rx="20" fill="#d1fae5"/>
    <text x="1750" y="570" text-anchor="middle" fill="#065f46" font-size="16" font-weight="800">INTERPRETA</text>
    <text x="1750" y="594" text-anchor="middle" fill="#065f46" font-size="16" font-weight="800">E RISPONDE</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-weight="700">
    <path d="M330 190h1250" stroke="#38bdf8" stroke-width="7" marker-end="url(#dialogRight)"/>
    <circle cx="365" cy="190" r="22" fill="#dbeafe"/><text x="365" y="198" text-anchor="middle" fill="#1d4ed8" font-size="21" font-weight="800">1</text>
    <rect x="555" y="151" width="800" height="68" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
    <text x="955" y="194" text-anchor="middle" fill="#075985" font-size="21">«Ciao Giulia, posso chiederti una cosa?»</text>

    <path d="M1590 278H340" stroke="#34d399" stroke-width="7" marker-end="url(#dialogLeft)"/>
    <circle cx="1555" cy="278" r="22" fill="#d1fae5"/><text x="1555" y="286" text-anchor="middle" fill="#047857" font-size="21" font-weight="800">1</text>
    <rect x="755" y="244" width="400" height="62" rx="21" fill="#d1fae5" stroke="#34d399" stroke-width="3"/>
    <text x="955" y="284" text-anchor="middle" fill="#065f46" font-size="21">«Sì, dimmi.»</text>

    <path d="M330 370h1250" stroke="#38bdf8" stroke-width="7" marker-end="url(#dialogRight)"/>
    <circle cx="355" cy="370" r="22" fill="#e0f2fe"/><text x="355" y="378" text-anchor="middle" fill="#0369a1" font-size="21" font-weight="800">2</text>
    <circle cx="405" cy="370" r="22" fill="#ccfbf1"/><text x="405" y="378" text-anchor="middle" fill="#0f766e" font-size="21" font-weight="800">3</text>
    <circle cx="455" cy="370" r="22" fill="#ede9fe"/><text x="455" y="378" text-anchor="middle" fill="#6d28d9" font-size="21" font-weight="800">4</text>
    <rect x="650" y="336" width="610" height="62" rx="21" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
    <text x="955" y="376" text-anchor="middle" fill="#075985" font-size="21">«Mi passi il quaderno blu?»</text>

    <path d="M1590 462H340" stroke="#f59e0b" stroke-width="7" marker-end="url(#dialogError)"/>
    <circle cx="1555" cy="462" r="22" fill="#fef3c7"/><text x="1555" y="470" text-anchor="middle" fill="#b45309" font-size="21" font-weight="800">5</text>
    <rect x="600" y="428" width="710" height="62" rx="21" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
    <text x="955" y="468" text-anchor="middle" fill="#9a3412" font-size="20">«Non ho capito quale quaderno. Puoi ripetere?»</text>

    <path d="M330 554h1250" stroke="#38bdf8" stroke-width="7" marker-end="url(#dialogRight)"/>
    <circle cx="355" cy="554" r="22" fill="#e0f2fe"/><text x="355" y="562" text-anchor="middle" fill="#0369a1" font-size="21" font-weight="800">2</text>
    <circle cx="405" cy="554" r="22" fill="#ccfbf1"/><text x="405" y="562" text-anchor="middle" fill="#0f766e" font-size="21" font-weight="800">3</text>
    <rect x="580" y="520" width="750" height="62" rx="21" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/>
    <text x="955" y="560" text-anchor="middle" fill="#075985" font-size="20">«Quello blu sul banco vicino alla finestra.»</text>

    <path d="M1590 646H340" stroke="#34d399" stroke-width="7" marker-end="url(#dialogLeft)"/>
    <circle cx="1555" cy="646" r="22" fill="#d1fae5"/><text x="1555" y="654" text-anchor="middle" fill="#047857" font-size="21" font-weight="800">5</text>
    <rect x="690" y="612" width="530" height="62" rx="21" fill="#d1fae5" stroke="#34d399" stroke-width="3"/>
    <text x="955" y="652" text-anchor="middle" fill="#065f46" font-size="21">«Ricevuto, eccolo.»</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#dialogShadow)">
    <g transform="translate(45 735)"><rect width="340" height="230" rx="26" fill="#f8fafc"/><circle cx="42" cy="42" r="23" fill="#2563eb"/><text x="42" y="50" fill="white" font-size="21" font-weight="800">1</text><text x="170" y="58" fill="#1e3a8a" font-size="22" font-weight="800">AVVIO</text><text x="170" y="112" fill="#52677f" font-size="17">saluto</text><text x="170" y="143" fill="#52677f" font-size="17">+ disponibilità a parlare</text><text x="170" y="190" fill="#1e3a8a" font-size="16" font-weight="800">«Ciao» → «Dimmi»</text></g>
    <g transform="translate(418 735)"><rect width="340" height="230" rx="26" fill="#f8fafc"/><circle cx="42" cy="42" r="23" fill="#0ea5e9"/><text x="42" y="50" fill="white" font-size="21" font-weight="800">2</text><text x="170" y="58" fill="#075985" font-size="22" font-weight="800">FORMA</text><text x="170" y="112" fill="#52677f" font-size="17">una frase condivisa</text><text x="170" y="143" fill="#52677f" font-size="17">con azione + oggetto</text><text x="170" y="190" fill="#075985" font-size="16" font-weight="800">passare + quaderno</text></g>
    <g transform="translate(791 735)"><rect width="340" height="230" rx="26" fill="#f8fafc"/><circle cx="42" cy="42" r="23" fill="#0d9488"/><text x="42" y="50" fill="white" font-size="21" font-weight="800">3</text><text x="170" y="58" fill="#0f766e" font-size="22" font-weight="800">SIGNIFICATO</text><text x="170" y="112" fill="#52677f" font-size="17">le parole devono indicare</text><text x="170" y="143" fill="#52677f" font-size="17">la stessa cosa per entrambi</text><text x="170" y="190" fill="#0f766e" font-size="16" font-weight="800">blu + banco + finestra</text></g>
    <g transform="translate(1164 735)"><rect width="340" height="230" rx="26" fill="#f8fafc"/><circle cx="42" cy="42" r="23" fill="#8b5cf6"/><text x="42" y="50" fill="white" font-size="21" font-weight="800">4</text><text x="170" y="58" fill="#6d28d9" font-size="22" font-weight="800">ORDINE</text><text x="170" y="112" fill="#52677f" font-size="17">prima il saluto, poi</text><text x="170" y="143" fill="#52677f" font-size="17">richiesta e risposta</text><text x="170" y="190" fill="#6d28d9" font-size="16" font-weight="800">avvio → richiesta → esito</text></g>
    <g transform="translate(1537 735)"><rect width="340" height="230" rx="26" fill="#f8fafc"/><circle cx="42" cy="42" r="23" fill="#f59e0b"/><text x="42" y="50" fill="white" font-size="21" font-weight="800">5</text><text x="170" y="58" fill="#b45309" font-size="21" font-weight="800">ESITO / ERRORE</text><text x="170" y="112" fill="#52677f" font-size="17">errore: «non ho capito»</text><text x="170" y="143" fill="#52677f" font-size="17">risultato: «eccolo»</text><text x="170" y="190" fill="#b45309" font-size="16" font-weight="800">ripeti oppure completa</text></g>
  </g>
  <text x="960" y="1025" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="20">Tra programmi queste regole devono essere ancora più precise: il computer non può affidarsi all'intuizione.</text>
</svg>
