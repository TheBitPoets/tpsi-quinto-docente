<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-api-request-service.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal client al servizio attraverso l'API</title>
  <desc id="desc">Il client formula una richiesta, l'API indica come richiederla e il servizio esegue il lavoro.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <filter id="arsShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".32"/></filter>
    <marker id="arsArrow" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="23" refY="13" orient="auto"><path d="M0 0l26 13L0 26z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="90" cy="100" r="300" fill="#2563eb" opacity=".08"/><circle cx="1840" cy="1030" r="370" fill="#10b981" opacity=".08"/>
  <g font-family="Inter,Arial,sans-serif">
    <text id="titleText" x="960" y="82" text-anchor="middle" fill="#f8fafc" font-size="48" font-weight="800">DAL CLIENT AL SERVIZIO</text>
    <text x="960" y="126" text-anchor="middle" fill="#b8c8dc" font-size="23">L'API è l'interfaccia che collega la richiesta del client al lavoro svolto dal server</text>

    <g filter="url(#arsShadow)">
      <rect x="80" y="230" width="500" height="650" rx="34" fill="#f8fafc"/>
      <path d="M114 230h432a34 34 0 0 1 34 34v88H80v-88a34 34 0 0 1 34-34z" fill="#2563eb"/>
      <text x="330" y="305" text-anchor="middle" fill="white" font-size="34" font-weight="800">CLIENT</text>
      <use href="#tpsi-browser" x="180" y="405" width="300" height="192"/>
      <rect x="135" y="650" width="390" height="125" rx="24" fill="#e8f4ff"/>
      <text x="330" y="701" text-anchor="middle" fill="#1e3a5f" font-size="23" font-weight="800">«Voglio recuperare</text>
      <text x="330" y="735" text-anchor="middle" fill="#1e3a5f" font-size="23" font-weight="800">i post»</text>
    </g>

    <g filter="url(#arsShadow)">
      <rect x="710" y="230" width="500" height="650" rx="34" fill="#f8fafc"/>
      <path d="M744 230h432a34 34 0 0 1 34 34v88H710v-88a34 34 0 0 1 34-34z" fill="#0d9488"/>
      <text x="960" y="305" text-anchor="middle" fill="white" font-size="34" font-weight="800">API DEL SERVER</text>
      <use href="#tpsi-api" x="795" y="395" width="330" height="220"/>
      <rect x="765" y="650" width="390" height="125" rx="24" fill="#ccfbf1"/>
      <text x="960" y="701" text-anchor="middle" fill="#115e59" font-size="23" font-weight="800">«Puoi farlo</text>
      <text x="960" y="735" text-anchor="middle" fill="#115e59" font-size="23" font-weight="800">in questo modo»</text>
    </g>

    <g filter="url(#arsShadow)">
      <rect x="1340" y="230" width="500" height="650" rx="34" fill="#f8fafc"/>
      <path d="M1374 230h432a34 34 0 0 1 34 34v88h-500v-88a34 34 0 0 1 34-34z" fill="#059669"/>
      <text x="1590" y="305" text-anchor="middle" fill="white" font-size="34" font-weight="800">SERVIZIO</text>
      <use href="#tpsi-service" x="1450" y="390" width="280" height="228"/>
      <rect x="1395" y="650" width="390" height="125" rx="24" fill="#d1fae5"/>
      <text x="1590" y="701" text-anchor="middle" fill="#166534" font-size="22" font-weight="800">recupera i dati</text>
      <text x="1590" y="735" text-anchor="middle" fill="#166534" font-size="22" font-weight="800">e produce il risultato</text>
    </g>

    <path d="M595 555h95" fill="none" stroke="#38bdf8" stroke-width="9" marker-end="url(#arsArrow)"/>
    <path d="M1225 555h95" fill="none" stroke="#38bdf8" stroke-width="9" marker-end="url(#arsArrow)"/>
    <text x="645" y="515" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="800">CHIEDE</text>
    <text x="1275" y="515" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="800">ATTIVA</text>

    <rect x="300" y="950" width="1320" height="62" rx="31" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="991" text-anchor="middle" fill="#dbeafe" font-size="24" font-weight="800">il client chiede · l'API definisce come · il servizio esegue</text>
  </g>
</svg>
