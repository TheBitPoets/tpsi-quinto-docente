<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-output="../../04-app-bootstrap.svg" role="img" aria-labelledby="title desc">
  <title id="title">Sequenza di avvio dell'applicazione Feisbuc</title>
  <desc id="desc">Il browser costruisce il DOM, carica app.js, risolve i moduli posts e storage, seleziona gli elementi, carica lo stato, registra i listener ed esegue il primo rendering.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="800" y="66" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="800">COME PARTE FEISBUC</text><text x="800" y="108" text-anchor="middle" fill="#b8c8dc" font-size="21">L'inizializzazione termina; poi l'applicazione rimane in attesa degli eventi</text>
    <g transform="translate(65 170)"><use href="#tpsi-browser" x="0" y="0" width="250" height="160"/><text x="125" y="205" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">1 · DOM pronto</text></g>
    <path d="M325 290h135" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(480 170)"><rect width="260" height="210" rx="30" fill="#fffbea" stroke="#facc15" stroke-width="5"/><use href="#tpsi-badge-js" x="85" y="22" width="90" height="90"/><text x="130" y="152" text-anchor="middle" fill="#713f12" font-size="24" font-weight="800">2 · app.js</text><text x="130" y="183" text-anchor="middle" fill="#7c5b24" font-size="16">entry point</text></g>
    <path d="M755 275h135" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(910 145)"><rect width="590" height="260" rx="34" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><text x="295" y="48" text-anchor="middle" fill="#5b21b6" font-size="23" font-weight="800">3 · RISOLVE LE DIPENDENZE</text><rect x="50" y="90" width="210" height="105" rx="24" fill="#fff" stroke="#a78bfa" stroke-width="4"/><text x="155" y="135" text-anchor="middle" fill="#5b21b6" font-size="20" font-family="monospace">posts.js</text><text x="155" y="168" text-anchor="middle" fill="#6d5a90" font-size="15">dominio</text><rect x="330" y="90" width="210" height="105" rx="24" fill="#fff" stroke="#a78bfa" stroke-width="4"/><text x="435" y="135" text-anchor="middle" fill="#5b21b6" font-size="20" font-family="monospace">storage.js</text><text x="435" y="168" text-anchor="middle" fill="#6d5a90" font-size="15">persistenza</text><text x="295" y="230" text-anchor="middle" fill="#6d5a90" font-size="16">import eseguiti una sola volta</text></g>
    <g transform="translate(100 500)"><rect width="1400" height="270" rx="34" fill="#f8fafc"/><text x="700" y="48" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">4–7 · INIZIALIZZAZIONE DI app.js</text><g fill="#eff6ff" stroke="#38bdf8" stroke-width="4"><rect x="45" y="88" width="270" height="110" rx="24"/><rect x="390" y="88" width="270" height="110" rx="24"/><rect x="735" y="88" width="270" height="110" rx="24"/><rect x="1080" y="88" width="270" height="110" rx="24"/></g><g text-anchor="middle" fill="#075985" font-size="18" font-weight="800"><text x="180" y="132">4 · seleziona DOM</text><text x="180" y="164" font-size="15" font-weight="600">form · list · status</text><text x="525" y="132">5 · loadPosts()</text><text x="525" y="164" font-size="15" font-weight="600">storage → state</text><text x="870" y="132">6 · registra listener</text><text x="870" y="164" font-size="15" font-weight="600">submit · click</text><text x="1215" y="132">7 · renderPosts()</text><text x="1215" y="164" font-size="15" font-weight="600">state → DOM</text></g><path d="M315 143h55M660 143h55M1005 143h55" fill="none" stroke="#38bdf8" stroke-width="6" marker-end="url(#a)"/><rect x="475" y="218" width="450" height="38" rx="19" fill="#dcfce7"/><text x="700" y="244" text-anchor="middle" fill="#166534" font-size="16" font-weight="800">8 · attesa: i listener verranno invocati dagli eventi</text></g>
    <text x="800" y="840" text-anchor="middle" fill="#b8c8dc" font-size="18">type="module" è differito: gli elementi HTML precedenti sono già disponibili.</text>
  </g>
</svg>
