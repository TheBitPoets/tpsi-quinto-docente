<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-web-service-interface.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal client al web service attraverso l'interfaccia del server</title>
  <desc id="desc">Browser, app mobile e altri server inviano richieste HTTP alla Web API. L'API è l'interfaccia pubblica del server e inoltra la richiesta al web service, che applica regole e usa codice interno e database.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <filter id="serviceShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="serviceRequest" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#38bdf8"/></marker>
    <marker id="serviceResponse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#34d399"/></marker>
    <marker id="serviceInternal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#0d9488"/></marker>
    <marker id="serviceInternalSmall" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l18 9-18 9z" fill="#0d9488"/></marker>
    <marker id="serviceData" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l18 9-18 9z" fill="#4f46e5"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="50" cy="70" r="280" fill="#0ea5e9" opacity=".07"/><circle cx="1880" cy="1030" r="390" fill="#10b981" opacity=".07"/>
  <text x="960" y="65" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800">DAL CLIENT AL WEB SERVICE</text>
  <text x="960" y="105" text-anchor="middle" fill="#b8c8dc" font-family="Inter,Arial,sans-serif" font-size="22">La Web API è l'interfaccia pubblica attraverso cui si raggiungono i servizi del server</text>

  <g filter="url(#serviceShadow)" font-family="Inter,Arial,sans-serif">
    <rect x="40" y="155" width="390" height="760" rx="32" fill="#f8fafc"/>
    <path d="M72 155h326a32 32 0 0 1 32 32v76H40v-76a32 32 0 0 1 32-32z" fill="#2563eb"/>
    <text x="235" y="218" text-anchor="middle" fill="white" font-size="28" font-weight="800">CLIENT DIFFERENTI</text>

    <rect x="78" y="300" width="314" height="150" rx="24" fill="#e8f4ff"/>
    <use href="#tpsi-browser" x="96" y="320" width="145" height="94"/>
    <text x="303" y="360" text-anchor="middle" fill="#1e3a5f" font-size="20" font-weight="800">BROWSER</text>
    <text x="303" y="391" text-anchor="middle" fill="#52677f" font-size="15">Feisbuc Web</text>

    <rect x="78" y="485" width="314" height="150" rx="24" fill="#e8f4ff"/>
    <use href="#tpsi-smartphone" x="118" y="500" width="74" height="120"/>
    <text x="290" y="545" text-anchor="middle" fill="#1e3a5f" font-size="20" font-weight="800">APP MOBILE</text>
    <text x="290" y="576" text-anchor="middle" fill="#52677f" font-size="15">stesso servizio</text>

    <rect x="78" y="670" width="314" height="150" rx="24" fill="#e8f4ff"/>
    <use href="#tpsi-server" x="96" y="688" width="134" height="102"/>
    <text x="304" y="730" text-anchor="middle" fill="#1e3a5f" font-size="20" font-weight="800">ALTRO SERVER</text>
    <text x="304" y="761" text-anchor="middle" fill="#52677f" font-size="15">integrazione</text>
  </g>

  <use href="#tpsi-network" x="500" y="405" width="220" height="220"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="800">
    <text x="610" y="372" fill="#dbeafe" font-size="20">WEB / RETE</text>
    <path d="M450 335h365" fill="none" stroke="#38bdf8" stroke-width="9" marker-end="url(#serviceRequest)"/>
    <text x="630" y="307" fill="#7dd3fc" font-size="20">RICHIESTA HTTP</text>
    <text x="630" y="664" fill="#7dd3fc" font-family="ui-monospace,Menlo,monospace" font-size="16">POST /api/posts</text>
    <text x="630" y="690" fill="#b8c8dc" font-family="ui-monospace,Menlo,monospace" font-size="15">{ "text": "Ciao" }</text>
    <path d="M820 818H455" fill="none" stroke="#34d399" stroke-width="9" marker-end="url(#serviceResponse)"/>
    <text x="635" y="858" fill="#6ee7b7" font-size="20">RISPOSTA HTTP · 201</text>
  </g>

  <g filter="url(#serviceShadow)" font-family="Inter,Arial,sans-serif">
    <rect x="790" y="145" width="1085" height="790" rx="34" fill="#f8fafc"/>
    <path d="M824 145h1017a34 34 0 0 1 34 34v76H790v-76a34 34 0 0 1 34-34z" fill="#059669"/>
    <text x="835" y="213" fill="white" font-size="37" font-weight="800">SERVER</text>
    <text x="1830" y="210" text-anchor="end" fill="#d1fae5" font-size="20" font-weight="800">MACCHINA + SOFTWARE</text>

    <text x="1015" y="300" text-anchor="middle" fill="#0f766e" font-size="18" font-weight="800" letter-spacing="2">CIÒ CHE IL CLIENT VEDE</text>
    <rect x="835" y="325" width="365" height="490" rx="28" fill="#e6fffa" stroke="#2dd4bf" stroke-width="4"/>
    <text x="1018" y="369" text-anchor="middle" fill="#0f766e" font-size="20" font-weight="800">INTERFACCIA PUBBLICA</text>
    <use href="#tpsi-api" x="900" y="395" width="235" height="155"/>
    <text x="1018" y="592" text-anchor="middle" fill="#064e3b" font-size="24" font-weight="800">WEB API</text>
    <text x="1018" y="634" text-anchor="middle" fill="#52677f" font-family="ui-monospace,Menlo,monospace" font-size="17">POST /api/posts</text>
    <text x="1018" y="670" text-anchor="middle" fill="#52677f" font-size="16">indirizzo · metodo · JSON</text>
    <text x="1018" y="703" text-anchor="middle" fill="#52677f" font-size="16">risultati · possibili errori</text>
    <rect x="875" y="746" width="285" height="44" rx="22" fill="#ccfbf1"/>
    <text x="1018" y="775" text-anchor="middle" fill="#0f766e" font-size="17" font-weight="800">COME CHIEDERE</text>

    <path d="M1254 285v560" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 12"/>
    <rect x="1215" y="475" width="78" height="180" rx="28" fill="#f8fafc"/>
    <text x="1254" y="568" text-anchor="middle" fill="#64748b" font-size="15" font-weight="800" transform="rotate(-90 1254 568)">CONFINE PUBBLICO / INTERNO</text>

    <text x="1560" y="300" text-anchor="middle" fill="#166534" font-size="18" font-weight="800" letter-spacing="2">CIÒ CHE IL SERVER NASCONDE</text>
    <rect x="1325" y="325" width="480" height="255" rx="28" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="4"/>
    <use href="#tpsi-service" x="1350" y="355" width="170" height="145"/>
    <text x="1650" y="382" text-anchor="middle" fill="#065f46" font-size="24" font-weight="800">WEB SERVICE</text>
    <text x="1650" y="423" text-anchor="middle" fill="#166534" font-size="20" font-weight="800">«Pubblica un post»</text>
    <text x="1650" y="466" text-anchor="middle" fill="#52677f" font-size="16">valida i dati</text>
    <text x="1650" y="495" text-anchor="middle" fill="#52677f" font-size="16">applica le regole</text>
    <text x="1650" y="524" text-anchor="middle" fill="#52677f" font-size="16">produce il risultato</text>
    <rect x="1440" y="530" width="240" height="38" rx="19" fill="#d1fae5"/>
    <text x="1560" y="556" text-anchor="middle" fill="#065f46" font-size="16" font-weight="800">CHE COSA OFFRE</text>

    <rect x="1325" y="630" width="480" height="105" rx="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/>
    <use href="#tpsi-repository" x="1350" y="644" width="100" height="76"/>
    <text x="1610" y="672" text-anchor="middle" fill="#334155" font-size="20" font-weight="800">CODICE INTERNO</text>
    <text x="1610" y="704" text-anchor="middle" fill="#52677f" font-size="16">Node.js · Express · repository · SQL</text>

    <use href="#tpsi-database" x="1435" y="760" width="250" height="145"/>
    <rect x="1450" y="858" width="220" height="38" rx="19" fill="#3730a3"/>
    <text x="1560" y="884" text-anchor="middle" fill="white" font-size="17" font-weight="800">DATABASE · SQLite</text>
  </g>

  <path d="M1200 445h110" fill="none" stroke="#0d9488" stroke-width="9" marker-end="url(#serviceInternal)"/>
  <path d="M1560 588v30" fill="none" stroke="#0d9488" stroke-width="5" marker-end="url(#serviceInternalSmall)"/>
  <path d="M1560 741v14" fill="none" stroke="#4f46e5" stroke-width="5" marker-end="url(#serviceData)"/>

  <g font-family="Inter,Arial,sans-serif" font-weight="800">
    <rect x="270" y="970" width="1380" height="58" rx="29" fill="#e2e8f0" opacity=".12"/>
    <text x="420" y="1007" fill="#dbeafe" font-size="20">SERVER = DOVE</text>
    <text x="790" y="1007" fill="#5eead4" font-size="20">WEB API = COME</text>
    <text x="1190" y="1007" fill="#6ee7b7" font-size="20">WEB SERVICE = CHE COSA</text>
  </g>
</svg>
