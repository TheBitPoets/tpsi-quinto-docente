<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../mdn-guide-page-anatomy.svg" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia concettuale di una pagina MDN</title>
  <desc id="desc">Una pagina MDN contiene navigazione, breadcrumb, titolo e stato, sintesi, indice, contenuto, esempi, specifiche e compatibilità.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="pageArrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0 0l20 10L0 20z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#pageBg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">ANATOMIA DI UNA PAGINA MDN</text>
    <text x="960" y="116" text-anchor="middle" fill="#b8c8dc" font-size="22">La posizione può cambiare; le funzioni informative restano riconoscibili</text>

    <g transform="translate(430 165)" filter="url(#pageShadow)">
      <use href="#tpsi-browser" x="0" y="0" width="1060" height="680"/>
      <rect x="38" y="162" width="984" height="64" rx="12" fill="#e0f2fe"/>
      <text x="70" y="202" fill="#075985" font-size="19" font-weight="800">HTML  ›  Reference  ›  Elements  ›  img</text>
      <rect x="38" y="246" width="670" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="70" y="290" fill="#102a43" font-size="31" font-weight="800">&lt;img&gt; HTML element</text>
      <rect x="490" y="267" width="190" height="48" rx="24" fill="#dcfce7"/>
      <text x="585" y="298" text-anchor="middle" fill="#166534" font-size="16" font-weight="800">BASELINE ✓</text>
      <rect x="38" y="370" width="670" height="90" rx="14" fill="#f1f5f9"/>
      <text x="70" y="407" fill="#102a43" font-size="18" font-weight="800">Sintesi</text>
      <text x="70" y="438" fill="#52677f" font-size="17">Che cosa fa la funzionalità e quando si usa.</text>
      <rect x="740" y="246" width="282" height="214" rx="14" fill="#ede9fe"/>
      <text x="881" y="286" text-anchor="middle" fill="#5b21b6" font-size="19" font-weight="800">IN THIS ARTICLE</text>
      <text x="774" y="326" fill="#6d28d9" font-size="16">• Syntax / Attributes</text>
      <text x="774" y="360" fill="#6d28d9" font-size="16">• Examples</text>
      <text x="774" y="394" fill="#6d28d9" font-size="16">• Accessibility</text>
      <text x="774" y="428" fill="#6d28d9" font-size="16">• Compatibility</text>
      <rect x="38" y="482" width="472" height="156" rx="14" fill="#ecfeff"/>
      <text x="70" y="522" fill="#0f766e" font-size="19" font-weight="800">CONTENUTO ED ESEMPI</text>
      <rect x="70" y="548" width="408" height="58" rx="10" fill="#0f172a"/>
      <text x="88" y="584" fill="#a7f3d0" font-family="ui-monospace,Menlo,monospace" font-size="16">&lt;img src="..." alt="..."&gt;</text>
      <rect x="536" y="482" width="486" height="156" rx="14" fill="#fff7ed"/>
      <text x="779" y="522" text-anchor="middle" fill="#9a3412" font-size="19" font-weight="800">SPECIFICHE · COMPATIBILITÀ</text>
      <text x="574" y="560" fill="#52677f" font-size="16">• fonte normativa</text>
      <text x="574" y="592" fill="#52677f" font-size="16">• supporto dei browser</text>
    </g>

    <g fill="#f8fafc" font-size="17" font-weight="800">
      <text x="70" y="255">1 · NAVIGAZIONE</text>
      <text x="70" y="360">2 · BREADCRUMB</text>
      <text x="70" y="465">3 · TITOLO E STATO</text>
      <text x="70" y="605">4 · SINTESI</text>
      <text x="70" y="750">5 · CONTENUTO ED ESEMPI</text>
      <text x="1605" y="480">6 · INDICE</text>
      <text x="1605" y="750">7 · SPECIFICHE E COMPATIBILITÀ</text>
    </g>
    <g fill="none" stroke="#38bdf8" stroke-width="6" marker-end="url(#pageArrow)">
      <path d="M300 248h290"/>
      <path d="M300 353h220"/>
      <path d="M300 458h330"/>
      <path d="M300 598h240"/>
      <path d="M300 743h240"/>
      <path d="M1600 473h-150"/>
      <path d="M1600 743h-150"/>
    </g>
    <rect x="370" y="920" width="1180" height="70" rx="35" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="964" text-anchor="middle" fill="#e2e8f0" font-size="21">Parti comuni, profondità diversa: la lezione stabilisce che cosa studiare ora.</text>
  </g>
</svg>
