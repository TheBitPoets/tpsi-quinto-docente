<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-api-types.svg" role="img" aria-labelledby="title desc">
  <title id="title">API è un concetto generale</title>
  <desc id="desc">Una API può appartenere a una libreria, al browser, al sistema operativo oppure essere una Web API esposta da un server.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <filter id="aptShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="80" cy="100" r="300" fill="#0ea5e9" opacity=".07"/><circle cx="1840" cy="1030" r="370" fill="#14b8a6" opacity=".07"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="82" text-anchor="middle" fill="#f8fafc" font-size="48" font-weight="800">API: UN CONCETTO GENERALE</text>
    <text x="960" y="126" text-anchor="middle" fill="#b8c8dc" font-size="23">Una API non è necessariamente una Web API e non richiede sempre Internet</text>

    <path d="M960 440V520M960 500H260V610M960 500H730V610M960 500H1190V610M960 500H1660V610" fill="none" stroke="#5eead4" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="260" cy="610" r="10" fill="#5eead4"/><circle cx="730" cy="610" r="10" fill="#5eead4"/><circle cx="1190" cy="610" r="10" fill="#5eead4"/><circle cx="1660" cy="610" r="10" fill="#5eead4"/>

    <g filter="url(#aptShadow)">
      <rect x="720" y="190" width="480" height="250" rx="34" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="4"/>
      <use href="#tpsi-api" x="790" y="220" width="210" height="140"/>
      <text x="1080" y="290" text-anchor="middle" fill="#115e59" font-size="40" font-weight="800">API</text>
      <text x="1080" y="335" text-anchor="middle" fill="#52677f" font-size="20">interfaccia software</text>
      <text x="960" y="402" text-anchor="middle" fill="#115e59" font-size="18" font-weight="800">QUATTRO ESEMPI</text>

      <rect x="60" y="610" width="400" height="330" rx="30" fill="#f8fafc"/>
      <use href="#tpsi-component" x="150" y="650" width="220" height="171"/>
      <text x="260" y="865" text-anchor="middle" fill="#1e3a5f" font-size="25" font-weight="800">API DI UNA LIBRERIA</text>
      <text x="260" y="902" text-anchor="middle" fill="#52677f" font-size="18">funzioni, classi, metodi</text>

      <rect x="530" y="610" width="400" height="330" rx="30" fill="#f8fafc"/>
      <use href="#tpsi-browser" x="620" y="665" width="220" height="141"/>
      <text x="730" y="865" text-anchor="middle" fill="#1e3a5f" font-size="25" font-weight="800">API DEL BROWSER</text>
      <text x="730" y="902" text-anchor="middle" fill="#52677f" font-size="18">DOM, storage, fetch</text>

      <rect x="1000" y="610" width="400" height="330" rx="30" fill="#f8fafc"/>
      <use href="#tpsi-terminal" x="1090" y="655" width="220" height="147"/>
      <text x="1200" y="865" text-anchor="middle" fill="#1e3a5f" font-size="25" font-weight="800">API DEL SISTEMA</text>
      <text x="1200" y="902" text-anchor="middle" fill="#52677f" font-size="18">servizi del sistema operativo</text>

      <rect x="1470" y="610" width="400" height="330" rx="30" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="4"/>
      <use href="#tpsi-server" x="1530" y="655" width="155" height="118"/>
      <use href="#tpsi-api" x="1685" y="670" width="130" height="87"/>
      <text x="1670" y="865" text-anchor="middle" fill="#065f46" font-size="25" font-weight="800">WEB API</text>
      <text x="1670" y="902" text-anchor="middle" fill="#52677f" font-size="18">esposta da un server sul Web</text>
    </g>
  </g>
</svg>
