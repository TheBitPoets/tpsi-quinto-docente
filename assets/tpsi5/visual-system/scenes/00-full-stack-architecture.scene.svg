<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-full-stack-architecture.svg" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia di una web application full stack</title>
  <desc id="desc">Laptop e browser sul client comunicano tramite HTTP e WebSocket con la REST API e il backend, che accede tramite SQL al database.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="clientHead" x1="0" x2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="serverHead" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <marker id="requestArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#38bdf8"/></marker>
    <marker id="responseArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#34d399"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="90" cy="100" r="300" fill="#0ea5e9" opacity=".07"/><circle cx="1840" cy="1040" r="380" fill="#10b981" opacity=".07"/>
  <text x="960" y="66" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800">ANATOMIA DI UNA WEB APPLICATION FULL STACK</text>
  <text x="960" y="106" text-anchor="middle" fill="#b8c8dc" font-family="Inter,Arial,sans-serif" font-size="22">Responsabilità diverse, collegate attraverso contratti espliciti</text>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="45" y="145" width="660" height="815" rx="34" fill="#f8fafc"/>
    <path d="M79 145h592a34 34 0 0 1 34 34v74H45v-74a34 34 0 0 1 34-34z" fill="url(#clientHead)"/>
    <text x="85" y="213" fill="white" font-size="37" font-weight="800">CLIENT</text><text x="665" y="211" text-anchor="end" fill="#dbeafe" font-size="21" font-weight="800">FRONTEND</text>
    <rect x="85" y="282" width="580" height="570" rx="28" fill="#e8f4ff" stroke="#bdddf5" stroke-width="3"/>
    <use href="#tpsi-laptop" x="105" y="320" width="540" height="360"/>
    <use href="#tpsi-browser" x="210" y="354" width="330" height="205"/>
    <text x="375" y="452" text-anchor="middle" fill="#1e3a5f" font-size="23" font-weight="800">BROWSER</text>
    <text x="375" y="479" text-anchor="middle" fill="#52677f" font-size="14">Firefox · Chrome · Safari · Edge</text>
    <use href="#tpsi-badge-html" x="245" y="505" width="74" height="74"/><use href="#tpsi-badge-css" x="338" y="505" width="74" height="74"/><use href="#tpsi-badge-js" x="431" y="505" width="74" height="74"/>
    <text x="375" y="730" text-anchor="middle" fill="#334155" font-size="20">Il codice frontend viene eseguito nel browser</text>
    <rect x="85" y="880" width="580" height="50" rx="25" fill="#dbeafe"/><text x="375" y="912" text-anchor="middle" fill="#1e3a8a" font-size="20" font-weight="800">interfaccia · eventi · stato · rendering</text>

    <rect x="1215" y="145" width="660" height="815" rx="34" fill="#f8fafc"/>
    <path d="M1249 145h592a34 34 0 0 1 34 34v74h-660v-74a34 34 0 0 1 34-34z" fill="url(#serverHead)"/>
    <text x="1255" y="213" fill="white" font-size="37" font-weight="800">SERVER</text><text x="1835" y="211" text-anchor="end" fill="#d1fae5" font-size="21" font-weight="800">BACKEND</text>
    <rect x="1255" y="282" width="580" height="185" rx="28" fill="#eafbf3" stroke="#9de1c3" stroke-width="3"/>
    <text x="1288" y="319" fill="#166534" font-size="17" font-weight="800" letter-spacing="2">INTERFACCIA ESPOSTA</text>
    <use href="#tpsi-api" x="1280" y="330" width="155" height="104"/>
    <text x="1460" y="370" fill="#064e3b" font-family="ui-monospace,Menlo,monospace" font-size="18">GET /api/posts</text><text x="1460" y="409" fill="#064e3b" font-family="ui-monospace,Menlo,monospace" font-size="18">POST /api/posts</text>
    <rect x="1692" y="320" width="112" height="42" rx="21" fill="#0d9488"/><text x="1748" y="348" text-anchor="middle" fill="white" font-size="17" font-weight="800">JSON</text>
    <path d="M1545 468v51" stroke="#16a34a" stroke-width="7"/><path d="M1532 505l13 18 13-18" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1255" y="522" width="580" height="210" rx="28" fill="#ecfdf5"/>
    <text x="1288" y="560" fill="#166534" font-size="17" font-weight="800" letter-spacing="2">IMPLEMENTAZIONE INTERNA</text>
    <use href="#tpsi-badge-node" x="1290" y="580" width="165" height="130"/><use href="#tpsi-badge-express" x="1470" y="600" width="165" height="102"/><use href="#tpsi-service" x="1660" y="578" width="135" height="120"/>
    <text x="1727" y="716" text-anchor="middle" fill="#0f766e" font-size="15" font-weight="800">SERVIZI</text>
    <path d="M1545 732v40" stroke="#0d9488" stroke-width="7"/><rect x="1490" y="752" width="110" height="38" rx="19" fill="#0d9488"/><text x="1545" y="778" text-anchor="middle" fill="white" font-size="18" font-weight="800">SQL</text>
    <use href="#tpsi-database" x="1370" y="785" width="350" height="150"/>
    <rect x="1380" y="886" width="330" height="42" rx="21" fill="#3730a3"/>
    <text x="1545" y="914" text-anchor="middle" fill="white" font-size="21" font-weight="800">DATABASE · SQLite</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="800">
    <text x="960" y="220" fill="#cbd5e1" font-size="20" letter-spacing="3">PROTOCOLLI</text>
    <path d="M745 332h415" fill="none" stroke="#38bdf8" stroke-width="9" marker-end="url(#requestArrow)"/><text x="950" y="302" fill="#7dd3fc" font-size="22">HTTP REQUEST</text>
    <path d="M1175 430H760" fill="none" stroke="#34d399" stroke-width="9" marker-end="url(#responseArrow)"/><text x="965" y="469" fill="#6ee7b7" font-size="22">HTTP RESPONSE</text>
    <rect x="775" y="520" width="370" height="124" rx="28" fill="#172f4a" stroke="#8b5cf6" stroke-width="3"/>
    <text x="960" y="555" fill="#ddd6fe" font-size="19">WEBSOCKET</text><path d="M842 586h236" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/><path d="M842 586l24-15v30zM1078 586l-24-15v30z" fill="#c4b5fd"/><text x="960" y="625" fill="#c4b5fd" font-size="16">canale persistente e bidirezionale</text>
    <use href="#tpsi-network" x="845" y="690" width="230" height="230"/><text x="960" y="947" fill="#dbeafe" font-size="21">RETE</text>
  </g>
  <rect x="280" y="995" width="1360" height="50" rx="25" fill="#e2e8f0" opacity=".12"/>
  <text x="960" y="1027" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="20">Il browser non accede direttamente al database: passa attraverso l'API e i controlli del backend.</text>
</svg>
