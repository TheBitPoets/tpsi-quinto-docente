<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-mdn-http-fetch-coverage.svg" role="img" aria-labelledby="title desc"><title id="title">Mappa di copertura della lezione HTTP Fetch e REST</title><desc id="desc">La mappa collega sei nuclei della dispensa alle fonti MDN, RFC e Fetch Standard. Verde indica coperto, ambra integrazione del corso e grigio argomenti successivi.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="g" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#f59e0b"/></marker><marker id="s" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#94a3b8"/></marker></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="62" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="800">DISPENSA ↔ DOCUMENTAZIONE · HTTP, FETCH E REST</text><text x="960" y="103" text-anchor="middle" fill="#b8c8dc" font-size="21">Dalla semantica del protocollo al client Feisbuc</text><text x="390" y="150" text-anchor="middle" fill="#7dd3fc" font-size="22" font-weight="800">PARAGRAFI DELLA DISPENSA</text><text x="1530" y="150" text-anchor="middle" fill="#86efac" font-size="22" font-weight="800">FONTI UFFICIALI</text>
<g font-size="18"><g transform="translate(65 180)"><rect width="650" height="82" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="25" y="34" fill="#075985" font-weight="800">HTTP/HTTPS e anatomia dei messaggi</text><text x="25" y="62" fill="#52677f">request, response, header, content e versioni</text></g><g transform="translate(65 280)"><rect width="650" height="82" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="25" y="34" fill="#075985" font-weight="800">URL, metodi, status e representation</text><text x="25" y="62" fill="#52677f">identificazione, intento, risultato e media type</text></g><g transform="translate(65 380)"><rect width="650" height="82" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="25" y="34" fill="#075985" font-weight="800">Promise, async/await e Fetch</text><text x="25" y="62" fill="#52677f">Response, body e confini asincroni</text></g><g transform="translate(65 480)"><rect width="650" height="82" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="25" y="34" fill="#075985" font-weight="800">REST orientato alle risorse</text><text x="25" y="62" fill="#52677f">vincoli e interfaccia uniforme applicati a Feisbuc</text></g><g transform="translate(65 580)"><rect width="650" height="82" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="25" y="34" fill="#075985" font-weight="800">Same-origin, CORS e caching minimo</text><text x="25" y="62" fill="#52677f">policy browser, preflight e riuso controllato</text></g><g transform="translate(65 680)"><rect width="650" height="82" rx="20" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="25" y="34" fill="#075985" font-weight="800">Backend, auth e cache avanzata</text><text x="25" y="62" fill="#52677f">confini dichiarati per le UDA successive</text></g>
