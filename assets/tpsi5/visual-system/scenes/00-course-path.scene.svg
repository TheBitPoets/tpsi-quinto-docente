      <path d="M30 0h190a30 30 0 0 1 30 30v95H0V30A30 30 0 0 1 30 0z" fill="#0ea5e9"/>
      <circle cx="34" cy="35" r="18" fill="#e0f2fe"/><text x="34" y="42" text-anchor="middle" fill="#0369a1" font-size="20" font-weight="800">2</text>
