      <text x="125" y="449" text-anchor="middle" fill="#52677f" font-size="17">e avvia le richieste</text>
      <rect x="30" y="535" width="190" height="84" rx="20" fill="#dbeafe"/>
      <text x="125" y="569" text-anchor="middle" fill="#1e3a8a" font-size="16" font-weight="800">Firefox · Chrome</text>
      <text x="125" y="595" text-anchor="middle" fill="#1e3a8a" font-size="16" font-weight="800">Safari · Edge</text>
