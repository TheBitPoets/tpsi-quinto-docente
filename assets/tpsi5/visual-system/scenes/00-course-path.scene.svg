      <text x="125" y="444" text-anchor="middle" fill="#52677f" font-size="17">il backend legge</text>
      <text x="125" y="473" text-anchor="middle" fill="#52677f" font-size="17">e modifica i dati</text>
      <rect x="30" y="535" width="190" height="84" rx="20" fill="#e0e7ff"/>
      <text x="125" y="570" text-anchor="middle" fill="#3730a3" font-size="17" font-weight="800">SQL</text>
      <text x="125" y="597" text-anchor="middle" fill="#3730a3" font-size="16" font-weight="800">SQLite</text>
    </g>

    <g transform="translate(1620 215)">
