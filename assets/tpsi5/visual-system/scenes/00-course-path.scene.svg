      <path d="M30 0h190a30 30 0 0 1 30 30v95H0V30A30 30 0 0 1 30 0z" fill="#4f46e5"/>
      <circle cx="34" cy="35" r="18" fill="#e0e7ff"/><text x="34" y="42" text-anchor="middle" fill="#4338ca" font-size="20" font-weight="800">5</text>
