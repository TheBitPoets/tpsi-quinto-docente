  <rect x="300" y="968" width="1320" height="54" rx="27" fill="#e2e8f0" opacity=".12"/>
  <text x="960" y="1003" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="21">Ogni modulo del corso aggiunge o rende più preciso un passaggio di questa catena.</text>
