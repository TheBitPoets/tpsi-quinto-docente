<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-course-path.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal browser al servizio completo</title>
  <desc id="desc">Il percorso del corso attraversa browser, frontend HTML CSS JavaScript, protocolli HTTP e WebSocket, REST API e backend, database, autenticazione, realtime e deploy.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="pathBackground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <linearGradient id="capabilitiesHead" x1="0" x2="1"><stop stop-color="#d97706"/><stop offset=".55" stop-color="#e11d48"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="pathArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#pathBackground)"/>
  <circle cx="70" cy="100" r="280" fill="#0ea5e9" opacity=".07"/><circle cx="1850" cy="1040" r="370" fill="#8b5cf6" opacity=".07"/>
  <text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800">DAL BROWSER AL SERVIZIO COMPLETO</text>
  <text x="960" y="116" text-anchor="middle" fill="#b8c8dc" font-family="Inter,Arial,sans-serif" font-size="23">La mappa del percorso full stack che costruiremo durante l'anno</text>

  <g fill="none" stroke="#94a3b8" stroke-width="8" marker-end="url(#pathArrow)">
    <path d="M304 560h49"/><path d="M618 560h49"/><path d="M932 560h49"/><path d="M1246 560h49"/><path d="M1560 560h49"/>
  </g>

