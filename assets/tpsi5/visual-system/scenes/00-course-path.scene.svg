      <path d="M30 0h190a30 30 0 0 1 30 30v95H0V30A30 30 0 0 1 30 0z" fill="url(#capabilitiesHead)"/>
      <circle cx="34" cy="35" r="18" fill="#fff7ed"/><text x="34" y="42" text-anchor="middle" fill="#c2410c" font-size="20" font-weight="800">6</text>
