    <g transform="translate(50 215)">
      <rect width="250" height="700" rx="30" fill="#f8fafc"/>
      <path d="M30 0h190a30 30 0 0 1 30 30v95H0V30A30 30 0 0 1 30 0z" fill="#2563eb"/>
      <circle cx="34" cy="35" r="18" fill="#dbeafe"/><text x="34" y="42" text-anchor="middle" fill="#1d4ed8" font-size="20" font-weight="800">1</text>
