      <circle cx="34" cy="35" r="18" fill="#ede9fe"/><text x="34" y="42" text-anchor="middle" fill="#6d28d9" font-size="20" font-weight="800">3</text>
      <text x="125" y="89" text-anchor="middle" fill="white" font-size="26" font-weight="800">PROTOCOLLI</text>
