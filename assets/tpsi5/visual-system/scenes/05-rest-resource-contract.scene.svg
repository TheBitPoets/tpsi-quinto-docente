<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-rest-resource-contract.svg" role="img" aria-labelledby="title desc"><title id="title">Contratto REST orientato alle risorse</title><desc id="desc">Il client accede alla collezione posts e al post p42 tramite URL. Il metodo esprime l'intento, la rappresentazione descrive i dati e lo status comunica il risultato.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">REST: RISORSA, NON VERBO NELL'URL</text><text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">L'interfaccia uniforme separa identificazione, intento, dati e risultato</text>
<g transform="translate(90 260)"><use href="#tpsi-browser" width="400" height="256"/><text x="200" y="305" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="800">CLIENT</text></g><g transform="translate(1435 235)"><use href="#tpsi-api" width="360" height="240"/><text x="180" y="295" text-anchor="middle" fill="#67e8f9" font-size="25" font-weight="800">API DEL SERVER</text></g><path d="M505 390H1405" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
<g transform="translate(580 205)"><rect width="730" height="330" rx="32" fill="#f8fafc"/><text x="365" y="50" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">UNA REQUEST = QUATTRO DECISIONI</text><text x="45" y="108" fill="#075985" font-size="19" font-weight="800">RISORSA</text><text x="220" y="108" fill="#334155" font-size="19" font-family="monospace">/api/posts/p42</text><text x="45" y="162" fill="#075985" font-size="19" font-weight="800">INTENTO</text><text x="220" y="162" fill="#334155" font-size="19" font-family="monospace">PATCH</text><text x="45" y="216" fill="#075985" font-size="19" font-weight="800">DATI</text><text x="220" y="216" fill="#334155" font-size="19" font-family="monospace">{ "liked": true }</text><text x="45" y="270" fill="#075985" font-size="19" font-weight="800">RISULTATO</text><text x="220" y="270" fill="#334155" font-size="19" font-family="monospace">200 + representation aggiornata</text></g>
<g transform="translate(140 650)"><rect width="1640" height="260" rx="34" fill="#ecfdf5" stroke="#22c55e" stroke-width="4"/><text x="820" y="54" text-anchor="middle" fill="#166534" font-size="25" font-weight="800">ROTTE COERENTI</text><g fill="#14532d" font-size="21" font-family="monospace"><text x="70" y="115">GET    /api/posts</text><text x="70" y="168">POST   /api/posts</text><text x="870" y="115">GET    /api/posts/p42</text><text x="870" y="168">PATCH  /api/posts/p42</text></g><text x="820" y="222" text-anchor="middle" fill="#3f5f4b" font-size="19">La stessa semantica dei metodi si applica a risorse differenti</text></g><rect x="425" y="950" width="1070" height="72" rx="24" fill="#fff7ed"/><text x="960" y="995" text-anchor="middle" fill="#92400e" font-size="20" font-weight="800">JSON + endpoint non bastano da soli a rendere REST un'API</text></g></svg>
