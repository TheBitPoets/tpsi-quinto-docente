<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../01-html-dom-tree.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal codice HTML all'albero DOM</title>
  <desc id="desc">Un frammento HTML di Feisbuc viene interpretato dal browser e rappresentato come un albero di nodi DOM con relazioni padre figlio.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="domBackground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="domShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="domArrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto"><path d="M0 0l24 12L0 24z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#domBackground)"/>
  <circle cx="70" cy="80" r="280" fill="#0ea5e9" opacity=".08"/><circle cx="1850" cy="1020" r="370" fill="#8b5cf6" opacity=".08"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">DAL CODICE HTML ALL'ALBERO DOM</text>
    <text x="960" y="116" text-anchor="middle" fill="#b8c8dc" font-size="22">L'annidamento del markup diventa una relazione tra nodi padre e nodi figli</text>

    <g filter="url(#domShadow)">
      <rect x="70" y="190" width="690" height="730" rx="34" fill="#f8fafc"/>
      <path d="M104 190h622a34 34 0 0 1 34 34v80H70v-80a34 34 0 0 1 34-34z" fill="#0ea5e9"/>
      <text x="415" y="260" text-anchor="middle" fill="white" font-size="29" font-weight="800">FILE HTML · TESTO SORGENTE</text>
      <rect x="115" y="342" width="600" height="518" rx="24" fill="#0f172a"/>
      <text x="155" y="394" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace" font-size="22">
        <tspan x="155" dy="0">&lt;body&gt;</tspan>
        <tspan x="155" dy="46">  &lt;header&gt;</tspan>
        <tspan x="155" dy="46">    &lt;h1&gt;Feisbuc&lt;/h1&gt;</tspan>
        <tspan x="155" dy="46">  &lt;/header&gt;</tspan>
        <tspan x="155" dy="46">  &lt;main&gt;</tspan>
        <tspan x="155" dy="46">    &lt;article&gt;</tspan>
        <tspan x="155" dy="46">      &lt;p&gt;Primo post&lt;/p&gt;</tspan>
        <tspan x="155" dy="46">    &lt;/article&gt;</tspan>
        <tspan x="155" dy="46">  &lt;/main&gt;</tspan>
        <tspan x="155" dy="46">&lt;/body&gt;</tspan>
      </text>

      <rect x="1010" y="190" width="840" height="730" rx="34" fill="#f8fafc"/>
      <path d="M1044 190h772a34 34 0 0 1 34 34v80h-840v-80a34 34 0 0 1 34-34z" fill="#8b5cf6"/>
      <text x="1430" y="260" text-anchor="middle" fill="white" font-size="29" font-weight="800">DOM · STRUTTURA AD ALBERO</text>
      <g fill="none" stroke="#a78bfa" stroke-width="5">
        <path d="M1430 405v55M1430 460H1220v70M1430 460h210v70M1220 594v64M1640 594v64M1640 722v64"/>
      </g>
      <g text-anchor="middle" font-size="19" font-weight="800">
        <rect x="1350" y="340" width="160" height="66" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="1430" y="381" fill="#5b21b6">body</text>
        <rect x="1130" y="530" width="180" height="66" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="1220" y="571" fill="#075985">header</text>
        <rect x="1550" y="530" width="180" height="66" rx="20" fill="#d1fae5" stroke="#34d399" stroke-width="3"/><text x="1640" y="571" fill="#065f46">main</text>
        <rect x="1130" y="658" width="180" height="66" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="1220" y="699" fill="#9a3412">h1</text>
        <rect x="1550" y="658" width="180" height="66" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="1640" y="699" fill="#065f46">article</text>
        <rect x="1550" y="786" width="180" height="66" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><text x="1640" y="827" fill="#9a3412">p</text>
      </g>
      <text x="1220" y="756" text-anchor="middle" fill="#52677f" font-size="15">“Feisbuc”</text>
      <text x="1745" y="827" fill="#52677f" font-size="15">“Primo post”</text>
    </g>

    <path d="M785 555h190" fill="none" stroke="#38bdf8" stroke-width="8" marker-end="url(#domArrow)"/>
    <text x="880" y="515" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="800">IL BROWSER</text>
    <text x="880" y="605" text-anchor="middle" fill="#dbeafe" font-size="17">interpreta</text>

    <rect x="285" y="968" width="1350" height="58" rx="29" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="1005" text-anchor="middle" fill="#e2e8f0" font-size="20">DevTools mostra il DOM costruito dal browser, che può differire dal testo originario se il markup contiene errori.</text>
  </g>
</svg>
