<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-output="../../04-json-storage-boundary.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal valore JavaScript al testo JSON e ritorno</title>
  <desc id="desc">JSON.stringify serializza un array JavaScript in testo JSON memorizzabile; JSON.parse deserializza il testo in un nuovo valore JavaScript. Web Storage conserva soltanto stringhe.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#a78bfa"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="800" y="70" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="800">OBJECT E JSON NON SONO LA STESSA COSA</text><text x="800" y="112" text-anchor="middle" fill="#b8c8dc" font-size="21">Il programma usa valori; storage e rete trasportano o conservano testo</text>
    <g transform="translate(65 245)"><rect width="390" height="330" rx="34" fill="#fffbea" stroke="#facc15" stroke-width="5"/><use href="#tpsi-badge-js" x="135" y="30" width="120" height="120"/><text x="195" y="190" text-anchor="middle" fill="#713f12" font-size="25" font-weight="800">VALORE JAVASCRIPT</text><text x="195" y="235" text-anchor="middle" fill="#713f12" font-size="17" font-family="monospace">[{ id: "p1", likes: 2 }]</text><text x="195" y="286" text-anchor="middle" fill="#7c5b24" font-size="16">array → object → proprietà</text></g>
    <path d="M470 345h230" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/><rect x="500" y="286" width="170" height="42" rx="21" fill="#bae6fd"/><text x="585" y="314" text-anchor="middle" fill="#075985" font-size="16" font-weight="800">JSON.stringify()</text><text x="585" y="385" text-anchor="middle" fill="#7dd3fc" font-size="16">serializzazione</text>
    <g transform="translate(720 245)"><rect width="390" height="330" rx="34" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><use href="#tpsi-document" x="135" y="22" width="120" height="146"/><text x="195" y="205" text-anchor="middle" fill="#5b21b6" font-size="25" font-weight="800">TESTO JSON</text><text x="195" y="250" text-anchor="middle" fill="#5b21b6" font-size="15" font-family="monospace">[{"id":"p1","likes":2}]</text><text x="195" y="292" text-anchor="middle" fill="#6d5a90" font-size="16">una stringa con sintassi precisa</text></g>
    <path d="M1125 410h170" fill="none" stroke="#a78bfa" stroke-width="7" marker-end="url(#b)"/><text x="1210" y="385" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="800">setItem()</text>
    <g transform="translate(1310 275)"><rect width="240" height="270" rx="32" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/><text x="120" y="50" text-anchor="middle" fill="#166534" font-size="23" font-weight="800">WEB STORAGE</text><text x="120" y="92" text-anchor="middle" fill="#3f5f4b" font-size="17">chiave → stringa</text><rect x="32" y="125" width="176" height="96" rx="18" fill="#fff" stroke="#86efac" stroke-width="3"/><text x="120" y="160" text-anchor="middle" fill="#14532d" font-size="15" font-family="monospace">feisbuc.posts</text><text x="120" y="194" text-anchor="middle" fill="#14532d" font-size="15">testo JSON</text><text x="120" y="248" text-anchor="middle" fill="#3f5f4b" font-size="15">non è un database</text></g>
    <path d="M915 595v120H260V595" fill="none" stroke="#a78bfa" stroke-width="7" marker-end="url(#b)"/><rect x="500" y="650" width="190" height="42" rx="21" fill="#ddd6fe"/><text x="595" y="678" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="800">JSON.parse()</text><text x="805" y="684" text-anchor="middle" fill="#c4b5fd" font-size="16">deserializzazione · può fallire</text>
    <g transform="translate(210 780)"><rect width="1180" height="76" rx="24" fill="#f8fafc"/><text x="590" y="31" text-anchor="middle" fill="#102a43" font-size="19" font-weight="800">REGOLA</text><text x="590" y="57" text-anchor="middle" fill="#52677f" font-size="17">Dopo parse ottieni un nuovo valore: controllane sempre forma e contenuto.</text></g>
  </g>
</svg>
