<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-grid-anatomy.svg" role="img" aria-labelledby="title desc"><title id="title">Anatomia di CSS Grid</title><desc id="desc">Una griglia con linee numerate mostra colonne, righe, track, celle, gap e un grid item esteso su più celle.</desc><defs id="visual-kit-components"/><defs><linearGradient id="gridBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="gridShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".32"/></filter></defs><rect width="1920" height="1080" fill="url(#gridBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="78" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">CSS GRID: UNA STRUTTURA BIDIMENSIONALE</text><text x="960" y="122" text-anchor="middle" fill="#b8c8dc" font-size="22">Linee delimitano track; righe e colonne formano celle</text>
    <g filter="url(#gridShadow)"><rect x="120" y="210" width="1120" height="690" rx="36" fill="#f8fafc"/></g>
    <g transform="translate(205 310)"><rect width="950" height="475" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><rect x="25" y="25" width="275" height="190" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><rect x="325" y="25" width="275" height="190" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><rect x="625" y="25" width="300" height="190" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><rect x="25" y="240" width="575" height="210" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><rect x="625" y="240" width="300" height="210" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="313" y="350" text-anchor="middle" fill="#5b21b6" font-size="25" font-weight="800">GRID ITEM: 2 CELLE</text><text x="775" y="350" text-anchor="middle" fill="#065f46" font-size="23" font-weight="800">CELL</text>
      <g fill="#7dd3fc" font-size="19" font-weight="800" text-anchor="middle"><text x="0" y="-22">1</text><text x="312" y="-22">2</text><text x="612" y="-22">3</text><text x="950" y="-22">4</text></g><g fill="#7dd3fc" font-size="19" font-weight="800"><text x="-34" y="8">1</text><text x="-34" y="232">2</text><text x="-34" y="480">3</text></g>
    </g>
    <g transform="translate(1325 220)"><rect width="480" height="680" rx="34" fill="#f8fafc"/><text x="240" y="60" text-anchor="middle" fill="#102a43" font-size="27" font-weight="800">VOCABOLARIO</text><rect x="35" y="95" width="410" height="90" rx="18" fill="#e0f2fe"/><text x="60" y="132" fill="#075985" font-size="21" font-weight="800">GRID LINE</text><text x="60" y="161" fill="#52677f" font-size="17">confine numerabile della griglia</text><rect x="35" y="205" width="410" height="90" rx="18" fill="#eff6ff"/><text x="60" y="242" fill="#1e3a8a" font-size="21" font-weight="800">TRACK</text><text x="60" y="271" fill="#52677f" font-size="17">spazio fra due linee: riga o colonna</text><rect x="35" y="315" width="410" height="90" rx="18" fill="#ecfdf5"/><text x="60" y="352" fill="#065f46" font-size="21" font-weight="800">CELL</text><text x="60" y="381" fill="#52677f" font-size="17">incrocio di una riga e una colonna</text><rect x="35" y="425" width="410" height="90" rx="18" fill="#fff7ed"/><text x="60" y="462" fill="#9a3412" font-size="21" font-weight="800">GAP</text><text x="60" y="491" fill="#52677f" font-size="17">spazio controllato fra le track</text><rect x="35" y="535" width="410" height="100" rx="18" fill="#f5f3ff"/><text x="60" y="574" fill="#5b21b6" font-size="21" font-weight="800">GRID ITEM</text><text x="60" y="603" fill="#52677f" font-size="17">figlio diretto, su una o più celle</text></g>
    <rect x="330" y="950" width="1260" height="62" rx="31" fill="#e2e8f0" opacity=".12"/><text x="960" y="990" text-anchor="middle" fill="#e2e8f0" font-size="20">Senza posizione esplicita, l'auto-placement segue l'ordine del DOM.</text>
  </g>
</svg>
