<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../03-bootstrap-responsibility-layers.svg" role="img" aria-labelledby="title desc"><title id="title">Responsabilità per l'accessibilità di una pagina Bootstrap</title><desc id="desc">Il framework offre pattern di base, l'autore fornisce semantica e contenuto, mentre i test verificano tastiera, focus, contrasto, zoom e tecnologie assistive.</desc><defs id="visual-kit-components"/><defs><linearGradient id="arlBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="arlSh"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".3"/></filter><marker id="arlArr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker></defs><rect width="1920" height="1080" fill="url(#arlBg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="78" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">ACCESSIBILITÀ: TRE RESPONSABILITÀ</text><text x="960" y="122" text-anchor="middle" fill="#b8c8dc" font-size="22">Il framework aiuta, ma il risultato emerge dalle scelte e dalle verifiche del progetto</text><g filter="url(#arlSh)"><rect x="95" y="230" width="510" height="610" rx="38" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><rect x="705" y="230" width="510" height="610" rx="38" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><rect x="1315" y="230" width="510" height="610" rx="38" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/></g><text x="350" y="310" text-anchor="middle" fill="#5b21b6" font-size="29" font-weight="800">BOOTSTRAP</text><text x="960" y="310" text-anchor="middle" fill="#075985" font-size="29" font-weight="800">AUTORE</text><text x="1570" y="310" text-anchor="middle" fill="#166534" font-size="29" font-weight="800">VERIFICA</text><g fill="#52677f" font-size="21"><text x="145" y="390">• pattern documentati</text><text x="145" y="445">• focus di base</text><text x="145" y="500">• classi helper</text><text x="145" y="555">• stati dei componenti</text><text x="145" y="640">Non conosce il significato</text><text x="145" y="678">del tuo contenuto.</text><text x="755" y="390">• heading e landmark</text><text x="755" y="445">• label e testi chiari</text><text x="755" y="500">• ARIA corretta</text><text x="755" y="555">• colori personalizzati</text><text x="755" y="610">• ordine e comportamento</text><text x="1365" y="390">• sola tastiera</text><text x="1365" y="445">• focus visibile</text><text x="1365" y="500">• contrasto</text><text x="1365" y="555">• zoom al 200%</text><text x="1365" y="610">• tecnologie assistive</text></g><path d="M620 535h62" stroke="#38bdf8" stroke-width="7" marker-end="url(#arlArr)"/><path d="M1230 535h62" stroke="#38bdf8" stroke-width="7" marker-end="url(#arlArr)"/><rect x="270" y="905" width="1380" height="100" rx="50" fill="#f8fafc"/><text x="960" y="948" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">ACCESSIBILE NON È UNA CLASSE DA AGGIUNGERE</text><text x="960" y="980" text-anchor="middle" fill="#52677f" font-size="19">È una qualità da progettare, osservare e verificare lungo l’intero percorso utente.</text></g></svg>
