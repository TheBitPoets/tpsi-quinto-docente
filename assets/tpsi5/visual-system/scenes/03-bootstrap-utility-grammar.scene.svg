<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../03-bootstrap-utility-grammar.svg" role="img" aria-labelledby="title desc"><title id="title">Grammatica delle utility Bootstrap</title><desc id="desc">Le classi mb-3, d-md-flex e align-items-center sono scomposte in proprietà, lato, breakpoint e valore, quindi collegate al CSS sottostante.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bugBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="bugSh"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".3"/></filter><marker id="bugArr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0l16 8L0 16z" fill="#38bdf8"/></marker></defs><rect width="1920" height="1080" fill="url(#bugBg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="76" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">LE UTILITY HANNO UNA GRAMMATICA</text><text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">Leggere il nome permette di prevedere la responsabilità CSS</text>
<g filter="url(#bugSh)"><rect x="90" y="205" width="1740" height="700" rx="38" fill="#f8fafc"/></g><g font-size="20" font-weight="800" text-anchor="middle"><text x="260" y="270" fill="#52677f">CLASSE</text><text x="620" y="270" fill="#52677f">SCOMPOSIZIONE</text><text x="1330" y="270" fill="#52677f">SIGNIFICATO OSSERVABILE</text></g>
<g><rect x="145" y="315" width="250" height="120" rx="26" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><text x="270" y="389" text-anchor="middle" fill="#1d4ed8" font-size="37" font-weight="800">mb-3</text><rect x="475" y="315" width="205" height="120" rx="24" fill="#ffedd5"/><rect x="700" y="315" width="205" height="120" rx="24" fill="#ecfdf5"/><rect x="925" y="315" width="205" height="120" rx="24" fill="#fef9c3"/><text x="577" y="365" text-anchor="middle" fill="#9a3412" font-size="18" font-weight="800">m</text><text x="577" y="396" text-anchor="middle" fill="#52677f" font-size="16">margin</text><text x="802" y="365" text-anchor="middle" fill="#166534" font-size="18" font-weight="800">b</text><text x="802" y="396" text-anchor="middle" fill="#52677f" font-size="16">bottom</text><text x="1027" y="365" text-anchor="middle" fill="#854d0e" font-size="18" font-weight="800">3</text><text x="1027" y="396" text-anchor="middle" fill="#52677f" font-size="16">valore di scala</text><path d="M1150 375h128" stroke="#38bdf8" stroke-width="6" marker-end="url(#bugArr)"/><text x="1490" y="366" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">margine inferiore</text><text x="1490" y="399" text-anchor="middle" fill="#52677f" font-size="17">non significa 3 pixel</text></g>
<g><rect x="145" y="485" width="250" height="120" rx="26" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="4"/><text x="270" y="559" text-anchor="middle" fill="#5b21b6" font-size="32" font-weight="800">d-md-flex</text><rect x="475" y="485" width="205" height="120" rx="24" fill="#ffedd5"/><rect x="700" y="485" width="205" height="120" rx="24" fill="#f5f3ff"/><rect x="925" y="485" width="205" height="120" rx="24" fill="#ecfdf5"/><text x="577" y="535" text-anchor="middle" fill="#9a3412" font-size="18" font-weight="800">d</text><text x="577" y="566" text-anchor="middle" fill="#52677f" font-size="16">display</text><text x="802" y="535" text-anchor="middle" fill="#5b21b6" font-size="18" font-weight="800">md</text><text x="802" y="566" text-anchor="middle" fill="#52677f" font-size="16">da 768 px</text><text x="1027" y="535" text-anchor="middle" fill="#166534" font-size="18" font-weight="800">flex</text><text x="1027" y="566" text-anchor="middle" fill="#52677f" font-size="16">valore</text><path d="M1150 545h128" stroke="#38bdf8" stroke-width="6" marker-end="url(#bugArr)"/><text x="1490" y="536" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">display: flex</text><text x="1490" y="569" text-anchor="middle" fill="#52677f" font-size="17">dentro una media query</text></g>
