<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../00-shared-web-service.svg" role="img" aria-labelledby="title desc">
  <title id="title">Client diversi usano lo stesso web service</title>
  <desc id="desc">Browser, applicazione mobile e altro server raggiungono la stessa Web API, che permette di utilizzare un servizio sul server.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <filter id="swsShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".3"/></filter>
    <marker id="swsArrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto"><path d="M0 0l24 12L0 24z" fill="#38bdf8"/></marker>
    <marker id="swsInternal" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto"><path d="M0 0l24 12L0 24z" fill="#0d9488"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="#08192c"/>
  <circle cx="60" cy="70" r="280" fill="#2563eb" opacity=".08"/><circle cx="1870" cy="1040" r="390" fill="#10b981" opacity=".08"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="82" text-anchor="middle" fill="#f8fafc" font-size="48" font-weight="800">CLIENT DIVERSI, STESSO SERVIZIO</text>
    <text x="960" y="126" text-anchor="middle" fill="#b8c8dc" font-size="23">Tutti utilizzano la stessa interfaccia pubblica esposta dal server</text>

    <path d="M500 320C650 320 650 475 770 475" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#swsArrow)"/>
    <path d="M500 540H770" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#swsArrow)"/>
    <path d="M500 760C650 760 650 605 770 605" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#swsArrow)"/>
    <path d="M1190 540H1370" fill="none" stroke="#0d9488" stroke-width="9" marker-end="url(#swsInternal)"/>
    <text x="1280" y="500" text-anchor="middle" fill="#5eead4" font-size="19" font-weight="800">ATTIVA</text>

    <g filter="url(#swsShadow)">
      <rect x="80" y="220" width="420" height="200" rx="28" fill="#e8f4ff"/>
      <use href="#tpsi-browser" x="115" y="260" width="185" height="118"/>
      <text x="390" y="307" text-anchor="middle" fill="#1e3a5f" font-size="25" font-weight="800">BROWSER</text>
      <text x="390" y="344" text-anchor="middle" fill="#52677f" font-size="18">applicazione Web</text>

      <rect x="80" y="440" width="420" height="200" rx="28" fill="#e8f4ff"/>
      <use href="#tpsi-smartphone" x="150" y="462" width="96" height="157"/>
      <text x="380" y="527" text-anchor="middle" fill="#1e3a5f" font-size="25" font-weight="800">APP MOBILE</text>
      <text x="380" y="564" text-anchor="middle" fill="#52677f" font-size="18">client per smartphone</text>

      <rect x="80" y="660" width="420" height="200" rx="28" fill="#e8f4ff"/>
      <use href="#tpsi-server" x="115" y="700" width="185" height="141"/>
      <text x="390" y="747" text-anchor="middle" fill="#1e3a5f" font-size="25" font-weight="800">ALTRO SERVER</text>
      <text x="390" y="784" text-anchor="middle" fill="#52677f" font-size="18">integrazione software</text>

      <rect x="790" y="300" width="400" height="480" rx="34" fill="#f8fafc"/>
      <path d="M824 300h332a34 34 0 0 1 34 34v82H790v-82a34 34 0 0 1 34-34z" fill="#0d9488"/>
      <text x="990" y="369" text-anchor="middle" fill="white" font-size="32" font-weight="800">WEB API</text>
      <use href="#tpsi-api" x="845" y="455" width="290" height="193"/>
      <text x="990" y="704" text-anchor="middle" fill="#115e59" font-size="20" font-weight="800">INTERFACCIA COMUNE</text>

      <rect x="1390" y="300" width="450" height="480" rx="34" fill="#f8fafc"/>
      <path d="M1424 300h382a34 34 0 0 1 34 34v82h-450v-82a34 34 0 0 1 34-34z" fill="#059669"/>
      <text x="1615" y="369" text-anchor="middle" fill="white" font-size="32" font-weight="800">WEB SERVICE</text>
      <use href="#tpsi-service" x="1480" y="455" width="270" height="219"/>
      <text x="1615" y="704" text-anchor="middle" fill="#166534" font-size="20" font-weight="800">SERVIZIO SUL SERVER</text>
    </g>

    <rect x="410" y="940" width="1100" height="62" rx="31" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="981" text-anchor="middle" fill="#dbeafe" font-size="24" font-weight="800">cambia il client · non cambiano l'interfaccia e il servizio</text>
  </g>
</svg>
