<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-cascade-decision.svg" role="img" aria-labelledby="title desc">
  <title id="title">Decisione semplificata della cascade CSS</title><desc id="desc">Le dichiarazioni candidate attraversano rilevanza, origine e importanza, specificità e ordine di sorgente fino a determinare il valore vincente.</desc><defs id="visual-kit-components"/>
  <defs><linearGradient id="cascadeBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="cascadeShadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter><marker id="cascadeArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#7dd3fc"/></marker></defs><rect width="1920" height="1080" fill="url(#cascadeBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="76" text-anchor="middle" fill="#f8fafc" font-size="44" font-weight="800">COME DECIDE LA CASCADE?</text><text x="960" y="118" text-anchor="middle" fill="#b8c8dc" font-size="21">Un modello iniziale per seguire una dichiarazione fino al valore calcolato</text>
    <g filter="url(#cascadeShadow)"><g transform="translate(80 275)"><rect width="300" height="400" rx="30" fill="#eff6ff" stroke="#38bdf8" stroke-width="4"/><text x="150" y="60" text-anchor="middle" fill="#075985" font-size="23" font-weight="800">CANDIDATE</text><rect x="35" y="100" width="230" height="66" rx="15" fill="#dbeafe"/><text x="150" y="142" text-anchor="middle" fill="#1e3a8a" font-size="18">.post { color: blue }</text><rect x="35" y="185" width="230" height="66" rx="15" fill="#dbeafe"/><text x="150" y="227" text-anchor="middle" fill="#1e3a8a" font-size="18">p { color: green }</text><rect x="35" y="270" width="230" height="66" rx="15" fill="#dbeafe"/><text x="150" y="312" text-anchor="middle" fill="#1e3a8a" font-size="18">#feed p { color: red }</text></g>
      <g transform="translate(465 275)"><rect width="300" height="400" rx="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/><circle cx="150" cy="82" r="43" fill="#64748b"/><text x="150" y="95" text-anchor="middle" fill="white" font-size="34" font-weight="800">1</text><text x="150" y="160" text-anchor="middle" fill="#334155" font-size="25" font-weight="800">RILEVANZA</text><text x="150" y="210" text-anchor="middle" fill="#52677f" font-size="18">Il selettore corrisponde?</text><text x="150" y="244" text-anchor="middle" fill="#52677f" font-size="18">La @media è vera?</text><rect x="45" y="296" width="210" height="58" rx="29" fill="#e2e8f0"/><text x="150" y="332" text-anchor="middle" fill="#334155" font-size="16" font-weight="800">SCARTA LE ALTRE</text></g>
      <g transform="translate(850 275)"><rect width="300" height="400" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/><circle cx="150" cy="82" r="43" fill="#ea580c"/><text x="150" y="95" text-anchor="middle" fill="white" font-size="34" font-weight="800">2</text><text x="150" y="160" text-anchor="middle" fill="#9a3412" font-size="23" font-weight="800">ORIGINE E PESO</text><text x="150" y="210" text-anchor="middle" fill="#7c2d12" font-size="18">Browser, autore, utente</text><text x="150" y="244" text-anchor="middle" fill="#7c2d12" font-size="18">normale o !important</text><rect x="45" y="296" width="210" height="58" rx="29" fill="#ffedd5"/><text x="150" y="332" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="800">CONFRONTA IL PESO</text></g>
      <g transform="translate(1235 275)"><rect width="300" height="400" rx="30" fill="#f5f3ff" stroke="#a78bfa" stroke-width="4"/><circle cx="150" cy="82" r="43" fill="#7c3aed"/><text x="150" y="95" text-anchor="middle" fill="white" font-size="34" font-weight="800">3</text><text x="150" y="160" text-anchor="middle" fill="#5b21b6" font-size="25" font-weight="800">SPECIFICITÀ</text><text x="150" y="210" text-anchor="middle" fill="#4c1d95" font-size="18">ID → classi → tipi</text><text x="150" y="244" text-anchor="middle" fill="#4c1d95" font-size="18">solo a pari livello</text><rect x="45" y="296" width="210" height="58" rx="29" fill="#ede9fe"/><text x="150" y="332" text-anchor="middle" fill="#5b21b6" font-size="16" font-weight="800">PIÙ SPECIFICA</text></g>
      <g transform="translate(1620 275)"><rect width="220" height="400" rx="30" fill="#ecfdf5" stroke="#22c55e" stroke-width="4"/><circle cx="110" cy="82" r="43" fill="#16a34a"/><text x="110" y="95" text-anchor="middle" fill="white" font-size="34" font-weight="800">4</text><text x="110" y="160" text-anchor="middle" fill="#14532d" font-size="22" font-weight="800">ORDINE</text><text x="110" y="210" text-anchor="middle" fill="#166534" font-size="17">Se resta parità,</text><text x="110" y="242" text-anchor="middle" fill="#166534" font-size="17">vince l'ultima</text><rect x="30" y="296" width="160" height="58" rx="29" fill="#bbf7d0"/><text x="110" y="332" text-anchor="middle" fill="#14532d" font-size="15" font-weight="800">VALORE FINALE</text></g></g>
    <g fill="none" stroke="#7dd3fc" stroke-width="7" marker-end="url(#cascadeArrow)"><path d="M390 475h60"/><path d="M775 475h60"/><path d="M1160 475h60"/><path d="M1545 475h60"/></g>
    <rect x="240" y="790" width="1440" height="150" rx="30" fill="#f8fafc" opacity=".97"/><text x="960" y="845" text-anchor="middle" fill="#102a43" font-size="24" font-weight="800">SPECIFICITÀ ≠ CASCADE</text><text x="960" y="890" text-anchor="middle" fill="#52677f" font-size="20">La specificità interviene dopo altri criteri: non è il nome dell'intero processo.</text>
  </g>
</svg>
