<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-output="../../04-js-browser-boundary.svg" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript e le API offerte dall'ambiente browser</title>
  <desc id="desc">Il linguaggio ECMAScript fornisce valori, funzioni e strutture di controllo; il browser aggiunge Window, Document, Event, Storage e altre Web API.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="800" y="64" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="800">LO STESSO LINGUAGGIO, API DIVERSE</text>
    <text x="800" y="104" text-anchor="middle" fill="#b8c8dc" font-size="21">JavaScript non è il browser: il browser è uno degli ambienti che lo eseguono</text>

    <g transform="translate(80 170)">
      <rect width="500" height="570" rx="34" fill="#fffbea" stroke="#facc15" stroke-width="6"/>
      <use href="#tpsi-badge-js" x="175" y="38" width="150" height="150"/>
      <text x="250" y="228" text-anchor="middle" fill="#713f12" font-size="31" font-weight="800">ECMAScript</text>
      <text x="250" y="260" text-anchor="middle" fill="#7c5b24" font-size="18">il linguaggio standard</text>
      <g fill="#fffbeb" stroke="#f59e0b" stroke-width="3">
        <rect x="48" y="304" width="188" height="62" rx="18"/><rect x="264" y="304" width="188" height="62" rx="18"/>
        <rect x="48" y="390" width="188" height="62" rx="18"/><rect x="264" y="390" width="188" height="62" rx="18"/>
        <rect x="48" y="476" width="404" height="62" rx="18"/>
      </g>
      <g text-anchor="middle" fill="#78350f" font-size="19" font-weight="700">
        <text x="142" y="342">valori e tipi</text><text x="358" y="342">const e let</text>
        <text x="142" y="428">funzioni</text><text x="358" y="428">array e object</text>
        <text x="250" y="514">if · cicli · moduli · errori</text>
      </g>
    </g>

    <path d="M610 455h185" fill="none" stroke="#f59e0b" stroke-width="8" marker-end="url(#arrow)"/>
    <rect x="635" y="400" width="140" height="42" rx="21" fill="#fde68a"/><text x="705" y="428" text-anchor="middle" fill="#78350f" font-size="16" font-weight="800">ESEGUITO NEL</text>

    <g transform="translate(820 140)">
      <rect width="700" height="640" rx="38" fill="#eff6ff" stroke="#38bdf8" stroke-width="6"/>
      <use href="#tpsi-browser" x="165" y="35" width="370" height="237"/>
      <text x="350" y="316" text-anchor="middle" fill="#0c4a6e" font-size="31" font-weight="800">Browser</text>
      <text x="350" y="348" text-anchor="middle" fill="#52677f" font-size="18">ambiente di esecuzione + Web API</text>
      <g fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3">
        <rect x="42" y="392" width="190" height="68" rx="19"/><rect x="255" y="392" width="190" height="68" rx="19"/><rect x="468" y="392" width="190" height="68" rx="19"/>
        <rect x="42" y="486" width="190" height="68" rx="19"/><rect x="255" y="486" width="190" height="68" rx="19"/><rect x="468" y="486" width="190" height="68" rx="19"/>
      </g>
      <g text-anchor="middle" fill="#075985" font-size="20" font-weight="800">
        <text x="137" y="434">Window</text><text x="350" y="434">Document</text><text x="563" y="434">Event</text>
        <text x="137" y="528">Storage</text><text x="350" y="528">console</text><text x="563" y="528">timer</text>
      </g>
      <text x="350" y="600" text-anchor="middle" fill="#52677f" font-size="18">Più avanti: fetch · WebSocket · altre API</text>
    </g>

    <g transform="translate(235 785)">
      <rect width="1130" height="76" rx="25" fill="#f8fafc" opacity=".98"/>
      <text x="565" y="31" text-anchor="middle" fill="#102a43" font-size="19" font-weight="800">PROVA DEL CONFINE</text>
      <text x="565" y="57" text-anchor="middle" fill="#52677f" font-size="17"><tspan font-family="monospace">[].map()</tspan> appartiene al linguaggio · <tspan font-family="monospace">document.querySelector()</tspan> richiede il DOM del browser</text>
    </g>
  </g>
</svg>
