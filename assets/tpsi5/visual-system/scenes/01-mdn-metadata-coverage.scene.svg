<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../01-mdn-metadata-coverage.svg" role="img" aria-labelledby="title desc">
  <title id="title">Mappa di copertura del tutorial MDN Web page metadata</title>
  <desc id="desc">A sinistra sono elencate le sezioni della dispensa sui metadati, a destra le parti corrispondenti del tutorial MDN. Verde significa coperto, ambra introdotto, grigio più avanti.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="metadataCoverageBackground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="metadataCoverageShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/></filter>
    <marker id="metadataCoveredArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker>
    <marker id="metadataIntroducedArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#metadataCoverageBackground)"/>
  <circle cx="48" cy="70" r="260" fill="#0ea5e9" opacity=".08"/><circle cx="1870" cy="1000" r="330" fill="#16a34a" opacity=".07"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="62" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="800">DISPENSA ↔ MDN · METADATI DELLA PAGINA</text>
    <text x="960" y="104" text-anchor="middle" fill="#b8c8dc" font-size="21">Quali parti di “What’s in the head?” sono comprese nel percorso italiano</text>
    <text x="390" y="166" text-anchor="middle" fill="#7dd3fc" font-size="22" font-weight="800">PARAGRAFI DELLA DISPENSA</text>
    <text x="1530" y="166" text-anchor="middle" fill="#86efac" font-size="22" font-weight="800">PARAGRAFI DEL TUTORIAL MDN</text>

    <g filter="url(#metadataCoverageShadow)">
      <g transform="translate(64 204)"><rect width="650" height="86" rx="22" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="34" fill="#0c4a6e" font-size="21" font-weight="800">Lo scheletro moderno: head e body</text><text x="26" y="62" fill="#52677f" font-size="16">ruolo dei metadati e contenuto non visualizzato</text></g>
      <g transform="translate(64 310)"><rect width="650" height="86" rx="22" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="34" fill="#0c4a6e" font-size="21" font-weight="800">Title e heading della pagina</text><text x="26" y="62" fill="#52677f" font-size="16">differenza tra titolo del documento e h1</text></g>
      <g transform="translate(64 416)"><rect width="650" height="86" rx="22" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="34" fill="#0c4a6e" font-size="21" font-weight="800">Charset, viewport, autore e descrizione</text><text x="26" y="62" fill="#52677f" font-size="16">meta con charset oppure con name e content</text></g>
      <g transform="translate(64 522)"><rect width="650" height="86" rx="22" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="34" fill="#0c4a6e" font-size="21" font-weight="800">Open Graph e icone per dispositivi</text><text x="26" y="62" fill="#52677f" font-size="16">riconoscere le varianti senza memorizzarle</text></g>
      <g transform="translate(64 628)"><rect width="650" height="86" rx="22" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="34" fill="#0c4a6e" font-size="21" font-weight="800">Favicon, CSS e JavaScript</text><text x="26" y="62" fill="#52677f" font-size="16">link rel, href, script src e defer</text></g>
      <g transform="translate(64 734)"><rect width="650" height="86" rx="22" fill="#eff6ff" stroke="#38bdf8" stroke-width="3"/><text x="26" y="34" fill="#0c4a6e" font-size="21" font-weight="800">Lingua principale del documento</text><text x="26" y="62" fill="#52677f" font-size="16">lang sull’elemento html e cambi di lingua locali</text></g>

      <g transform="translate(1206 204)"><rect width="650" height="86" rx="22" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="24" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="49" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="50" fill="#14532d" font-size="19" font-weight="800">What is the HTML head?</text></g>
      <g transform="translate(1206 310)"><rect width="650" height="86" rx="22" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="24" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="49" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="50" fill="#14532d" font-size="19" font-weight="800">Adding a title</text></g>
      <g transform="translate(1206 416)"><rect width="650" height="86" rx="22" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="24" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="49" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="38" fill="#14532d" font-size="18" font-weight="800">Metadata: the meta element</text><text x="166" y="63" fill="#3f5f4b" font-size="15">encoding · author · description</text></g>
      <g transform="translate(1206 522)"><rect width="650" height="86" rx="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><rect x="18" y="24" width="142" height="38" rx="19" fill="#d97706"/><text x="89" y="49" text-anchor="middle" fill="white" font-size="14" font-weight="800">INTRODOTTO</text><text x="180" y="38" fill="#78350f" font-size="18" font-weight="800">Other metadata · icon variants</text><text x="180" y="63" fill="#785e32" font-size="15">lettura orientativa, non studio completo</text></g>
      <g transform="translate(1206 628)"><rect width="650" height="86" rx="22" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="24" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="49" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="38" fill="#14532d" font-size="18" font-weight="800">Adding custom icons</text><text x="166" y="63" fill="#3f5f4b" font-size="15">Applying CSS and JavaScript to HTML</text></g>
      <g transform="translate(1206 734)"><rect width="650" height="86" rx="22" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="18" y="24" width="128" height="38" rx="19" fill="#16a34a"/><text x="82" y="49" text-anchor="middle" fill="white" font-size="14" font-weight="800">COPERTO</text><text x="166" y="38" fill="#14532d" font-size="18" font-weight="800">Setting the primary language</text><text x="166" y="63" fill="#3f5f4b" font-size="15">of the document</text></g>
    </g>

    <g fill="none" stroke-width="6">
      <path d="M714 247h470" stroke="#22c55e" marker-end="url(#metadataCoveredArrow)"/><path d="M714 353h470" stroke="#22c55e" marker-end="url(#metadataCoveredArrow)"/><path d="M714 459h470" stroke="#22c55e" marker-end="url(#metadataCoveredArrow)"/><path d="M714 565h470" stroke="#f59e0b" stroke-dasharray="14 10" marker-end="url(#metadataIntroducedArrow)"/><path d="M714 671h470" stroke="#22c55e" marker-end="url(#metadataCoveredArrow)"/><path d="M714 777h470" stroke="#22c55e" marker-end="url(#metadataCoveredArrow)"/>
    </g>
    <g text-anchor="middle" font-size="14" font-weight="800">
      <g fill="#071426"><rect x="894" y="231" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="252">SPIEGA</text><rect x="894" y="337" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="358">SPIEGA</text><rect x="894" y="443" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="464">SPIEGA</text><rect x="894" y="655" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="676">SPIEGA</text><rect x="894" y="761" width="132" height="32" rx="16" fill="#bbf7d0"/><text x="960" y="782">SPIEGA</text></g>
      <rect x="882" y="549" width="156" height="32" rx="16" fill="#fde68a"/><text x="960" y="570" fill="#78350f">INTRODUCE</text>
    </g>

    <g transform="translate(64 860)">
      <rect width="1792" height="156" rx="28" fill="#f8fafc" opacity=".98"/>
      <text x="28" y="38" fill="#102a43" font-size="19" font-weight="800">LEGENDA DELLA COPERTURA</text>
      <g transform="translate(28 58)"><rect width="520" height="66" rx="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/><rect x="16" y="14" width="116" height="38" rx="19" fill="#16a34a"/><text x="74" y="39" text-anchor="middle" fill="white" font-size="13" font-weight="800">COPERTO</text><text x="150" y="31" fill="#14532d" font-size="16" font-weight="800">spiegato in italiano</text><text x="150" y="51" fill="#3f5f4b" font-size="14">da comprendere e usare ora</text></g>
      <g transform="translate(636 58)"><rect width="520" height="66" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><rect x="16" y="14" width="132" height="38" rx="19" fill="#d97706"/><text x="82" y="39" text-anchor="middle" fill="white" font-size="13" font-weight="800">INTRODOTTO</text><text x="166" y="31" fill="#78350f" font-size="16" font-weight="800">presentato in parte</text><text x="166" y="51" fill="#785e32" font-size="14">basta riconoscerlo o provarlo</text></g>
      <g transform="translate(1244 58)"><rect width="520" height="66" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><rect x="16" y="14" width="126" height="38" rx="19" fill="#64748b"/><text x="79" y="39" text-anchor="middle" fill="white" font-size="13" font-weight="800">PIÙ AVANTI</text><text x="160" y="31" fill="#334155" font-size="16" font-weight="800">fuori dallo studio attuale</text><text x="160" y="51" fill="#64748b" font-size="14">sarà ripreso in una lezione futura</text></g>
    </g>
  </g>
</svg>
