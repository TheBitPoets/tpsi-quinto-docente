<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../03-bootstrap-component-layers.svg" role="img" aria-labelledby="title desc"><title id="title">Tre strati di un componente Bootstrap</title><desc id="desc">Un componente conserva la semantica HTML, applica struttura e varianti Bootstrap e può aggiungere un comportamento JavaScript opzionale.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bclBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="bclSh"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity=".32"/></filter></defs><rect width="1920" height="1080" fill="url(#bclBg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="80" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">ANATOMIA DI UN COMPONENTE</text><text x="960" y="124" text-anchor="middle" fill="#b8c8dc" font-size="22">Bootstrap aggiunge convenzioni; il significato HTML rimane una scelta dell’autore</text><g filter="url(#bclSh)"><rect x="170" y="710" width="1580" height="210" rx="38" fill="#ffedd5" stroke="#fb923c" stroke-width="5"/><rect x="290" y="455" width="1340" height="235" rx="38" fill="#dbeafe" stroke="#3b82f6" stroke-width="5"/><rect x="410" y="200" width="1100" height="235" rx="38" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/></g><text x="960" y="266" text-anchor="middle" fill="#5b21b6" font-size="29" font-weight="800">3 · COMPORTAMENTO JAVASCRIPT · SE SERVE</text><text x="960" y="315" text-anchor="middle" fill="#52677f" font-size="21">Collapse cambia stato · il bundle ascolta l’azione · il target deve esistere</text><text x="960" y="360" text-anchor="middle" fill="#7c3aed" font-size="21" font-weight="800">card: nessun JS · navbar collassabile: JS richiesto</text><text x="960" y="522" text-anchor="middle" fill="#1d4ed8" font-size="29" font-weight="800">2 · STRUTTURA E VARIANTI BOOTSTRAP</text><text x="960" y="571" text-anchor="middle" fill="#52677f" font-size="21">card + card-body + card-title · btn + btn-primary</text><text x="960" y="616" text-anchor="middle" fill="#2563eb" font-size="21" font-weight="800">nomi, parti interne e stati documentati</text><text x="960" y="778" text-anchor="middle" fill="#9a3412" font-size="29" font-weight="800">1 · SEMANTICA HTML · SEMPRE</text><text x="960" y="827" text-anchor="middle" fill="#52677f" font-size="21">article per un post · nav per una navigazione · button per un’azione</text><text x="960" y="872" text-anchor="middle" fill="#c2410c" font-size="21" font-weight="800">il framework non può decidere il significato del contenuto</text><rect x="380" y="965" width="1160" height="70" rx="35" fill="#ecfdf5"/><text x="960" y="1009" text-anchor="middle" fill="#14532d" font-size="21" font-weight="800">PARTI DAL SIGNIFICATO, POI APPLICA IL PATTERN DOCUMENTATO</text></g></svg>
