<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../mdn-guide-ecosystem.svg" role="img" aria-labelledby="title desc">
  <title id="title">La mappa dell'ecosistema MDN</title>
  <desc id="desc">Una domanda di sviluppo conduce a Learn, Guide, Reference o Glossary; le reference rimandano alle specifiche normative.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="ecoBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="ecoShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".32"/></filter>
    <marker id="ecoArrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0 0l22 11L0 22z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#ecoBg)"/>
  <circle cx="110" cy="90" r="300" fill="#0ea5e9" opacity=".08"/><circle cx="1810" cy="1000" r="390" fill="#8b5cf6" opacity=".07"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="76" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">COME È ORGANIZZATA MDN</text>
    <text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">Prima riconosci la domanda, poi scegli il tipo di pagina adatto</text>

    <g transform="translate(70 310)" filter="url(#ecoShadow)">
      <rect width="300" height="390" rx="30" fill="#f8fafc"/>
      <path d="M30 0h240a30 30 0 0 1 30 30v82H0V30A30 30 0 0 1 30 0z" fill="#2563eb"/>
      <text x="150" y="51" text-anchor="middle" fill="white" font-size="21" font-weight="800">DOMANDA</text>
      <text x="150" y="82" text-anchor="middle" fill="#dbeafe" font-size="17">Che cosa devo trovare?</text>
      <use href="#tpsi-user" x="74" y="138" width="152" height="164"/>
      <text x="150" y="336" text-anchor="middle" fill="#102a43" font-size="18" font-weight="800">IMPARARE · CAPIRE</text>
      <text x="150" y="366" text-anchor="middle" fill="#52677f" font-size="17">CONTROLLARE · DEFINIRE</text>
    </g>

    <g filter="url(#ecoShadow)">
      <g transform="translate(485 190)">
        <rect width="330" height="250" rx="28" fill="#f8fafc"/>
        <rect width="330" height="72" rx="28" fill="#0ea5e9"/><rect y="45" width="330" height="27" fill="#0ea5e9"/>
        <text x="165" y="47" text-anchor="middle" fill="white" font-size="27" font-weight="800">LEARN</text>
        <text x="165" y="116" text-anchor="middle" fill="#075985" font-size="19" font-weight="800">Percorso didattico</text>
        <text x="165" y="153" text-anchor="middle" fill="#52677f" font-size="17">prerequisiti · obiettivi</text>
        <text x="165" y="184" text-anchor="middle" fill="#52677f" font-size="17">spiegazione · esercizi</text>
        <text x="165" y="222" text-anchor="middle" fill="#075985" font-size="16" font-weight="800">USA PER IMPARARE</text>
      </g>
      <g transform="translate(865 190)">
        <rect width="330" height="250" rx="28" fill="#f8fafc"/>
        <rect width="330" height="72" rx="28" fill="#0d9488"/><rect y="45" width="330" height="27" fill="#0d9488"/>
        <text x="165" y="47" text-anchor="middle" fill="white" font-size="27" font-weight="800">GUIDE</text>
        <text x="165" y="116" text-anchor="middle" fill="#0f766e" font-size="19" font-weight="800">Obiettivo pratico</text>
        <text x="165" y="153" text-anchor="middle" fill="#52677f" font-size="17">come usare una tecnologia</text>
        <text x="165" y="184" text-anchor="middle" fill="#52677f" font-size="17">decisioni ed esempi</text>
        <text x="165" y="222" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="800">USA PER CAPIRE COME</text>
      </g>
      <g transform="translate(485 520)">
        <rect width="330" height="250" rx="28" fill="#f8fafc"/>
        <rect width="330" height="72" rx="28" fill="#4f46e5"/><rect y="45" width="330" height="27" fill="#4f46e5"/>
        <text x="165" y="47" text-anchor="middle" fill="white" font-size="27" font-weight="800">REFERENCE</text>
        <text x="165" y="116" text-anchor="middle" fill="#3730a3" font-size="19" font-weight="800">Contratto preciso</text>
        <text x="165" y="153" text-anchor="middle" fill="#52677f" font-size="17">sintassi · valori · output</text>
        <text x="165" y="184" text-anchor="middle" fill="#52677f" font-size="17">errori · compatibilità</text>
        <text x="165" y="222" text-anchor="middle" fill="#3730a3" font-size="16" font-weight="800">USA PER CONTROLLARE</text>
      </g>
      <g transform="translate(865 520)">
        <rect width="330" height="250" rx="28" fill="#f8fafc"/>
        <rect width="330" height="72" rx="28" fill="#64748b"/><rect y="45" width="330" height="27" fill="#64748b"/>
        <text x="165" y="47" text-anchor="middle" fill="white" font-size="27" font-weight="800">GLOSSARY</text>
        <text x="165" y="116" text-anchor="middle" fill="#334155" font-size="19" font-weight="800">Termine e contesto</text>
        <text x="165" y="153" text-anchor="middle" fill="#52677f" font-size="17">definizione breve</text>
        <text x="165" y="184" text-anchor="middle" fill="#52677f" font-size="17">rimandi correlati</text>
        <text x="165" y="222" text-anchor="middle" fill="#334155" font-size="16" font-weight="800">USA PER DEFINIRE</text>
      </g>
    </g>

    <g transform="translate(1350 310)" filter="url(#ecoShadow)">
      <rect width="500" height="390" rx="30" fill="#f8fafc"/>
      <path d="M30 0h440a30 30 0 0 1 30 30v82H0V30A30 30 0 0 1 30 0z" fill="#d97706"/>
      <text x="250" y="51" text-anchor="middle" fill="white" font-size="24" font-weight="800">SPECIFICHE E STANDARD</text>
      <text x="250" y="82" text-anchor="middle" fill="#fff7d6" font-size="17">La fonte normativa</text>
      <use href="#tpsi-document" x="174" y="132" width="152" height="184"/>
      <text x="250" y="340" text-anchor="middle" fill="#92400e" font-size="18" font-weight="800">WHATWG · TC39 · RFC · W3C</text>
      <text x="250" y="370" text-anchor="middle" fill="#52677f" font-size="16">MDN spiega e collega la specifica</text>
    </g>

    <g fill="none" stroke="#38bdf8" stroke-width="8" marker-end="url(#ecoArrow)">
      <path d="M370 505h84"/>
      <path d="M1210 505h110"/>
    </g>
    <text x="412" y="475" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="800">SCEGLI</text>
    <text x="1265" y="475" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="800">APPROFONDISCI</text>

    <rect x="350" y="900" width="1220" height="76" rx="38" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="947" text-anchor="middle" fill="#e2e8f0" font-size="21">Non leggere tutto: scegli la pagina che risponde alla domanda e la profondità richiesta dalla lezione.</text>
  </g>
</svg>
