<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../mdn-guide-status.svg" role="img" aria-labelledby="title desc">
  <title id="title">Come leggere stato e compatibilità su MDN</title>
  <desc id="desc">Widely available, newly available, limited availability e deprecated richiedono decisioni diverse; la compatibilità non sostituisce test di accessibilità, sicurezza e usabilità.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="statusBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="statusShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".32"/></filter></defs>
  <rect width="1920" height="1080" fill="url(#statusBg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="76" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">STATO E COMPATIBILITÀ NON SONO UN SEMAFORO SEMPLICE</text>
    <text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">Il badge orienta; il contesto del progetto decide</text>
    <g filter="url(#statusShadow)">
      <g transform="translate(70 220)"><rect width="400" height="430" rx="30" fill="#f8fafc"/><rect width="400" height="96" rx="30" fill="#16a34a"/><rect y="68" width="400" height="28" fill="#16a34a"/><text x="200" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">✓ WIDELY AVAILABLE</text><text x="200" y="152" text-anchor="middle" fill="#166534" font-size="19" font-weight="800">Supporto ampio e consolidato</text><text x="44" y="208" fill="#334155" font-size="17">• leggi comunque le note</text><text x="44" y="250" fill="#334155" font-size="17">• controlla parti con supporto diverso</text><text x="44" y="292" fill="#334155" font-size="17">• prova il caso reale del corso</text><rect x="36" y="342" width="328" height="56" rx="18" fill="#dcfce7"/><text x="200" y="378" text-anchor="middle" fill="#166534" font-size="16" font-weight="800">USO ORDINARIO, CON TEST</text></g>
      <g transform="translate(530 220)"><rect width="400" height="430" rx="30" fill="#f8fafc"/><rect width="400" height="96" rx="30" fill="#2563eb"/><rect y="68" width="400" height="28" fill="#2563eb"/><text x="200" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">✓ NEWLY AVAILABLE</text><text x="200" y="152" text-anchor="middle" fill="#1e3a8a" font-size="19" font-weight="800">Disponibile nei browser recenti</text><text x="44" y="208" fill="#334155" font-size="17">• considera dispositivi meno recenti</text><text x="44" y="250" fill="#334155" font-size="17">• valuta fallback</text><text x="44" y="292" fill="#334155" font-size="17">• controlla la data Baseline</text><rect x="36" y="342" width="328" height="56" rx="18" fill="#dbeafe"/><text x="200" y="378" text-anchor="middle" fill="#1e3a8a" font-size="16" font-weight="800">VALUTA IL TARGET</text></g>
      <g transform="translate(990 220)"><rect width="400" height="430" rx="30" fill="#f8fafc"/><rect width="400" height="96" rx="30" fill="#64748b"/><rect y="68" width="400" height="28" fill="#64748b"/><text x="200" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">◇ LIMITED</text><text x="200" y="152" text-anchor="middle" fill="#334155" font-size="19" font-weight="800">Non disponibile ovunque</text><text x="44" y="208" fill="#334155" font-size="17">• apri la tabella completa</text><text x="44" y="250" fill="#334155" font-size="17">• identifica browser e versioni</text><text x="44" y="292" fill="#334155" font-size="17">• cerca alternativa o fallback</text><rect x="36" y="342" width="328" height="56" rx="18" fill="#e2e8f0"/><text x="200" y="378" text-anchor="middle" fill="#334155" font-size="16" font-weight="800">NON ASSUMERE SUPPORTO</text></g>
      <g transform="translate(1450 220)"><rect width="400" height="430" rx="30" fill="#f8fafc"/><rect width="400" height="96" rx="30" fill="#e11d48"/><rect y="68" width="400" height="28" fill="#e11d48"/><text x="200" y="61" text-anchor="middle" fill="white" font-size="25" font-weight="800">✕ DEPRECATED</text><text x="200" y="152" text-anchor="middle" fill="#9f1239" font-size="19" font-weight="800">Funzionalità sconsigliata</text><text x="44" y="208" fill="#334155" font-size="17">• non usarla nel nuovo codice</text><text x="44" y="250" fill="#334155" font-size="17">• cerca l'alternativa moderna</text><text x="44" y="292" fill="#334155" font-size="17">• riconoscila nel codice legacy</text><rect x="36" y="342" width="328" height="56" rx="18" fill="#ffe4e6"/><text x="200" y="378" text-anchor="middle" fill="#9f1239" font-size="16" font-weight="800">EVITA E MIGRA</text></g>
    </g>
    <g transform="translate(240 760)">
      <rect width="1440" height="176" rx="34" fill="#fff7ed" stroke="#f59e0b" stroke-width="5"/>
      <text x="720" y="52" text-anchor="middle" fill="#92400e" font-size="23" font-weight="800">BASELINE RISPONDE: “I BROWSER LA IMPLEMENTANO?”</text>
      <text x="720" y="96" text-anchor="middle" fill="#7c2d12" font-size="20">Non risponde da sola a: “È accessibile, sicura, usabile e adatta al nostro progetto?”</text>
      <text x="720" y="137" text-anchor="middle" fill="#52677f" font-size="17">Compatibilità + requisiti + test reali = decisione professionale</text>
    </g>
  </g>
</svg>
