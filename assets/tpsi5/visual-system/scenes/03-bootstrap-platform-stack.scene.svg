<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../03-bootstrap-platform-stack.svg" role="img" aria-labelledby="title desc"><title id="title">Bootstrap sopra la Web Platform</title><desc id="desc">Il markup dello sviluppatore usa l'API di classi Bootstrap, che applica HTML, CSS e JavaScript eseguiti dal browser.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bpsBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="bpsShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".3"/></filter><marker id="bpsArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker></defs><rect width="1920" height="1080" fill="url(#bpsBg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="80" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">BOOTSTRAP NON È UN NUOVO BROWSER</text><text x="960" y="125" text-anchor="middle" fill="#b8c8dc" font-size="22">È un’astrazione costruita sopra le tecnologie native</text>
<g filter="url(#bpsShadow)"><rect x="170" y="230" width="440" height="560" rx="36" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><rect x="740" y="230" width="440" height="560" rx="36" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><rect x="1310" y="230" width="440" height="560" rx="36" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/></g><text x="390" y="305" text-anchor="middle" fill="#075985" font-size="29" font-weight="800">CODICE DELL’AUTORE</text><rect x="225" y="370" width="330" height="170" rx="22" fill="#0f2942"/><text x="390" y="420" text-anchor="middle" fill="#7dd3fc" font-size="21">class="d-flex gap-3"</text><text x="390" y="464" text-anchor="middle" fill="#f8fafc" font-size="21">class="card"</text><text x="390" y="508" text-anchor="middle" fill="#c4b5fd" font-size="21">data-bs-toggle</text><text x="390" y="620" text-anchor="middle" fill="#52677f" font-size="20">Descrive l’intento</text><text x="390" y="654" text-anchor="middle" fill="#52677f" font-size="20">con nomi documentati</text>
<text x="960" y="305" text-anchor="middle" fill="#5b21b6" font-size="29" font-weight="800">API BOOTSTRAP</text><rect x="800" y="362" width="320" height="76" rx="20" fill="#ddd6fe"/><text x="960" y="409" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="800">utility</text><rect x="800" y="462" width="320" height="76" rx="20" fill="#ddd6fe"/><text x="960" y="509" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="800">componenti</text><rect x="800" y="562" width="320" height="76" rx="20" fill="#ddd6fe"/><text x="960" y="609" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="800">plugin JavaScript</text><text x="960" y="700" text-anchor="middle" fill="#52677f" font-size="20">Traduce convenzioni</text><text x="960" y="734" text-anchor="middle" fill="#52677f" font-size="20">in implementazioni</text>
<text x="1530" y="305" text-anchor="middle" fill="#166534" font-size="29" font-weight="800">WEB PLATFORM</text><g font-size="24" font-weight="800" text-anchor="middle"><rect x="1370" y="360" width="320" height="82" rx="22" fill="#ffedd5"/><text x="1530" y="411" fill="#9a3412">HTML · struttura</text><rect x="1370" y="470" width="320" height="82" rx="22" fill="#dbeafe"/><text x="1530" y="521" fill="#1d4ed8">CSS · presentazione</text><rect x="1370" y="580" width="320" height="82" rx="22" fill="#fef9c3"/><text x="1530" y="631" fill="#854d0e">JS · comportamento</text></g><text x="1530" y="718" text-anchor="middle" fill="#52677f" font-size="20">Il browser esegue</text><text x="1530" y="752" text-anchor="middle" fill="#52677f" font-size="20">sempre tecnologie native</text>
