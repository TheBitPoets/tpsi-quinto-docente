<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../01-web-platform-roles.svg" role="img" aria-labelledby="title desc">
  <title id="title">I ruoli di HTML CSS e JavaScript nella Web Platform</title>
  <desc id="desc">Dentro il browser HTML descrive struttura e significato, CSS presentazione e layout, JavaScript comportamento e interazione. Le API del browser offrono funzionalità al codice.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="platformBackground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="platformShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#platformBackground)"/>
  <circle cx="80" cy="80" r="280" fill="#2563eb" opacity=".08"/><circle cx="1840" cy="1030" r="380" fill="#8b5cf6" opacity=".07"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">LA WEB PLATFORM NEL BROWSER</text>
    <text x="960" y="116" text-anchor="middle" fill="#b8c8dc" font-size="22">Tecnologie con ruoli diversi collaborano per costruire l'esperienza web</text>

    <g filter="url(#platformShadow)">
      <rect x="90" y="180" width="1740" height="760" rx="38" fill="#f8fafc"/>
      <path d="M128 180h1664a38 38 0 0 1 38 38v86H90v-86a38 38 0 0 1 38-38z" fill="#2563eb"/>
      <circle cx="145" cy="242" r="13" fill="#fca5a5"/><circle cx="184" cy="242" r="13" fill="#fde68a"/><circle cx="223" cy="242" r="13" fill="#86efac"/>
      <text x="960" y="253" text-anchor="middle" fill="white" font-size="32" font-weight="800">BROWSER · AMBIENTE DI ESECUZIONE DEL FRONTEND</text>

      <g transform="translate(145 360)">
        <rect width="440" height="420" rx="28" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
        <use href="#tpsi-badge-html" x="150" y="35" width="140" height="140"/>
        <text x="220" y="225" text-anchor="middle" fill="#9a3412" font-size="30" font-weight="800">HTML</text>
        <text x="220" y="275" text-anchor="middle" fill="#52677f" font-size="20">struttura</text>
        <text x="220" y="311" text-anchor="middle" fill="#52677f" font-size="20">significato</text>
        <text x="220" y="365" text-anchor="middle" fill="#7c2d12" font-size="17" font-weight="800">CHE COSA È IL CONTENUTO?</text>
      </g>

      <g transform="translate(740 360)">
        <rect width="440" height="420" rx="28" fill="#eff6ff" stroke="#38bdf8" stroke-width="4"/>
        <use href="#tpsi-badge-css" x="150" y="35" width="140" height="140"/>
        <text x="220" y="225" text-anchor="middle" fill="#075985" font-size="30" font-weight="800">CSS</text>
        <text x="220" y="275" text-anchor="middle" fill="#52677f" font-size="20">presentazione</text>
        <text x="220" y="311" text-anchor="middle" fill="#52677f" font-size="20">layout</text>
        <text x="220" y="365" text-anchor="middle" fill="#0c4a6e" font-size="17" font-weight="800">COME APPARE?</text>
      </g>

      <g transform="translate(1335 360)">
        <rect width="440" height="420" rx="28" fill="#fefce8" stroke="#facc15" stroke-width="4"/>
        <use href="#tpsi-badge-js" x="150" y="35" width="140" height="140"/>
        <text x="220" y="225" text-anchor="middle" fill="#713f12" font-size="30" font-weight="800">JAVASCRIPT</text>
        <text x="220" y="275" text-anchor="middle" fill="#52677f" font-size="20">comportamento</text>
        <text x="220" y="311" text-anchor="middle" fill="#52677f" font-size="20">interazione</text>
        <text x="220" y="365" text-anchor="middle" fill="#713f12" font-size="17" font-weight="800">COME REAGISCE?</text>
      </g>

      <rect x="450" y="830" width="1020" height="70" rx="35" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
      <text x="960" y="874" text-anchor="middle" fill="#5b21b6" font-size="20" font-weight="800">API DEL BROWSER · DOM · EVENTI · RETE · STORAGE · MULTIMEDIA</text>
    </g>
    <text x="960" y="1005" text-anchor="middle" fill="#dbeafe" font-size="21">In questa lezione ci concentriamo su HTML: la struttura semantica dalla quale parte il frontend.</text>
  </g>
</svg>
