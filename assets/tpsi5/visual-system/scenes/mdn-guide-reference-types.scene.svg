<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../mdn-guide-reference-types.svg" role="img" aria-labelledby="title desc">
  <title id="title">Quattro contratti da estrarre dalle reference MDN</title>
  <desc id="desc">Le reference HTML, CSS, JavaScript e Web API, HTTP richiedono domande di lettura diverse.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="typesBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="typesShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#typesBg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="76" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">QUATTRO TIPI DI REFERENCE, QUATTRO LETTURE</text>
    <text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">Da ogni pagina estrai un contratto verificabile, non un riassunto infinito</text>

    <g filter="url(#typesShadow)">
      <g transform="translate(70 200)">
        <rect width="410" height="670" rx="30" fill="#f8fafc"/>
        <path d="M30 0h350a30 30 0 0 1 30 30v102H0V30A30 30 0 0 1 30 0z" fill="#e44d26"/>
        <use href="#tpsi-badge-html" x="28" y="18" width="94" height="94"/>
        <text x="270" y="62" text-anchor="middle" fill="white" font-size="28" font-weight="800">HTML</text>
        <text x="270" y="98" text-anchor="middle" fill="#fff7ed" font-size="17">elemento o attributo</text>
        <text x="46" y="184" fill="#9a3412" font-size="19" font-weight="800">ESTRAI</text>
        <g fill="#334155" font-size="17"><text x="48" y="232">• significato semantico</text><text x="48" y="274">• sintassi minima</text><text x="48" y="316">• attributi richiesti</text><text x="48" y="358">• contenuto ammesso</text><text x="48" y="400">• genitori ammessi</text><text x="48" y="442">• accessibilità</text><text x="48" y="484">• sicurezza / privacy</text></g>
        <rect x="40" y="548" width="330" height="76" rx="18" fill="#ffedd5"/>
        <text x="205" y="579" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="800">DOMANDA CHIAVE</text>
        <text x="205" y="607" text-anchor="middle" fill="#7c2d12" font-size="16">Che significato comunica?</text>
      </g>
      <g transform="translate(525 200)">
        <rect width="410" height="670" rx="30" fill="#f8fafc"/>
        <path d="M30 0h350a30 30 0 0 1 30 30v102H0V30A30 30 0 0 1 30 0z" fill="#1572b6"/>
        <use href="#tpsi-badge-css" x="28" y="18" width="94" height="94"/>
        <text x="270" y="62" text-anchor="middle" fill="white" font-size="28" font-weight="800">CSS</text>
        <text x="270" y="98" text-anchor="middle" fill="#e0f2fe" font-size="17">proprietà o modulo</text>
        <text x="46" y="184" fill="#075985" font-size="19" font-weight="800">ESTRAI</text>
        <g fill="#334155" font-size="17"><text x="48" y="232">• sintassi e valori</text><text x="48" y="274">• valore iniziale</text><text x="48" y="316">• ereditarietà</text><text x="48" y="358">• elementi interessati</text><text x="48" y="400">• valore calcolato</text><text x="48" y="442">• tipo di animazione</text><text x="48" y="484">• accessibilità</text></g>
        <rect x="40" y="548" width="330" height="76" rx="18" fill="#e0f2fe"/>
        <text x="205" y="579" text-anchor="middle" fill="#075985" font-size="16" font-weight="800">DOMANDA CHIAVE</text>
        <text x="205" y="607" text-anchor="middle" fill="#0c4a6e" font-size="16">Quale valore viene calcolato?</text>
      </g>
      <g transform="translate(980 200)">
        <rect width="410" height="670" rx="30" fill="#f8fafc"/>
        <path d="M30 0h350a30 30 0 0 1 30 30v102H0V30A30 30 0 0 1 30 0z" fill="#d9b900"/>
        <use href="#tpsi-badge-js" x="28" y="18" width="94" height="94"/>
        <text x="270" y="62" text-anchor="middle" fill="#111827" font-size="27" font-weight="800">JS / WEB API</text>
        <text x="270" y="98" text-anchor="middle" fill="#422006" font-size="17">metodo, oggetto, evento</text>
        <text x="46" y="184" fill="#854d0e" font-size="19" font-weight="800">ESTRAI</text>
        <g fill="#334155" font-size="17"><text x="48" y="232">• oggetto che espone l'API</text><text x="48" y="274">• sintassi</text><text x="48" y="316">• parametri</text><text x="48" y="358">• valore restituito</text><text x="48" y="400">• mutazioni / side effect</text><text x="48" y="442">• eccezioni</text><text x="48" y="484">• sync oppure async</text></g>
        <rect x="40" y="548" width="330" height="76" rx="18" fill="#fef9c3"/>
        <text x="205" y="579" text-anchor="middle" fill="#854d0e" font-size="16" font-weight="800">DOMANDA CHIAVE</text>
        <text x="205" y="607" text-anchor="middle" fill="#713f12" font-size="16">Qual è il contratto della chiamata?</text>
      </g>
      <g transform="translate(1435 200)">
        <rect width="410" height="670" rx="30" fill="#f8fafc"/>
        <path d="M30 0h350a30 30 0 0 1 30 30v102H0V30A30 30 0 0 1 30 0z" fill="#0d9488"/>
        <use href="#tpsi-api" x="30" y="18" width="100" height="94"/>
        <text x="270" y="62" text-anchor="middle" fill="white" font-size="28" font-weight="800">HTTP</text>
        <text x="270" y="98" text-anchor="middle" fill="#ccfbf1" font-size="17">metodo, status, header</text>
        <text x="46" y="184" fill="#0f766e" font-size="19" font-weight="800">ESTRAI</text>
        <g fill="#334155" font-size="17"><text x="48" y="232">• ruolo nella richiesta/risposta</text><text x="48" y="274">• sintassi</text><text x="48" y="316">• direttive o semantica</text><text x="48" y="358">• esempi sul filo</text><text x="48" y="400">• vincoli del browser</text><text x="48" y="442">• sicurezza / privacy</text><text x="48" y="484">• specifica RFC</text></g>
        <rect x="40" y="548" width="330" height="76" rx="18" fill="#ccfbf1"/>
        <text x="205" y="579" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="800">DOMANDA CHIAVE</text>
        <text x="205" y="607" text-anchor="middle" fill="#134e4a" font-size="16">Che cosa viaggia sul protocollo?</text>
      </g>
    </g>
    <rect x="360" y="930" width="1200" height="68" rx="34" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="973" text-anchor="middle" fill="#e2e8f0" font-size="21">Per tutti: esempi, stato, specifiche e compatibilità completano il contratto.</text>
  </g>
</svg>
