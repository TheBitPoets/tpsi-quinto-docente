<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-responsive-feisbuc.svg" role="img" aria-labelledby="title desc"><title id="title">Evoluzione responsive della shell Feisbuc</title><desc id="desc">La stessa interfaccia Feisbuc è disposta in una colonna su viewport stretto, due regioni su viewport intermedio e tre colonne su viewport ampio.</desc><defs id="visual-kit-components"/><defs><linearGradient id="respBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="respShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".34"/></filter></defs><rect width="1920" height="1080" fill="url(#respBg)"/>
