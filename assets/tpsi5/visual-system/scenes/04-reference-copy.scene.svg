<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-output="../../04-reference-copy.svg" role="img" aria-labelledby="title desc">
  <title id="title">Alias e copia superficiale di un oggetto JavaScript</title>
  <desc id="desc">Due variabili possono riferirsi allo stesso oggetto; object spread crea invece un nuovo oggetto, ma la copia delle proprietà annidate resta superficiale.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#f59e0b"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="800" y="70" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="800">IL NOME NON È L'OGGETTO</text>
    <text x="800" y="112" text-anchor="middle" fill="#b8c8dc" font-size="21">Un binding conserva un riferimento; spread crea un contenitore nuovo</text>
    <g transform="translate(70 185)"><rect width="680" height="555" rx="36" fill="#fff7ed" stroke="#f59e0b" stroke-width="5"/><text x="340" y="54" text-anchor="middle" fill="#78350f" font-size="26" font-weight="800">ALIAS · STESSO OGGETTO</text><rect x="55" y="120" width="200" height="74" rx="20" fill="#fde68a"/><text x="155" y="165" text-anchor="middle" fill="#78350f" font-size="20" font-family="monospace">original</text><rect x="55" y="270" width="200" height="74" rx="20" fill="#fde68a"/><text x="155" y="315" text-anchor="middle" fill="#78350f" font-size="20" font-family="monospace">alias</text><path d="M255 157C350 157 330 245 430 245" fill="none" stroke="#f59e0b" stroke-width="7" marker-end="url(#a)"/><path d="M255 307C350 307 330 265 430 265" fill="none" stroke="#f59e0b" stroke-width="7" marker-end="url(#a)"/><rect x="445" y="180" width="180" height="170" rx="28" fill="#fff" stroke="#fb923c" stroke-width="5"/><text x="535" y="228" text-anchor="middle" fill="#9a3412" font-size="21" font-weight="800">OBJECT</text><text x="535" y="273" text-anchor="middle" fill="#7c2d12" font-size="18" font-family="monospace">likes: 0</text><text x="535" y="310" text-anchor="middle" fill="#7c2d12" font-size="18" font-family="monospace">liked: false</text><text x="340" y="430" text-anchor="middle" fill="#78350f" font-size="18" font-family="monospace">alias.likes += 1</text><text x="340" y="470" text-anchor="middle" fill="#7c5b24" font-size="18">cambia anche ciò che legge original</text><rect x="160" y="500" width="360" height="38" rx="19" fill="#fed7aa"/><text x="340" y="526" text-anchor="middle" fill="#9a3412" font-size="15" font-weight="800">original === alias → true</text></g>
    <g transform="translate(850 185)"><rect width="680" height="555" rx="36" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/><text x="340" y="54" text-anchor="middle" fill="#166534" font-size="26" font-weight="800">SPREAD · NUOVO OGGETTO</text><rect x="55" y="120" width="200" height="74" rx="20" fill="#bbf7d0"/><text x="155" y="165" text-anchor="middle" fill="#166534" font-size="20" font-family="monospace">original</text><rect x="430" y="90" width="190" height="150" rx="28" fill="#fff" stroke="#22c55e" stroke-width="5"/><text x="525" y="138" text-anchor="middle" fill="#166534" font-size="19" font-weight="800">OBJECT A</text><text x="525" y="184" text-anchor="middle" fill="#14532d" font-size="18" font-family="monospace">likes: 0</text><path d="M255 157h155" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#g)"/><rect x="55" y="330" width="200" height="74" rx="20" fill="#bbf7d0"/><text x="155" y="375" text-anchor="middle" fill="#166534" font-size="20" font-family="monospace">copy</text><rect x="430" y="300" width="190" height="150" rx="28" fill="#fff" stroke="#22c55e" stroke-width="5"/><text x="525" y="348" text-anchor="middle" fill="#166534" font-size="19" font-weight="800">OBJECT B</text><text x="525" y="394" text-anchor="middle" fill="#14532d" font-size="18" font-family="monospace">likes: 1</text><path d="M255 367h155" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#g)"/><text x="340" y="495" text-anchor="middle" fill="#166534" font-size="18" font-family="monospace">copy = { ...original, likes: 1 }</text><rect x="160" y="510" width="360" height="38" rx="19" fill="#bbf7d0"/><text x="340" y="536" text-anchor="middle" fill="#14532d" font-size="15" font-weight="800">original === copy → false · copia superficiale</text></g>
    <text x="800" y="820" text-anchor="middle" fill="#b8c8dc" font-size="18">Due object con le stesse proprietà possono essere distinti; === confronta il riferimento.</text>
  </g>
</svg>
