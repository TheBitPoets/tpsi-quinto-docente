<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-box-model-anatomy.svg" role="img" aria-labelledby="title desc"><title id="title">Anatomia del box model CSS</title><desc id="desc">Quattro aree concentriche distinguono margin, border, padding e content, con il ruolo di ciascuna.</desc><defs id="visual-kit-components"/><defs><linearGradient id="boxBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="boxShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".32"/></filter></defs><rect width="1920" height="1080" fill="url(#boxBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="78" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">BOX MODEL: QUATTRO AREE, QUATTRO RUOLI</text><text x="960" y="122" text-anchor="middle" fill="#b8c8dc" font-size="22">Dall'esterno verso il contenuto dell'elemento</text>
    <g filter="url(#boxShadow)"><rect x="210" y="205" width="1020" height="700" rx="36" fill="#fde68a"/><rect x="295" y="290" width="850" height="530" rx="28" fill="#fb923c"/><rect x="375" y="370" width="690" height="370" rx="22" fill="#bfdbfe"/><rect x="465" y="460" width="510" height="190" rx="18" fill="#d1fae5"/></g>
    <text x="255" y="255" fill="#78350f" font-size="24" font-weight="800">MARGIN</text><text x="338" y="340" fill="#7c2d12" font-size="24" font-weight="800">BORDER</text><text x="418" y="420" fill="#1e3a8a" font-size="24" font-weight="800">PADDING</text><text x="720" y="555" text-anchor="middle" fill="#065f46" font-size="31" font-weight="800">CONTENT</text><text x="720" y="594" text-anchor="middle" fill="#166534" font-size="19">testo, immagini, figli</text>
    <g transform="translate(1330 225)"><rect width="470" height="155" rx="26" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/><circle cx="48" cy="50" r="18" fill="#f59e0b"/><text x="82" y="58" fill="#78350f" font-size="23" font-weight="800">MARGIN</text><text x="36" y="100" fill="#713f12" font-size="18">Spazio esterno; separa questo box</text><text x="36" y="128" fill="#713f12" font-size="18">dagli altri e può collassare in verticale.</text></g>
    <g transform="translate(1330 405)"><rect width="470" height="135" rx="26" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/><circle cx="48" cy="50" r="18" fill="#fb923c"/><text x="82" y="58" fill="#9a3412" font-size="23" font-weight="800">BORDER</text><text x="36" y="101" fill="#7c2d12" font-size="18">Contorno visibile fra padding e margin.</text></g>
    <g transform="translate(1330 565)"><rect width="470" height="135" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><circle cx="48" cy="50" r="18" fill="#3b82f6"/><text x="82" y="58" fill="#1e3a8a" font-size="23" font-weight="800">PADDING</text><text x="36" y="101" fill="#1e3a8a" font-size="18">Spazio interno fra contenuto e bordo.</text></g>
    <g transform="translate(1330 725)"><rect width="470" height="155" rx="26" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/><circle cx="48" cy="50" r="18" fill="#10b981"/><text x="82" y="58" fill="#065f46" font-size="23" font-weight="800">CONTENT</text><text x="36" y="100" fill="#166534" font-size="18">Area in cui vengono disposti contenuto</text><text x="36" y="128" fill="#166534" font-size="18">e discendenti dell'elemento.</text></g>
    <rect x="310" y="960" width="1300" height="70" rx="35" fill="#e2e8f0" opacity=".12"/><text x="960" y="1004" text-anchor="middle" fill="#e2e8f0" font-size="21">La dimensione visibile dipende da quale area include width: content-box oppure border-box.</text>
  </g>
</svg>
