    <g><rect x="185" y="370" width="190" height="180" rx="24" fill="#bfdbfe" stroke="#3b82f6" stroke-width="3"/><rect x="405" y="370" width="190" height="180" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><rect x="625" y="370" width="190" height="180" rx="24" fill="#bfdbfe" stroke="#3b82f6" stroke-width="3"/><path d="M180 610h640" stroke="#0284c7" stroke-width="7"/><text x="500" y="655" text-anchor="middle" fill="#075985" font-size="21" font-weight="800">UNA FILA LUNGO IL MAIN AXIS</text><text x="500" y="725" text-anchor="middle" fill="#52677f" font-size="19">menu · azioni · avatar · gruppi di controlli</text></g>
    <g><rect x="1110" y="350" width="620" height="330" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><path d="M1310 350v330M1530 350v330M1110 505h620" stroke="#a78bfa" stroke-width="18"/><rect x="1130" y="370" width="160" height="115" rx="12" fill="#ddd6fe"/><rect x="1330" y="370" width="180" height="115" rx="12" fill="#c4b5fd"/><rect x="1550" y="370" width="160" height="115" rx="12" fill="#ddd6fe"/><rect x="1130" y="525" width="380" height="135" rx="12" fill="#c4b5fd"/><rect x="1550" y="525" width="160" height="135" rx="12" fill="#ddd6fe"/><text x="1420" y="730" text-anchor="middle" fill="#5b21b6" font-size="21" font-weight="800">RIGHE E COLONNE COORDINATE</text><text x="1420" y="775" text-anchor="middle" fill="#52677f" font-size="19">shell pagina · card · regioni allineate</text></g>
    <rect x="260" y="920" width="1400" height="88" rx="44" fill="#ecfdf5"/><text x="960" y="958" text-anchor="middle" fill="#14532d" font-size="23" font-weight="800">NON SONO RIVALI</text><text x="960" y="990" text-anchor="middle" fill="#166534" font-size="19">Grid per il macro-layout; Flexbox per i gruppi interni è una combinazione normale.</text>
