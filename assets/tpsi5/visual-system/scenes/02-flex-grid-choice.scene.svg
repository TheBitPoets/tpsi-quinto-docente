<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-flex-grid-choice.svg" role="img" aria-labelledby="title desc"><title id="title">Scelta fra Flexbox e Grid</title><desc id="desc">Flexbox organizza una fila o una colonna lungo un asse, Grid coordina righe e colonne; Grid può contenere gruppi Flexbox.</desc><defs id="visual-kit-components"/><defs><linearGradient id="choiceBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="choiceShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".32"/></filter></defs><rect width="1920" height="1080" fill="url(#choiceBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="78" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">FLEXBOX O GRID?</text><text x="960" y="122" text-anchor="middle" fill="#b8c8dc" font-size="22">Scegli in base al problema di disposizione, non per abitudine</text>
    <g filter="url(#choiceShadow)"><rect x="100" y="200" width="800" height="660" rx="38" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><rect x="1020" y="200" width="800" height="660" rx="38" fill="#f5f3ff" stroke="#a78bfa" stroke-width="5"/></g>
