<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../lesson-documentation-depth.svg" role="img" aria-labelledby="title desc">
  <title id="title">Profondità richiesta nella documentazione</title>
  <desc id="desc">La dispensa seleziona nelle fonti ufficiali ciò che va studiato ora, riconosciuto, rimandato o dichiarato fuori confine.</desc>
  <defs id="visual-kit-components"/>
  <defs>
    <linearGradient id="depthBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <filter id="depthShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".32"/></filter>
    <marker id="depthArrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0 0l20 10L0 20z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#depthBg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="74" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">LA DISPENSA SELEZIONA LA PROFONDITÀ</text>
    <text x="960" y="116" text-anchor="middle" fill="#b8c8dc" font-size="21">La documentazione è più ampia della singola lezione: i confini devono essere espliciti</text>

    <g transform="translate(70 295)" filter="url(#depthShadow)">
      <rect width="340" height="300" rx="30" fill="#f8fafc"/>
      <path d="M30 0h280a30 30 0 0 1 30 30v82H0V30A30 30 0 0 1 30 0z" fill="#2563eb"/>
      <text x="170" y="51" text-anchor="middle" fill="white" font-size="24" font-weight="800">DISPENSA</text>
      <text x="170" y="82" text-anchor="middle" fill="#dbeafe" font-size="17">percorso italiano</text>
      <use href="#tpsi-document" x="98" y="126" width="144" height="132"/>
      <text x="170" y="278" text-anchor="middle" fill="#1e3a8a" font-size="17" font-weight="800">SCEGLIE E COLLEGA</text>
    </g>

    <path d="M430 445h105" fill="none" stroke="#38bdf8" stroke-width="8" marker-end="url(#depthArrow)"/>
    <text x="480" y="415" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="800">FONTI UFFICIALI</text>

    <g filter="url(#depthShadow)">
      <g transform="translate(570 270)">
        <rect width="290" height="350" rx="26" fill="#f8fafc"/>
        <path d="M26 0h238a26 26 0 0 1 26 26v78H0V26A26 26 0 0 1 26 0z" fill="#16a34a"/>
        <text x="145" y="44" text-anchor="middle" fill="white" font-size="22" font-weight="800">STUDIA ORA</text>
        <text x="145" y="76" text-anchor="middle" fill="#dcfce7" font-size="16">obiettivo corrente</text>
        <text x="145" y="162" text-anchor="middle" fill="#166534" font-size="18" font-weight="800">COMPRENDI</text>
        <text x="145" y="205" text-anchor="middle" fill="#52677f" font-size="16">spiega · applica</text>
        <text x="145" y="239" text-anchor="middle" fill="#52677f" font-size="16">verifica · motiva</text>
        <rect x="30" y="282" width="230" height="44" rx="22" fill="#dcfce7"/>
        <text x="145" y="310" text-anchor="middle" fill="#166534" font-size="15" font-weight="800">RICHIESTO IN AUTONOMIA</text>
      </g>
      <g transform="translate(890 270)">
        <rect width="290" height="350" rx="26" fill="#f8fafc"/>
        <path d="M26 0h238a26 26 0 0 1 26 26v78H0V26A26 26 0 0 1 26 0z" fill="#d97706"/>
        <text x="145" y="44" text-anchor="middle" fill="white" font-size="22" font-weight="800">RICONOSCI</text>
        <text x="145" y="76" text-anchor="middle" fill="#fff7d6" font-size="16">prima esposizione</text>
        <text x="145" y="162" text-anchor="middle" fill="#92400e" font-size="18" font-weight="800">ORIENTATI</text>
        <text x="145" y="205" text-anchor="middle" fill="#52677f" font-size="16">sai che esiste</text>
        <text x="145" y="239" text-anchor="middle" fill="#52677f" font-size="16">trovi la pagina corretta</text>
        <rect x="30" y="282" width="230" height="44" rx="22" fill="#ffedd5"/>
        <text x="145" y="310" text-anchor="middle" fill="#92400e" font-size="15" font-weight="800">NON ANCORA AUTONOMO</text>
      </g>
      <g transform="translate(1210 270)">
        <rect width="290" height="350" rx="26" fill="#f8fafc"/>
        <path d="M26 0h238a26 26 0 0 1 26 26v78H0V26A26 26 0 0 1 26 0z" fill="#64748b"/>
        <text x="145" y="44" text-anchor="middle" fill="white" font-size="22" font-weight="800">PIÙ AVANTI</text>
        <text x="145" y="76" text-anchor="middle" fill="#e2e8f0" font-size="16">lezione futura</text>
        <text x="145" y="162" text-anchor="middle" fill="#334155" font-size="18" font-weight="800">RIMANDA</text>
        <text x="145" y="205" text-anchor="middle" fill="#52677f" font-size="16">mantieni il collegamento</text>
        <text x="145" y="239" text-anchor="middle" fill="#52677f" font-size="16">indica quando tornerà</text>
        <rect x="30" y="282" width="230" height="44" rx="22" fill="#e2e8f0"/>
        <text x="145" y="310" text-anchor="middle" fill="#334155" font-size="15" font-weight="800">NON VALUTATO ORA</text>
      </g>
      <g transform="translate(1530 270)">
        <rect width="290" height="350" rx="26" fill="#f8fafc"/>
        <path d="M26 0h238a26 26 0 0 1 26 26v78H0V26A26 26 0 0 1 26 0z" fill="#475569"/>
        <text x="145" y="44" text-anchor="middle" fill="white" font-size="22" font-weight="800">FUORI CONFINE</text>
        <text x="145" y="76" text-anchor="middle" fill="#e2e8f0" font-size="16">scelta intenzionale</text>
        <text x="145" y="162" text-anchor="middle" fill="#334155" font-size="18" font-weight="800">ESCLUDI</text>
        <text x="145" y="205" text-anchor="middle" fill="#52677f" font-size="16">non copiare tutto</text>
        <text x="145" y="239" text-anchor="middle" fill="#52677f" font-size="16">proteggi il percorso</text>
        <rect x="30" y="282" width="230" height="44" rx="22" fill="#e2e8f0"/>
        <text x="145" y="310" text-anchor="middle" fill="#334155" font-size="15" font-weight="800">NON RICHIESTO</text>
      </g>
    </g>

    <rect x="310" y="850" width="1300" height="66" rx="33" fill="#e2e8f0" opacity=".12"/>
    <text x="960" y="892" text-anchor="middle" fill="#e2e8f0" font-size="20">Completezza significa coprire gli obiettivi e dichiarare i confini, non riprodurre tutta la documentazione.</text>
  </g>
</svg>
