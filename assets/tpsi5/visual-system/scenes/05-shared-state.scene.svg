<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-shared-state.svg" role="img" aria-labelledby="title desc">
  <title id="title">Dal dato locale allo stato condiviso tramite HTTP</title><desc id="desc">Due browser non condividono localStorage. Entrambi comunicano tramite richieste e risposte HTTP con un server che gestisce lo stato condiviso.</desc>
  <defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="req" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker><marker id="res" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="70" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">DA STATO LOCALE A STATO CONDIVISO</text><text x="960" y="116" text-anchor="middle" fill="#b8c8dc" font-size="22">localStorage appartiene a un browser; il server diventa il punto condiviso</text>
  <g transform="translate(90 220)"><use href="#tpsi-browser" width="420" height="270"/><text x="210" y="320" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="800">CLIENT A</text><rect x="80" y="350" width="260" height="80" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="4"/><text x="210" y="398" text-anchor="middle" fill="#3730a3" font-size="20" font-weight="700">localStorage A</text></g>
  <g transform="translate(90 650)"><use href="#tpsi-browser" width="420" height="270"/><text x="210" y="320" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="800">CLIENT B</text></g>
  <g transform="translate(1390 330)"><use href="#tpsi-server" width="400" height="305"/><text x="200" y="355" text-anchor="middle" fill="#86efac" font-size="27" font-weight="800">SERVER · STATO CONDIVISO</text></g>
  <path d="M520 340H1370" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#req)"/><text x="945" y="315" text-anchor="middle" fill="#7dd3fc" font-size="21" font-weight="800">REQUEST HTTP · intenzione</text><path d="M1370 430H520" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#res)"/><text x="945" y="470" text-anchor="middle" fill="#86efac" font-size="21" font-weight="800">RESPONSE HTTP · risultato</text>
  <path d="M520 770H1370" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#req)"/><path d="M1370 860H520" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#res)"/><text x="945" y="815" text-anchor="middle" fill="#f8fafc" font-size="20">Entrambi i client osservano le risorse esposte dalla stessa API</text>
  <rect x="560" y="900" width="770" height="105" rx="28" fill="#f8fafc"/><text x="945" y="942" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">IL CONTRATTO È OSSERVABILE</text><text x="945" y="979" text-anchor="middle" fill="#52677f" font-size="19">metodo · URL · header · content · status</text></g>
</svg>
