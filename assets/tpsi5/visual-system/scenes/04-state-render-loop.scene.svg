<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" data-output="../../04-state-render-loop.svg" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo dello stato e del rendering nell'applicazione Feisbuc</title>
  <desc id="desc">L'utente genera un evento, il gestore calcola un nuovo stato, il render aggiorna il DOM e lo storage può conservare una copia serializzata. Il DOM non è la fonte primaria dei dati.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#38bdf8"/></marker><marker id="s" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#a78bfa"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="800" y="62" text-anchor="middle" fill="#f8fafc" font-size="40" font-weight="800">UNA SOLA FONTE DI VERITÀ</text>
    <text x="800" y="102" text-anchor="middle" fill="#b8c8dc" font-size="21">Gli eventi cambiano i dati; il rendering traduce i dati nel DOM</text>

    <g transform="translate(90 270)">
      <use href="#tpsi-user" x="55" y="0" width="190" height="205"/>
      <text x="150" y="245" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="800">UTENTE</text>
      <text x="150" y="274" text-anchor="middle" fill="#b8c8dc" font-size="16">submit · click</text>
    </g>
    <path d="M365 405h155" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
    <text x="442" y="382" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="800">EVENT</text>

    <g transform="translate(540 275)">
      <rect width="300" height="260" rx="32" fill="#fff7ed" stroke="#f59e0b" stroke-width="5"/>
      <text x="150" y="58" text-anchor="middle" fill="#78350f" font-size="25" font-weight="800">HANDLER</text>
      <text x="150" y="98" text-anchor="middle" fill="#7c5b24" font-size="17">legge l'intenzione</text>
      <text x="150" y="136" text-anchor="middle" fill="#7c5b24" font-size="17">valida l'input</text>
      <text x="150" y="174" text-anchor="middle" fill="#7c5b24" font-size="17">calcola il cambiamento</text>
      <rect x="44" y="202" width="212" height="36" rx="18" fill="#fde68a"/><text x="150" y="226" text-anchor="middle" fill="#78350f" font-size="15" font-weight="800">non modifica testo “a caso”</text>
    </g>
    <path d="M855 405h155" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
    <text x="932" y="382" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="800">NEW STATE</text>

    <g transform="translate(1030 245)">
      <rect width="360" height="320" rx="36" fill="#ecfdf5" stroke="#22c55e" stroke-width="6"/>
      <text x="180" y="58" text-anchor="middle" fill="#166534" font-size="28" font-weight="800">STATE</text>
      <text x="180" y="92" text-anchor="middle" fill="#3f5f4b" font-size="17">dati dell'applicazione</text>
      <g fill="#dcfce7" stroke="#22c55e" stroke-width="3"><rect x="42" y="126" width="276" height="50" rx="16"/><rect x="42" y="191" width="276" height="50" rx="16"/><rect x="42" y="256" width="276" height="40" rx="16"/></g>
      <g text-anchor="middle" fill="#14532d" font-size="17" font-family="monospace"><text x="180" y="158">posts: [...]</text><text x="180" y="223">filter: "all"</text><text x="180" y="282">currentUser: {...}</text></g>
    </g>

    <path d="M1210 580v102H730" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
    <text x="975" y="670" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="800">render(state)</text>
    <g transform="translate(520 670)">
      <rect width="200" height="120" rx="28" fill="#e0f2fe" stroke="#38bdf8" stroke-width="5"/>
      <text x="100" y="52" text-anchor="middle" fill="#075985" font-size="24" font-weight="800">RENDER</text>
      <text x="100" y="84" text-anchor="middle" fill="#52677f" font-size="16">state → nodi</text>
    </g>
    <path d="M505 730H335" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(100 635)">
      <use href="#tpsi-browser" x="0" y="0" width="220" height="141"/>
      <text x="110" y="181" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="800">DOM</text>
      <text x="110" y="207" text-anchor="middle" fill="#b8c8dc" font-size="15">vista derivata</text>
    </g>

    <path d="M1390 405h112v-175h-122" fill="none" stroke="#a78bfa" stroke-width="7" marker-end="url(#s)"/>
    <path d="M1260 230h-52" fill="none" stroke="#a78bfa" stroke-width="7" marker-end="url(#s)"/>
    <g transform="translate(1025 125)">
      <rect width="360" height="100" rx="26" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/>
      <text x="180" y="42" text-anchor="middle" fill="#5b21b6" font-size="22" font-weight="800">WEB STORAGE</text>
      <text x="180" y="73" text-anchor="middle" fill="#6d5a90" font-size="16">copia JSON persistente, non UI</text>
    </g>
    <text x="1472" y="308" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="800">save</text>
    <text x="1234" y="248" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="800">load</text>

    <g transform="translate(90 130)">
      <rect width="735" height="92" rx="26" fill="#f8fafc"/>
      <text x="28" y="38" fill="#102a43" font-size="19" font-weight="800">DOM ≠ STATE</text>
      <text x="28" y="68" fill="#52677f" font-size="17">Se il numero di like vive solo nel testo del bottone, i dati diventano fragili.</text>
    </g>
  </g>
</svg>
