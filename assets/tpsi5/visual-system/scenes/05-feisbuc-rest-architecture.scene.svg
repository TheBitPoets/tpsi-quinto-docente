<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-feisbuc-rest-architecture.svg" role="img" aria-labelledby="title desc"><title id="title">Architettura della milestone REST di Feisbuc</title><desc id="desc">Gli eventi del DOM sono coordinati da app.js, che delega le comunicazioni ad api.js. Fetch attraversa HTTP verso il server fixture. La risposta aggiorna lo stato e il rendering; localStorage non è più usato.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">FEISBUC MILESTONE 4 · CLIENT REST</text><text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">Il DOM rappresenta lo stato; api.js isola il contratto HTTP</text>
<g transform="translate(70 250)"><rect width="330" height="430" rx="34" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><use href="#tpsi-component" x="55" y="35" width="220" height="170"/><text x="165" y="250" text-anchor="middle" fill="#075985" font-size="24" font-weight="800">DOM + EVENTI</text><text x="165" y="295" text-anchor="middle" fill="#52677f" font-size="18">submit · delegation</text><text x="165" y="335" text-anchor="middle" fill="#52677f" font-size="18">loading · error · success</text></g><g transform="translate(505 250)"><rect width="330" height="430" rx="34" fill="#fffbea" stroke="#facc15" stroke-width="5"/><use href="#tpsi-badge-js" x="95" y="35" width="140" height="140"/><text x="165" y="250" text-anchor="middle" fill="#713f12" font-size="25" font-weight="800">app.js</text><text x="165" y="295" text-anchor="middle" fill="#7c5b24" font-size="18">state + render</text><text x="165" y="335" text-anchor="middle" fill="#7c5b24" font-size="18">coordina le intenzioni</text></g><g transform="translate(940 250)"><rect width="330" height="430" rx="34" fill="#ecfeff" stroke="#06b6d4" stroke-width="5"/><use href="#tpsi-api" x="55" y="35" width="220" height="147"/><text x="165" y="250" text-anchor="middle" fill="#155e75" font-size="25" font-weight="800">api.js</text><text x="165" y="295" text-anchor="middle" fill="#3f6470" font-size="18">URL + fetch + Response</text><text x="165" y="335" text-anchor="middle" fill="#3f6470" font-size="18">nessuna manipolazione DOM</text></g><g transform="translate(1440 250)"><rect width="390" height="430" rx="34" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/><use href="#tpsi-server" x="65" y="25" width="260" height="198"/><text x="195" y="270" text-anchor="middle" fill="#166534" font-size="24" font-weight="800">SERVER FIXTURE</text><text x="195" y="315" text-anchor="middle" fill="#3f5f4b" font-size="18">risorse condivise in memoria</text><text x="195" y="355" text-anchor="middle" fill="#3f5f4b" font-size="18">black box in questa UDA</text></g>
<path d="M400 430H475" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/><path d="M835 430H910" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/><path d="M1270 390H1410" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/><text x="1340" y="360" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="800">REQUEST</text><path d="M1410 520H1270" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#b)"/><text x="1340" y="560" text-anchor="middle" fill="#86efac" font-size="18" font-weight="800">RESPONSE</text><rect x="370" y="790" width="1180" height="130" rx="30" fill="#f8fafc"/><text x="960" y="839" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">FLUSSO DI OGNI AZIONE</text><text x="960" y="883" text-anchor="middle" fill="#52677f" font-size="20">intenzione → attesa → API → representation del server → nuovo state → render</text><rect x="665" y="950" width="590" height="70" rx="22" fill="#fef2f2"/><text x="960" y="994" text-anchor="middle" fill="#991b1b" font-size="20" font-weight="800">localStorage rimosso dal percorso persistente</text></g></svg>
