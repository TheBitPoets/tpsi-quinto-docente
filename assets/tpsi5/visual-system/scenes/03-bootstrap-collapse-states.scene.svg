<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../03-bootstrap-collapse-states.svg" role="img" aria-labelledby="title desc">
  <title id="title">Stati del plugin Bootstrap Collapse</title>
  <desc id="desc">Il bottone identifica il pannello tramite data-bs-target e id. Il pannello passa da collapse chiuso a collapsing durante la transizione, quindi a collapse show aperto; aria-expanded passa da false a true.</desc>
  <defs id="visual-kit-components"/>
  <defs><linearGradient id="bcsBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="bcsShadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".28"/></filter><marker id="bcsArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#8b5cf6"/></marker></defs>
  <rect width="1920" height="1080" fill="url(#bcsBg)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="44" font-weight="800">NAVBAR · IL CONTRATTO E GLI STATI DI COLLAPSE</text>
    <text x="960" y="116" text-anchor="middle" fill="#b8c8dc" font-size="21">Bootstrap JS collega controllo e pannello, poi mantiene coerenti classe visuale e stato accessibile</text>
    <g filter="url(#bcsShadow)"><rect x="120" y="205" width="1680" height="220" rx="36" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/></g>
    <text x="960" y="262" text-anchor="middle" fill="#075985" font-size="27" font-weight="800">CONTROLLO</text>
    <rect x="235" y="300" width="600" height="76" rx="20" fill="#0f2942"/><text x="535" y="348" text-anchor="middle" fill="#7dd3fc" font-size="21">data-bs-target="#main-nav"</text>
    <path d="M850 338H1050" stroke="#38bdf8" stroke-width="7" stroke-dasharray="14 12"/>
    <rect x="1085" y="300" width="600" height="76" rx="20" fill="#0f2942"/><text x="1385" y="348" text-anchor="middle" fill="#a7f3d0" font-size="21">id="main-nav"</text>
    <text x="960" y="405" text-anchor="middle" fill="#52677f" font-size="17">Il valore dopo # deve corrispondere esattamente all'id del pannello.</text>
    <g filter="url(#bcsShadow)"><rect x="100" y="560" width="480" height="280" rx="34" fill="#f8fafc" stroke="#94a3b8" stroke-width="5"/><rect x="720" y="560" width="480" height="280" rx="34" fill="#fff7ed" stroke="#f59e0b" stroke-width="5"/><rect x="1340" y="560" width="480" height="280" rx="34" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/></g>
    <g text-anchor="middle"><text x="340" y="628" fill="#334155" font-size="26" font-weight="800">CHIUSO</text><text x="340" y="696" fill="#334155" font-size="23">class="collapse"</text><text x="340" y="746" fill="#52677f" font-size="20">aria-expanded="false"</text><text x="960" y="628" fill="#92400e" font-size="26" font-weight="800">TRANSIZIONE</text><text x="960" y="696" fill="#92400e" font-size="23">class="collapsing"</text><text x="960" y="746" fill="#785e32" font-size="20">altezza animata</text><text x="1580" y="628" fill="#166534" font-size="26" font-weight="800">APERTO</text><text x="1580" y="696" fill="#166534" font-size="23">class="collapse show"</text><text x="1580" y="746" fill="#52677f" font-size="20">aria-expanded="true"</text></g>
    <path d="M600 700H690" stroke="#8b5cf6" stroke-width="7" marker-end="url(#bcsArrow)"/><path d="M1220 700H1310" stroke="#8b5cf6" stroke-width="7" marker-end="url(#bcsArrow)"/>
    <rect x="310" y="920" width="1300" height="90" rx="45" fill="#f8fafc"/><text x="960" y="976" text-anchor="middle" fill="#102a43" font-size="22" font-weight="800">Senza bundle il click non cambia classi né aria-expanded: su mobile il menu può restare nascosto.</text>
  </g>
</svg>
