<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-flexbox-axes.svg" role="img" aria-labelledby="title desc"><title id="title">Assi di Flexbox</title><desc id="desc">Un flex container con tre item mostra main axis, cross axis, main start ed end, justify-content lungo il main axis e align-items lungo il cross axis.</desc><defs id="visual-kit-components"/><defs><linearGradient id="flexBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="flexShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".32"/></filter><marker id="flexBlueArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9-18 9z" fill="#38bdf8"/></marker><marker id="flexGreenArrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9-18 9z" fill="#34d399"/></marker></defs><rect width="1920" height="1080" fill="url(#flexBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="80" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">FLEXBOX: GLI ASSI DIPENDONO DALLA DIREZIONE</text><text x="960" y="124" text-anchor="middle" fill="#b8c8dc" font-size="22">Esempio con flex-direction: row</text>
    <g filter="url(#flexShadow)"><rect x="180" y="240" width="1180" height="610" rx="40" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><text x="225" y="296" fill="#075985" font-size="22" font-weight="800">FLEX CONTAINER</text>
      <rect x="300" y="420" width="250" height="220" rx="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/><rect x="645" y="360" width="250" height="340" rx="28" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/><rect x="990" y="450" width="250" height="160" rx="28" fill="#d1fae5" stroke="#10b981" stroke-width="4"/><text x="425" y="540" text-anchor="middle" fill="#1e3a8a" font-size="25" font-weight="800">ITEM 1</text><text x="770" y="540" text-anchor="middle" fill="#5b21b6" font-size="25" font-weight="800">ITEM 2</text><text x="1115" y="540" text-anchor="middle" fill="#065f46" font-size="25" font-weight="800">ITEM 3</text>
    </g>
    <path d="M250 770h1040" stroke="#38bdf8" stroke-width="8" marker-end="url(#flexBlueArrow)"/><text x="770" y="825" text-anchor="middle" fill="#7dd3fc" font-size="23" font-weight="800">MAIN AXIS · justify-content</text><text x="250" y="742" fill="#7dd3fc" font-size="17" font-weight="800">MAIN START</text><text x="1170" y="742" fill="#7dd3fc" font-size="17" font-weight="800">MAIN END</text>
    <path d="M1450 780V300" stroke="#34d399" stroke-width="8" marker-end="url(#flexGreenArrow)"/><text x="1490" y="555" fill="#86efac" font-size="23" font-weight="800" transform="rotate(-90 1490 555)">CROSS AXIS · align-items</text>
    <g transform="translate(1520 330)"><rect width="320" height="390" rx="30" fill="#f8fafc"/><text x="160" y="58" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">DA RICORDARE</text><text x="34" y="115" fill="#52677f" font-size="18">• row: main orizzontale</text><text x="34" y="160" fill="#52677f" font-size="18">• column: main verticale</text><text x="34" y="225" fill="#075985" font-size="18" font-weight="700">justify-content</text><text x="34" y="255" fill="#52677f" font-size="17">segue sempre il main axis</text><text x="34" y="310" fill="#065f46" font-size="18" font-weight="700">align-items</text><text x="34" y="340" fill="#52677f" font-size="17">segue sempre il cross axis</text></g>
    <rect x="290" y="935" width="1340" height="72" rx="36" fill="#f59e0b" opacity=".16"/><text x="960" y="980" text-anchor="middle" fill="#fde68a" font-size="21">Non memorizzare “orizzontale” e “verticale”: individua prima flex-direction.</text>
  </g>
</svg>
