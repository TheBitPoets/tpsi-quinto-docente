<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../02-normal-flow.svg" role="img" aria-labelledby="title desc"><title id="title">Block e inline nel normal flow</title><desc id="desc">Una pagina mostra elementi block disposti verticalmente e contenuti inline che scorrono dentro una riga e vanno a capo.</desc><defs id="visual-kit-components"/><defs><linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#132b45"/></linearGradient><filter id="flowShadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter></defs><rect width="1920" height="1080" fill="url(#flowBg)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="960" y="78" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">NORMAL FLOW: IL PUNTO DI PARTENZA</text><text x="960" y="122" text-anchor="middle" fill="#b8c8dc" font-size="22">Prima di Flexbox e Grid, il browser sa già disporre il contenuto</text>
    <g filter="url(#flowShadow)"><rect x="120" y="190" width="1050" height="750" rx="35" fill="#f8fafc"/><rect x="120" y="190" width="1050" height="64" rx="35" fill="#dbeafe"/><circle cx="170" cy="222" r="10" fill="#ef4444"/><circle cx="202" cy="222" r="10" fill="#f59e0b"/><circle cx="234" cy="222" r="10" fill="#22c55e"/></g>
    <g><rect x="190" y="310" width="910" height="105" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="645" y="352" text-anchor="middle" fill="#075985" font-size="23" font-weight="800">BLOCK · &lt;h1&gt;</text><text x="645" y="384" text-anchor="middle" fill="#0c4a6e" font-size="18">occupa la riga disponibile e precede il blocco seguente</text>
      <rect x="190" y="445" width="910" height="210" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><text x="225" y="490" fill="#1e3a8a" font-size="22" font-weight="800">BLOCK · &lt;p&gt;</text><rect x="225" y="525" width="155" height="42" rx="10" fill="#d1fae5"/><text x="302" y="553" text-anchor="middle" fill="#065f46" font-size="17" font-weight="800">testo inline</text><rect x="392" y="525" width="125" height="42" rx="10" fill="#fef3c7"/><text x="454" y="553" text-anchor="middle" fill="#92400e" font-size="17" font-weight="800">&lt;a&gt; link</text><rect x="529" y="525" width="235" height="42" rx="10" fill="#d1fae5"/><text x="646" y="553" text-anchor="middle" fill="#065f46" font-size="17" font-weight="800">altro testo inline</text><rect x="225" y="580" width="270" height="42" rx="10" fill="#d1fae5"/><text x="360" y="608" text-anchor="middle" fill="#065f46" font-size="17" font-weight="800">continua sulla riga dopo</text>
      <rect x="190" y="685" width="910" height="150" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3"/><text x="645" y="746" text-anchor="middle" fill="#075985" font-size="23" font-weight="800">BLOCK · &lt;section&gt;</text><text x="645" y="786" text-anchor="middle" fill="#0c4a6e" font-size="18">inizia sotto il paragrafo precedente</text></g>
    <g transform="translate(1260 230)"><rect width="540" height="285" rx="30" fill="#eff6ff" stroke="#38bdf8" stroke-width="4"/><text x="270" y="62" text-anchor="middle" fill="#075985" font-size="27" font-weight="800">BLOCK</text><text x="42" y="118" fill="#0c4a6e" font-size="19">• inizia normalmente su una nuova riga</text><text x="42" y="160" fill="#0c4a6e" font-size="19">• si estende nello spazio disponibile</text><text x="42" y="202" fill="#0c4a6e" font-size="19">• crea una sequenza verticale</text></g>
    <g transform="translate(1260 560)"><rect width="540" height="285" rx="30" fill="#ecfdf5" stroke="#34d399" stroke-width="4"/><text x="270" y="62" text-anchor="middle" fill="#065f46" font-size="27" font-weight="800">INLINE</text><text x="42" y="118" fill="#166534" font-size="19">• scorre con testo e altri inline</text><text x="42" y="160" fill="#166534" font-size="19">• usa lo spazio richiesto dal contenuto</text><text x="42" y="202" fill="#166534" font-size="19">• va a capo quando finisce la riga</text></g>
    <rect x="320" y="975" width="1280" height="62" rx="31" fill="#e2e8f0" opacity=".12"/><text x="960" y="1015" text-anchor="middle" fill="#e2e8f0" font-size="20">display cambia il tipo di box o attiva un nuovo contesto di layout.</text>
  </g>
</svg>
