<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-http-message-anatomy.svg" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia semantica di richiesta e risposta HTTP</title><desc id="desc">La richiesta contiene metodo, target, header e contenuto. La risposta contiene status, header e contenuto. Un server interpreta la prima e produce la seconda.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#38bdf8"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0 0l18 9L0 18z" fill="#22c55e"/></marker></defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">ANATOMIA DI UNO SCAMBIO HTTP</text><text x="960" y="118" text-anchor="middle" fill="#b8c8dc" font-size="22">La semantica resta comune anche se HTTP/1.1, HTTP/2 e HTTP/3 codificano i messaggi in modo diverso</text>
  <g transform="translate(80 210)"><rect width="650" height="650" rx="38" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><text x="325" y="58" text-anchor="middle" fill="#075985" font-size="30" font-weight="800">REQUEST</text><g transform="translate(55 105)"><rect width="540" height="92" rx="20" fill="#dbeafe"/><text x="25" y="38" fill="#075985" font-size="20" font-weight="800">1 · CONTROL DATA</text><text x="25" y="70" fill="#334155" font-size="19">metodo + target</text></g><g transform="translate(55 225)"><rect width="540" height="155" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="3"/><text x="25" y="38" fill="#075985" font-size="20" font-weight="800">2 · HEADER FIELDS</text><text x="25" y="78" fill="#334155" font-size="18" font-family="monospace">Accept: application/json</text><text x="25" y="112" fill="#334155" font-size="18" font-family="monospace">Content-Type: application/json</text></g><g transform="translate(55 410)"><rect width="540" height="150" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="3"/><text x="25" y="38" fill="#075985" font-size="20" font-weight="800">3 · CONTENT · opzionale</text><text x="25" y="88" fill="#334155" font-size="18" font-family="monospace">{ "text": "Ciao" }</text></g></g>
  <g transform="translate(1190 210)"><rect width="650" height="650" rx="38" fill="#ecfdf5" stroke="#22c55e" stroke-width="5"/><text x="325" y="58" text-anchor="middle" fill="#166534" font-size="30" font-weight="800">RESPONSE</text><g transform="translate(55 105)"><rect width="540" height="92" rx="20" fill="#dcfce7"/><text x="25" y="38" fill="#166534" font-size="20" font-weight="800">1 · CONTROL DATA</text><text x="25" y="70" fill="#334155" font-size="19">status code</text></g><g transform="translate(55 225)"><rect width="540" height="155" rx="20" fill="#fff" stroke="#86efac" stroke-width="3"/><text x="25" y="38" fill="#166534" font-size="20" font-weight="800">2 · HEADER FIELDS</text><text x="25" y="78" fill="#334155" font-size="18" font-family="monospace">Content-Type: application/json</text><text x="25" y="112" fill="#334155" font-size="18" font-family="monospace">Location: /api/posts/p3</text></g><g transform="translate(55 410)"><rect width="540" height="150" rx="20" fill="#fff" stroke="#86efac" stroke-width="3"/><text x="25" y="38" fill="#166534" font-size="20" font-weight="800">3 · CONTENT · opzionale</text><text x="25" y="88" fill="#334155" font-size="18" font-family="monospace">{ "id": "p3", ... }</text></g></g>
  <g transform="translate(820 390)"><use href="#tpsi-server" width="280" height="214"/><text x="140" y="260" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">SERVER</text></g><path d="M730 330H1160" fill="none" stroke="#38bdf8" stroke-width="7" marker-end="url(#a)"/><path d="M1190 735H760" fill="none" stroke="#22c55e" stroke-width="7" marker-end="url(#b)"/>
  <rect x="330" y="910" width="1260" height="105" rx="28" fill="#f8fafc"/><text x="960" y="951" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">NON LEGGERE SOLTANTO IL JSON</text><text x="960" y="988" text-anchor="middle" fill="#52677f" font-size="19">intento, metadati, risultato e rappresentazione formano insieme il contratto</text></g>
</svg>
