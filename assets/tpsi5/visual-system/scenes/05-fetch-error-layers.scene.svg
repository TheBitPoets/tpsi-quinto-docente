<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" data-output="../../05-fetch-error-layers.svg" role="img" aria-labelledby="title desc"><title id="title">Quattro livelli di errore in una richiesta Fetch</title><desc id="desc">La diagnosi distingue fallimento di rete, CORS o abort; risposta HTTP negativa; errore nel parsing del contenuto; dati applicativi con struttura non valida.</desc><defs id="visual-kit-components"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#14324f"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="46" font-weight="800">“NON FUNZIONA” NON È UNA DIAGNOSI</text><text x="960" y="120" text-anchor="middle" fill="#b8c8dc" font-size="22">Individua il confine che ha fallito prima di cambiare il codice</text>
<g transform="translate(80 220)"><rect width="410" height="590" rx="34" fill="#fef2f2" stroke="#ef4444" stroke-width="5"/><text x="205" y="60" text-anchor="middle" fill="#991b1b" font-size="25" font-weight="800">1 · FETCH REJECT</text><text x="205" y="108" text-anchor="middle" fill="#7f1d1d" font-size="19">nessuna Response utilizzabile</text><use href="#tpsi-network" x="80" y="155" width="250" height="250"/><g fill="#7f1d1d" font-size="18"><text x="55" y="455">• rete o DNS</text><text x="55" y="495">• policy CORS</text><text x="55" y="535">• richiesta abortita</text></g></g>
<g transform="translate(530 220)"><rect width="410" height="590" rx="34" fill="#fff7ed" stroke="#f59e0b" stroke-width="5"/><text x="205" y="60" text-anchor="middle" fill="#92400e" font-size="25" font-weight="800">2 · HTTP ERROR</text><text x="205" y="108" text-anchor="middle" fill="#78350f" font-size="19">Response ricevuta · ok=false</text><text x="205" y="260" text-anchor="middle" fill="#9a3412" font-size="78" font-weight="800">404</text><text x="205" y="330" text-anchor="middle" fill="#78350f" font-size="21">status + header + body</text><text x="205" y="430" text-anchor="middle" fill="#7c5b24" font-size="18">la Promise di fetch</text><text x="205" y="465" text-anchor="middle" fill="#7c5b24" font-size="18">è fulfilled</text></g>
<g transform="translate(980 220)"><rect width="410" height="590" rx="34" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="5"/><text x="205" y="60" text-anchor="middle" fill="#5b21b6" font-size="25" font-weight="800">3 · PARSING ERROR</text><text x="205" y="108" text-anchor="middle" fill="#4c1d95" font-size="19">il contenuto non è leggibile</text><use href="#tpsi-document" x="105" y="150" width="200" height="245"/><text x="205" y="450" text-anchor="middle" fill="#5b21b6" font-size="19" font-family="monospace">response.json()</text><text x="205" y="493" text-anchor="middle" fill="#6d5a90" font-size="18">JSON vuoto o non valido</text></g>
<g transform="translate(1430 220)"><rect width="410" height="590" rx="34" fill="#eff6ff" stroke="#38bdf8" stroke-width="5"/><text x="205" y="60" text-anchor="middle" fill="#075985" font-size="25" font-weight="800">4 · DATA ERROR</text><text x="205" y="108" text-anchor="middle" fill="#0c4a6e" font-size="19">JSON valido, forma sbagliata</text><rect x="70" y="180" width="270" height="210" rx="24" fill="#fff" stroke="#93c5fd" stroke-width="3"/><text x="205" y="245" text-anchor="middle" fill="#334155" font-size="18" font-family="monospace">{ "posts": null }</text><text x="205" y="320" text-anchor="middle" fill="#075985" font-size="19">valida il contratto</text><text x="205" y="450" text-anchor="middle" fill="#52677f" font-size="18">il parsing è riuscito,</text><text x="205" y="485" text-anchor="middle" fill="#52677f" font-size="18">l'app non può usarlo</text></g>
<rect x="310" y="875" width="1300" height="110" rx="28" fill="#f8fafc"/><text x="960" y="918" text-anchor="middle" fill="#102a43" font-size="23" font-weight="800">DEVTOOLS: Network + Console + stato della UI</text><text x="960" y="958" text-anchor="middle" fill="#52677f" font-size="19">prima raccogli l'evidenza, poi scegli il recupero appropriato</text></g></svg>
