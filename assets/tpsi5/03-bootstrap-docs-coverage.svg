    <g fill="#0c4a6e" font-size="19" font-weight="800">
      <text x="96" y="222">Framework, Web Platform e Reboot</text>
      <text x="96" y="310">CSS, bundle JavaScript e caricamento</text>
      <text x="96" y="398">Container, grid Flexbox e gutter</text>
      <text x="96" y="486">Breakpoint mobile-first</text>
      <text x="96" y="574">Grammatica delle utility</text>
      <text x="96" y="662">Card, button, navbar e Collapse</text>
      <text x="96" y="750">Form, validazione e accessibilità</text>
      <text x="96" y="838">Confini dichiarati</text>
    </g>
    <g fill="#14532d" font-size="18" font-weight="800">
      <text x="1246" y="210">COPERTO · Introduction + Reboot</text>
      <text x="1246" y="298">COPERTO · Quick start + JavaScript</text>
      <text x="1246" y="386">COPERTO · Containers + Grid system</text>
      <text x="1246" y="474">COPERTO · Breakpoints</text>
      <text x="1246" y="562">COPERTO · Display + Flex + Spacing</text>
      <text x="1246" y="650">COPERTO · Components</text>
      <text x="1246" y="738">COPERTO · Forms + Accessibility</text>
    </g>
    <g fill="#52677f" font-size="15">
      <text x="1246" y="233">MDN: standard Web sottostanti</text>
      <text x="1246" y="321">CSS nel head, JS prima di /body</text>
      <text x="1246" y="409">12 colonne, righe e colonne responsive</text>
      <text x="1246" y="497">xs, sm, md, lg, xl, xxl</text>
      <text x="1246" y="585">classi piccole → proprietà CSS</text>
      <text x="1246" y="673">struttura + varianti + comportamento</text>
      <text x="1246" y="761">responsabilità condivise e test</text>
    </g>
    <text x="1246" y="826" fill="#78350f" font-size="18" font-weight="800">RICONOSCERE · CSS Grid + Sass API</text>
    <text x="1246" y="849" fill="#785e32" font-size="15">personalizzazione avanzata, non richiesta ora</text>
