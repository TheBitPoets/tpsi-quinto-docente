<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Architettura di una applicazione web full stack</title>
  <desc id="desc">Il client contiene browser e frontend HTML, CSS e JavaScript. HTTP e WebSocket attraversano la rete. Sul server la REST API espone i servizi del backend Node.js ed Express, che accede tramite SQL al database SQLite.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061322"/><stop offset="1" stop-color="#132b45"/></linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="toRight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#38bdf8"/></marker>
    <marker id="toLeft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#34d399"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="90" cy="90" r="290" fill="#0ea5e9" opacity=".08"/>
  <circle cx="1830" cy="1030" r="390" fill="#10b981" opacity=".07"/>
  <text x="960" y="70" text-anchor="middle" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800">ANATOMIA DI UNA WEB APPLICATION FULL STACK</text>
  <text x="960" y="112" text-anchor="middle" fill="#b8c8dc" font-family="Inter,Arial,sans-serif" font-size="24">Responsabilità diverse, collegate attraverso contratti espliciti</text>

  <g filter="url(#drop)">
    <rect x="60" y="155" width="650" height="805" rx="36" fill="#f8fafc"/>
    <rect x="60" y="155" width="650" height="92" rx="36" fill="url(#front)"/>
    <path d="M60 211h650v36H60z" fill="url(#front)"/>
    <text x="105" y="214" fill="white" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">CLIENT</text>
    <text x="665" y="211" text-anchor="end" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">FRONTEND</text>

    <rect x="105" y="287" width="560" height="560" rx="28" fill="#e8f4ff" stroke="#c1def7" stroke-width="3"/>
    <rect x="145" y="325" width="480" height="380" rx="18" fill="#102a43"/>
    <rect x="166" y="347" width="438" height="334" rx="8" fill="#ffffff"/>
    <rect x="166" y="347" width="438" height="52" rx="8" fill="#dceaf6"/>
    <circle cx="194" cy="373" r="8" fill="#ef4444"/><circle cx="220" cy="373" r="8" fill="#f59e0b"/><circle cx="246" cy="373" r="8" fill="#22c55e"/>
    <rect x="279" y="360" width="286" height="26" rx="13" fill="#ffffff"/>
    <text x="385" y="443" text-anchor="middle" fill="#1e3a5f" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800">BROWSER</text>
    <text x="385" y="476" text-anchor="middle" fill="#52677f" font-family="Inter,Arial,sans-serif" font-size="17">Firefox · Chrome · Safari · Edge</text>

    <g font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="800">
      <path d="M205 520h92l-9 112-37 13-37-13z" fill="#e44d26"/><path d="M251 531v101l29-10 7-91z" fill="#f16529"/><text x="251" y="590" fill="white" font-size="24">HTML</text>
      <path d="M339 520h92l-9 112-37 13-37-13z" fill="#1572b6"/><path d="M385 531v101l29-10 7-91z" fill="#33a9dc"/><text x="385" y="590" fill="white" font-size="24">CSS</text>
      <rect x="473" y="520" width="104" height="112" rx="8" fill="#f7df1e"/><text x="525" y="598" fill="#111827" font-size="38">JS</text>
    </g>
    <path d="M115 728h540l55 47H60z" fill="#69839e"/>
    <rect x="305" y="741" width="160" height="11" rx="5" fill="#9fb2c5"/>
    <text x="385" y="820" text-anchor="middle" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="21">Il codice frontend viene eseguito qui</text>

    <rect x="105" y="874" width="560" height="54" rx="27" fill="#dbeafe"/>
    <text x="385" y="909" text-anchor="middle" fill="#1e3a8a" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">interfaccia · eventi · stato · rendering</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <text x="960" y="214" fill="#cbd5e1" font-size="21" font-weight="800" letter-spacing="3">PROTOCOLLI</text>
    <path d="M750 330H1160" stroke="#38bdf8" stroke-width="9" fill="none" marker-end="url(#toRight)"/>
    <text x="955" y="300" fill="#7dd3fc" font-size="25" font-weight="800">HTTP REQUEST</text>
    <path d="M1170 424H760" stroke="#34d399" stroke-width="9" fill="none" marker-end="url(#toLeft)"/>
    <text x="965" y="466" fill="#6ee7b7" font-size="25" font-weight="800">HTTP RESPONSE</text>
    <rect x="775" y="515" width="370" height="118" rx="30" fill="#172f4a" stroke="#8b5cf6" stroke-width="3"/>
    <text x="960" y="548" fill="#ddd6fe" font-size="20" font-weight="700">WEBSOCKET</text>
    <path d="M842 580h236" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/>
    <path d="M842 580l24-15v30zM1078 580l-24-15v30z" fill="#c4b5fd"/>
    <text x="960" y="616" fill="#c4b5fd" font-size="17">canale persistente e bidirezionale</text>
    <circle cx="960" cy="718" r="90" fill="#142c47" stroke="#587694" stroke-width="3"/>
    <path d="M905 718c32-35 78-35 110 0M916 682c27 19 61 19 88 0M916 754c27-19 61-19 88 0M960 634c-31 45-31 123 0 168M960 634c31 45 31 123 0 168" fill="none" stroke="#d5e5f5" stroke-width="5" stroke-linecap="round"/>
    <text x="960" y="846" fill="#dbeafe" font-size="23" font-weight="800">RETE</text>
  </g>

  <g filter="url(#drop)">
    <rect x="1210" y="155" width="650" height="805" rx="36" fill="#f8fafc"/>
    <rect x="1210" y="155" width="650" height="92" rx="36" fill="url(#back)"/>
    <path d="M1210 211h650v36h-650z" fill="url(#back)"/>
    <text x="1255" y="214" fill="white" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">SERVER</text>
    <text x="1815" y="211" text-anchor="end" fill="#d1fae5" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">BACKEND</text>

    <rect x="1255" y="282" width="560" height="176" rx="28" fill="#eafbf3" stroke="#b7ead2" stroke-width="3"/>
    <text x="1290" y="324" fill="#166534" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="2">INTERFACCIA ESPOSTA</text>
    <text x="1290" y="366" fill="#064e3b" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="800">REST API</text>
    <text x="1290" y="404" fill="#355d52" font-family="ui-monospace,Menlo,monospace" font-size="19">GET /api/posts</text>
    <text x="1565" y="404" fill="#355d52" font-family="ui-monospace,Menlo,monospace" font-size="19">POST /api/posts</text>
    <rect x="1640" y="315" width="135" height="48" rx="24" fill="#059669"/>
    <text x="1708" y="346" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">JSON</text>

    <path d="M1535 458v54" stroke="#16a34a" stroke-width="6"/>
    <path d="M1523 500l12 18 12-18" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1255" y="516" width="560" height="196" rx="28" fill="#ecfdf5"/>
    <text x="1290" y="558" fill="#166534" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="2">IMPLEMENTAZIONE INTERNA</text>
    <polygon points="1320,595 1372,565 1424,595 1424,655 1372,685 1320,655" fill="#3c873a"/>
    <text x="1372" y="633" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">Node.js</text>
    <rect x="1452" y="578" width="150" height="90" rx="18" fill="#1f2937"/>
    <text x="1527" y="634" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">Express</text>
    <rect x="1630" y="578" width="145" height="90" rx="18" fill="#d1fae5" stroke="#34d399" stroke-width="2"/>
    <text x="1702" y="612" text-anchor="middle" fill="#065f46" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800">SERVIZI</text>
    <text x="1702" y="644" text-anchor="middle" fill="#35685a" font-family="Inter,Arial,sans-serif" font-size="16">regole · validazione</text>

    <path d="M1535 712v45" stroke="#0f766e" stroke-width="6"/>
    <rect x="1465" y="724" width="140" height="42" rx="21" fill="#0f766e"/>
    <text x="1535" y="752" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">SQL</text>

    <g>
      <ellipse cx="1535" cy="811" rx="170" ry="47" fill="#60a5fa"/>
      <rect x="1365" y="811" width="340" height="87" fill="#3b82f6"/>
      <ellipse cx="1535" cy="898" rx="170" ry="47" fill="#2563eb"/>
      <ellipse cx="1535" cy="811" rx="145" ry="30" fill="#bfdbfe" opacity=".8"/>
      <text x="1535" y="870" text-anchor="middle" fill="white" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">DATABASE · SQLite</text>
    </g>
  </g>

  <rect x="300" y="1001" width="1320" height="52" rx="26" fill="#e2e8f0" opacity=".11"/>
  <text x="960" y="1035" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="21">Il browser non accede direttamente al database: passa attraverso l'API e i controlli del backend.</text>
</svg>
