    <text x="960" y="940" text-anchor="middle" fill="#14532d" font-size="22" font-weight="800">SE SERVONO MOLTI OVERRIDE, RIVALUTA LA SCELTA</text>
    <text x="960" y="974" text-anchor="middle" fill="#52677f" font-size="19">Il framework deve ridurre il lavoro e chiarire le convenzioni, non essere combattuto.</text>
