    <text x="1580" y="610" text-anchor="middle" fill="#52677f" font-size="20">Identità o pattern</text>
    <text x="1580" y="646" text-anchor="middle" fill="#52677f" font-size="20">specifico di Feisbuc</text>
    <rect x="1405" y="690" width="350" height="70" rx="20" fill="#fed7aa" />
    <text x="1580" y="734" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="800">.feisbuc-post-header</text>
