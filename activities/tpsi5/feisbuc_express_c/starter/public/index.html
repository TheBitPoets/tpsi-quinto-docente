<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feisbuc — Express API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="custom.css">
  </head>
  <body class="bg-body-tertiary">
    <header class="border-bottom bg-body">
      <nav class="navbar navbar-expand-lg" aria-label="Navigazione principale">
        <div class="container"><h1 class="navbar-brand feisbuc-brand mb-0">Feisbuc</h1></div>
      </nav>
    </header>

    <main class="container py-4">
      <div class="row g-4">
        <section id="profilo" class="col-12 col-lg-3">
          <div class="card h-100"><div class="card-body"><h2 class="h4">Profilo</h2><p class="profile-note">Studente Full Stack</p></div></div>
        </section>

        <section id="feed" class="col-12 col-lg-6" aria-labelledby="feed-title">
          <h2 id="feed-title" class="h4 mb-3">Feed</h2>
          <form id="composer-form" class="card mb-4">
            <div class="card-body">
              <label for="post-text" class="form-label fw-semibold">Nuovo post</label>
              <textarea id="post-text" name="text" class="form-control" rows="3" maxlength="280" required></textarea>
              <div class="d-flex justify-content-between align-items-center gap-2 mt-3">
                <small class="text-body-secondary">Massimo 280 caratteri</small>
                <button class="btn btn-primary" type="submit">Pubblica</button>
              </div>
            </div>
          </form>
          <div id="feed-alert" class="alert d-none" role="alert"></div>
          <p id="feed-status" class="visually-hidden" aria-live="polite"></p>
          <div id="post-list" aria-busy="true"></div>
        </section>

        <aside id="tendenze" class="col-12 col-lg-3">
          <div class="card h-100"><div class="card-body"><h2 class="h4">Tendenze</h2><ul class="list-group list-group-flush"><li class="list-group-item">#nodejs</li><li class="list-group-item">#express</li><li class="list-group-item">#middleware</li></ul></div></div>
        </aside>
      </div>
    </main>

    <footer class="border-top bg-body py-3"><div class="container"><p class="mb-0">Feisbuc — TPSI quinto</p></div></footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
