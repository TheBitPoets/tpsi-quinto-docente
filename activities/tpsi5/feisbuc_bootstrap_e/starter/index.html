<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feisbuc — milestone Bootstrap</title>
    <link rel="stylesheet" href="custom.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <h1>Feisbuc</h1>
        <nav aria-label="Navigazione principale">
          <ul class="nav-list">
            <li><a href="#profilo">Profilo</a></li>
            <li><a href="#feed">Feed</a></li>
            <li><a href="#tendenze">Tendenze</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section id="profilo" class="panel">
        <h2>Profilo</h2>
        <p>Studente Full Stack</p>
      </section>

      <section id="feed" class="feed-panel">
        <h2>Feed</h2>

        <article class="post">
          <h3>Primo post</h3>
          <p>Sto imparando a distinguere il framework dal CSS che usa sotto.</p>
          <div class="post-actions">
            <button type="button">Mi piace</button>
            <button type="button">Commenta</button>
          </div>
        </article>

        <article class="post">
          <h3>Secondo post</h3>
          <p>Il layout deve restare responsive e semanticamente corretto.</p>
          <div class="post-actions">
            <button type="button">Mi piace</button>
            <button type="button">Commenta</button>
          </div>
        </article>
      </section>

      <aside id="tendenze" class="panel">
        <h2>Tendenze</h2>
        <ul>
          <li>#html</li>
          <li>#css</li>
          <li>#bootstrap</li>
        </ul>
      </aside>
    </main>

    <footer class="site-footer">
      <p>Feisbuc — TPSI quinto</p>
    </footer>
  </body>
</html>
