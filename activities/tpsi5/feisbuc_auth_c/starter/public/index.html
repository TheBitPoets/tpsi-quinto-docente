<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feisbuc — autenticazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="custom.css">
  </head>
  <body class="bg-body-tertiary">
    <header class="border-bottom bg-body"><nav class="navbar"><div class="container d-flex justify-content-between"><h1 class="navbar-brand mb-0">Feisbuc</h1><div id="user-panel" class="d-none align-items-center gap-2"><span id="current-user" class="small"></span><button id="logout-button" class="btn btn-outline-secondary btn-sm" type="button">Esci</button></div></div></nav></header>
    <main class="container py-4">
      <section id="auth-panel" class="row g-4 mb-4">
        <div class="col-12 col-lg-6"><form id="register-form" class="card h-100"><div class="card-body"><h2 class="h5">Registrati</h2><label class="form-label" for="register-name">Nome visibile</label><input id="register-name" name="displayName" class="form-control mb-3" required><label class="form-label" for="register-email">Email</label><input id="register-email" name="email" type="email" class="form-control mb-3" required><label class="form-label" for="register-password">Password</label><input id="register-password" name="password" type="password" minlength="15" class="form-control mb-3" required><button class="btn btn-primary">Crea account</button></div></form></div>
        <div class="col-12 col-lg-6"><form id="login-form" class="card h-100"><div class="card-body"><h2 class="h5">Accedi</h2><label class="form-label" for="login-email">Email</label><input id="login-email" name="email" type="email" class="form-control mb-3" required><label class="form-label" for="login-password">Password</label><input id="login-password" name="password" type="password" class="form-control mb-3" required><button class="btn btn-outline-primary">Accedi</button></div></form></div>
      </section>
      <div id="app-alert" class="alert d-none" role="alert"></div><p id="app-status" class="visually-hidden" aria-live="polite"></p>
      <section id="feed-shell" class="d-none"><div class="row g-4"><section class="col-12 col-lg-3"><div class="card"><div class="card-body"><h2 class="h5">Sessione</h2><p>Identita dal backend.</p></div></div></section><section class="col-12 col-lg-6"><h2 class="h4">Feed</h2><form id="composer-form" class="card mb-4"><div class="card-body"><textarea name="text" class="form-control" maxlength="280" required></textarea><div class="text-end mt-3"><button class="btn btn-primary">Pubblica</button></div></div></form><div id="post-list"></div></section><aside class="col-12 col-lg-3"><div class="card"><div class="card-body"><h2 class="h5">Auth</h2><p class="small">Cookie HttpOnly + server authorization.</p></div></div></aside></div></section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
