<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feisbuc — feed dinamico</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="custom.css">
  </head>
  <body class="bg-body-tertiary">
    <header class="border-bottom bg-body">
      <nav class="navbar navbar-expand-lg" aria-label="Navigazione principale">
        <div class="container">
          <h1 class="navbar-brand feisbuc-brand mb-0">Feisbuc</h1>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Mostra o nascondi navigazione"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#profilo">Profilo</a></li>
              <li class="nav-item"><a class="nav-link" href="#feed">Feed</a></li>
              <li class="nav-item"><a class="nav-link" href="#tendenze">Tendenze</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-4">
      <div class="row g-4">
        <section id="profilo" class="col-12 col-lg-3">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="card-title h4">Profilo</h2>
              <p class="card-text profile-note">Studente Full Stack</p>
            </div>
          </div>
        </section>

        <section id="feed" class="col-12 col-lg-6" aria-labelledby="feed-title">
          <h2 id="feed-title" class="h4 mb-3">Feed</h2>

          <form id="composer-form" class="card mb-4">
            <div class="card-body">
              <label for="post-text" class="form-label fw-semibold">Nuovo post</label>
              <textarea
                id="post-text"
                name="text"
                class="form-control"
                rows="3"
                maxlength="280"
                required
              ></textarea>
              <div class="d-flex justify-content-between align-items-center gap-2 mt-3">
                <small class="text-body-secondary">Massimo 280 caratteri</small>
                <button class="btn btn-primary" type="submit">Pubblica</button>
              </div>
            </div>
          </form>

          <p id="feed-status" class="visually-hidden" aria-live="polite"></p>
          <div id="post-list"></div>
        </section>

        <aside id="tendenze" class="col-12 col-lg-3">
          <div class="card h-100">
            <div class="card-body">
              <h2 class="card-title h4">Tendenze</h2>
              <ul class="list-group list-group-flush">
                <li class="list-group-item">#javascript</li>
                <li class="list-group-item">#dom</li>
                <li class="list-group-item">#events</li>
              </ul>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <footer class="border-top bg-body py-3">
      <div class="container">
        <p class="mb-0">Feisbuc — TPSI quinto</p>
      </div>
    </footer>

    <script type="module" src="app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
